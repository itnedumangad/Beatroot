<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Beatroot - Customer Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#111827}
button,a{text-decoration:none;font-family:inherit}
a{color:inherit}
.layout{min-height:100vh;display:flex}
.sidebar{width:245px;background:#111827;color:#fff;position:fixed;inset:0 auto 0 0;padding:24px 14px;z-index:20}
.brand{font-size:28px;font-weight:800;padding:0 14px 28px}.brand span{color:#ef4444}
.panel-label{font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:1px;padding:0 14px 10px}
.nav{list-style:none}.nav li{margin:5px 0}.nav button{width:100%;border:0;background:transparent;color:#d1d5db;padding:12px 14px;border-radius:10px;text-align:left;cursor:pointer;font-size:13px}.nav button:hover,.nav button.active{background:#ef4444;color:#fff}
.sidebar-bottom{position:absolute;left:14px;right:14px;bottom:18px}.logout{width:100%;padding:11px;border:1px solid #374151;background:transparent;color:#d1d5db;border-radius:10px;cursor:pointer}.logout:hover{background:#1f2937;color:#fff}
.main{margin-left:245px;width:calc(100% - 245px);min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid #e5e7eb;padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}.title{font-size:21px;font-weight:800}.profile{display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;border-radius:50%;background:#ef4444;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}.profile small{display:block;color:#6b7280;font-size:11px}.mobile{display:none}
.content{padding:28px}.welcome{margin-bottom:22px}.welcome h1{font-size:27px;margin-bottom:5px}.welcome p{color:#6b7280;font-size:13px}
.message{display:none;padding:12px 14px;border-radius:10px;margin-bottom:18px;font-size:13px}.message.show{display:block}.message.error{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}.message.success{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}.message.warning{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:20px}.stat .label{font-size:12px;color:#6b7280}.stat h2{font-size:26px;margin-top:12px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:20px;margin-bottom:20px}.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.card h2{font-size:17px}.btn{border:0;background:#ef4444;color:#fff;border-radius:9px;padding:9px 13px;font-size:12px;font-weight:700;cursor:pointer}.btn.secondary{background:#f3f4f6;color:#374151}.btn.danger{background:#dc2626}.btn.success{background:#16a34a}.grid2{display:grid;grid-template-columns:2fr 1fr;gap:20px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;color:#6b7280;padding:11px 7px;border-bottom:1px solid #eee}td{padding:13px 7px;border-bottom:1px solid #f1f1f1;font-size:12px}.status{display:inline-block;padding:5px 9px;border-radius:18px;font-size:10px;font-weight:700}.pending{background:#fef3c7;color:#92400e}.confirmed{background:#dbeafe;color:#1d4ed8}.preparing{background:#ffedd5;color:#c2410c}.picked_up,.out_for_delivery{background:#ede9fe;color:#6d28d9}.delivered,.completed{background:#dcfce7;color:#15803d}.cancelled,.rejected{background:#fee2e2;color:#dc2626}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{padding:17px 10px;border:1px solid #e5e7eb;border-radius:11px;background:#fafafa;text-align:center;cursor:pointer;font-weight:700;font-size:12px}.action:hover{background:#fff1f2;border-color:#fecaca}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:12px}.field label{display:block;font-size:11px;font-weight:700;color:#374151;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #e5e7eb;border-radius:9px;padding:10px 11px;outline:0;background:#fafafa;font-size:13px}.field textarea{min-height:85px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.08);background:#fff}
.kpi{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee;font-size:13px}.kpi:last-child{border:0}.empty{text-align:center;padding:35px;color:#6b7280}
@media(max-width:1000px){.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
@media(max-width:700px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%}.mobile{display:block;border:0;background:#f3f4f6;border-radius:8px;padding:9px;cursor:pointer}.topbar{padding:0 15px}.content{padding:20px 15px}.form-grid{grid-template-columns:1fr}.profile-text{display:none}}
@media(max-width:450px){.stats{grid-template-columns:1fr}}
</style></head><body>
<div class="layout">
<aside class="sidebar" id="sidebar"><div class="brand">Beat<span>root</span></div><div class="panel-label">CUSTOMER PANEL</div><ul class="nav"><li><button class="" onclick="go('customer-dashboard.html')">📊 Dashboard</button></li><li><button class="" onclick="go('restaurants.html')">🍔 Restaurants</button></li><li><button class="" onclick="go('cart.html')">🛒 Cart</button></li><li><button class="" onclick="go('my-orders.html')">📦 My Orders</button></li><li><button class="" onclick="go('favorites.html')">❤️ Favorites</button></li><li><button class="" onclick="go('profile.html')">👤 Profile</button></li><li><button class="" onclick="go('notifications.html')">🔔 Notifications</button></li><li><button class="" onclick="go('settings.html')">⚙️ Settings</button></li></ul>
<div class="sidebar-bottom"><button class="logout" onclick="logout()">🚪 Logout</button></div></aside>
<div class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobile" onclick="toggleSidebar()">☰</button><div class="title">Customer Dashboard</div></div>
<div class="profile"><div class="avatar" id="avatar">B</div><div class="profile-text"><strong id="userName">Loading...</strong><small id="userRole">CUSTOMER PANEL</small></div></div></header>
<main class="content">
<div class="welcome"><h1>Customer Dashboard 👋</h1><p>Browse restaurants, manage your cart and track your orders.</p></div>
<div id="message" class="message"></div>
<section class="stats">
<div class="stat"><span class="label">Total Orders</span><h2 id="totalOrders">0</h2></div>
<div class="stat"><span class="label">Today's Orders</span><h2 id="todayOrders">0</h2></div>
<div class="stat"><span class="label">Cart Items</span><h2 id="cartCount">0</h2></div>
<div class="stat"><span class="label">Delivered</span><h2 id="delivered">0</h2></div>
</section>
<section class="grid2">
<div class="card"><div class="card-head"><h2>Recent Orders</h2><button class="btn secondary" onclick="go('my-orders.html')">View All</button></div>
<div style="overflow:auto"><table><thead><tr><th>ORDER</th><th>RESTAURANT</th><th>STATUS</th><th>TOTAL</th></tr></thead><tbody id="orders"><tr><td colspan="4" class="empty">Loading...</td></tr></tbody></table></div></div>
<div>
<div class="card"><div class="card-head"><h2>Quick Actions</h2></div><div class="actions">
<button class="action" onclick="go('restaurants.html')">🍔 Restaurants</button>
<button class="action" onclick="go('cart.html')">🛒 Cart</button>
<button class="action" onclick="go('my-orders.html')">📦 My Orders</button>
<button class="action" onclick="go('favorites.html')">❤️ Favorites</button>
<button class="action" onclick="go('addresses.html')">📍 Addresses</button>
<button class="action" onclick="go('profile.html')">👤 Profile</button>
<button class="action" onclick="go('notifications.html')">🔔 Notifications</button>
<button class="action" onclick="go('settings.html')">⚙️ Settings</button>
</div></div>
</div></section>
</main></div></div>
<script>
const SUPABASE_URL="https://jhihjnsxazmftdqlitgk.supabase.co";
const SUPABASE_KEY="sb_publishable_r_zMn0-GhFNtuvs5-UOo9w_D8SW8J57";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null;
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open")}
function go(page){window.location.href=page}
function showMessage(text,type="error"){const e=document.getElementById("message");e.textContent=text;e.className="message show "+type}
async function logout(){if(!confirm("Are you sure you want to logout?"))return;await sb.auth.signOut();window.location.href="login.html"}
function statusClass(s){s=String(s||"pending").toLowerCase();return ["pending","confirmed","preparing","picked_up","out_for_delivery","delivered","completed","cancelled"].includes(s)?s:"pending"}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
async function init(){
  try{
    const {data:{user},error}=await sb.auth.getUser(); if(error)throw error;
    if(!user){window.location.href="login.html";return}
    currentUser=user;
    document.getElementById("userName").textContent=(user.email||"Customer").split("@")[0];
    document.getElementById("avatar").textContent=(user.email||"C").charAt(0).toUpperCase();
    const {data:role,error:roleError}=await sb.from("user_roles").select("role,approval_status").eq("user_id",user.id).maybeSingle();
    if(roleError)throw roleError;
    if(!role || String(role.role).toLowerCase()!=="customer"){await sb.auth.signOut();window.location.href="login.html";return}
    const {data:orders,error:oerr}=await sb.from("orders").select("id,status,total,total_amount,restaurant_id,created_at").eq("customer_id",user.id).order("created_at",{ascending:false});
    if(oerr)throw oerr;
    const list=orders||[]; document.getElementById("totalOrders").textContent=list.length;
    const today=new Date().toISOString().slice(0,10); document.getElementById("todayOrders").textContent=list.filter(o=>o.created_at&&o.created_at.startsWith(today)).length;
    document.getElementById("delivered").textContent=list.filter(o=>["delivered","completed"].includes(String(o.status||"").toLowerCase())).length;
    const ids=[...new Set(list.map(o=>o.restaurant_id).filter(Boolean))]; let restaurants=[];
    if(ids.length){const r=await sb.from("restaurants").select("id,name").in("id",ids); if(!r.error)restaurants=r.data||[]}
    const names=new Map(restaurants.map(r=>[String(r.id),r.name]));
    document.getElementById("orders").innerHTML=list.slice(0,8).map(o=>`<tr><td><b>#${esc(o.id)}</b></td><td>${esc(names.get(String(o.restaurant_id))||"Restaurant")}</td><td><span class="status ${statusClass(o.status)}">${esc(String(o.status||"pending").replace(/_/g," "))}</span></td><td><b>₹${Number(o.total_amount??o.total??0).toLocaleString("en-IN")}</b></td></tr>`).join("")||'<tr><td colspan="4" class="empty">No orders yet.</td></tr>';
    const c=await sb.from("cart_items").select("id,quantity",{count:"exact"}).eq("customer_id",user.id); if(!c.error)document.getElementById("cartCount").textContent=c.data?.reduce((n,x)=>n+Number(x.quantity||0),0)||0;
  }catch(e){console.error(e);showMessage(e.message||"Unable to load customer dashboard.")}
}
init();
</script></body></html>
