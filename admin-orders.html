<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beatroot - Orders</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#171717;
}

/* SIDEBAR */

.side{
    position:fixed;
    top:0;
    left:0;
    bottom:0;
    width:250px;
    background:#111827;
    color:white;
    padding:25px 15px;
    z-index:1000;
}

.brand{
    font-size:28px;
    font-weight:800;
    padding:0 15px 30px;
}

.brand span{
    color:#ef4444;
}

.label{
    font-size:12px;
    color:#9ca3af;
    padding:0 15px 10px;
    text-transform:uppercase;
}

.menu button,
.logout{
    width:100%;
    border:0;
    background:transparent;
    color:#d1d5db;
    padding:13px 15px;
    text-align:left;
    border-radius:10px;
    cursor:pointer;
    margin:3px 0;
    font-size:14px;
}

.menu button:hover,
.menu button.active{
    background:#ef4444;
    color:white;
}

.bottom{
    position:absolute;
    bottom:20px;
    left:15px;
    right:15px;
}

.logout{
    border:1px solid #374151;
}

.logout:hover{
    background:#1f2937;
}

/* MAIN */

.main{
    margin-left:250px;
}

.top{
    height:75px;
    background:white;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
    position:sticky;
    top:0;
    z-index:500;
}

.title{
    font-size:22px;
    font-weight:700;
}

.profile{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#ef4444;
    color:white;
    display:grid;
    place-items:center;
    font-weight:bold;
}

/* CONTENT */

.content{
    padding:30px;
}

.head{
    margin-bottom:22px;
}

.head h1{
    margin-bottom:6px;
    font-size:28px;
}

.head p{
    color:#6b7280;
}

/* ERROR */

.error{
    display:none;
    background:#fee2e2;
    color:#b91c1c;
    padding:14px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:14px;
}

/* CARD */

.card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:16px;
    padding:22px;
}

/* TOOLBAR */

.toolbar{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.search{
    flex:1;
    min-width:220px;
    height:44px;
    border:1px solid #ddd;
    border-radius:10px;
    padding:0 13px;
    font-size:14px;
    outline:none;
}

.search:focus{
    border-color:#ef4444;
}

.filter{
    height:44px;
    border:1px solid #ddd;
    border-radius:10px;
    padding:0 12px;
    background:white;
    cursor:pointer;
}

.refresh{
    height:44px;
    border:0;
    border-radius:10px;
    padding:0 16px;
    background:#111827;
    color:white;
    cursor:pointer;
}

.refresh:hover{
    background:#1f2937;
}

/* COUNT */

.count{
    font-size:13px;
    color:#6b7280;
    margin-bottom:10px;
}

/* TABLE */

.table{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th,
td{
    text-align:left;
    padding:14px 10px;
    border-bottom:1px solid #eee;
    font-size:13px;
}

th{
    font-size:12px;
    color:#6b7280;
}

.order-link{
    font-weight:bold;
    color:#111827;
    cursor:pointer;
}

.order-link:hover{
    color:#ef4444;
}

.customer{
    max-width:220px;
    word-break:break-word;
    color:#6b7280;
}

/* STATUS */

.status{
    border:0;
    border-radius:20px;
    padding:7px 10px;
    font-size:11px;
    font-weight:bold;
    cursor:pointer;
}

.status.pending{
    background:#fef3c7;
    color:#92400e;
}

.status.confirmed{
    background:#dbeafe;
    color:#2563eb;
}

.status.preparing{
    background:#ffedd5;
    color:#c2410c;
}

.status.delivered{
    background:#dcfce7;
    color:#15803d;
}

.status.cancelled{
    background:#fee2e2;
    color:#dc2626;
}

/* VIEW */

.view-btn{
    border:0;
    background:#f3f4f6;
    color:#111827;
    padding:8px 13px;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
    font-weight:600;
}

.view-btn:hover{
    background:#fee2e2;
    color:#ef4444;
}

/* MESSAGE */

.msg{
    text-align:center;
    padding:35px;
    color:#777;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:5000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:680px;
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:20px;
    box-shadow:0 25px 80px rgba(0,0,0,.30);
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 22px;
    border-bottom:1px solid #eee;
    position:sticky;
    top:0;
    background:white;
    z-index:2;
}

.modal-head h2{
    font-size:21px;
}

.close-btn{
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:#f3f4f6;
    font-size:20px;
    cursor:pointer;
}

.close-btn:hover{
    background:#fee2e2;
    color:#ef4444;
}

.modal-body{
    padding:22px;
}

/* CUSTOMER */

.customer-box{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:16px;
    margin-bottom:20px;
}

.customer-title{
    font-size:15px;
    font-weight:700;
    margin-bottom:12px;
}

.customer-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.customer-field{
    background:white;
    border:1px solid #eee;
    border-radius:10px;
    padding:11px;
}

.field-label{
    font-size:11px;
    color:#6b7280;
    margin-bottom:5px;
}

.field-value{
    font-size:13px;
    font-weight:600;
    word-break:break-word;
}

/* INFO */

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:22px;
}

.info-box{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:12px;
}

/* ITEMS */

.items-title{
    font-size:17px;
    font-weight:700;
    margin-bottom:5px;
}

.item-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:14px 0;
    border-bottom:1px solid #eee;
}

.item-name{
    font-weight:600;
    font-size:14px;
}

.item-meta{
    color:#777;
    font-size:12px;
    margin-top:5px;
}

.item-price{
    font-weight:700;
    white-space:nowrap;
}

/* TOTAL */

.order-total{
    display:flex;
    justify-content:space-between;
    padding:18px 0;
    font-size:19px;
    font-weight:800;
    border-bottom:1px solid #eee;
}

/* STATUS UPDATE */

.status-area{
    margin-top:18px;
}

.status-area label{
    display:block;
    font-size:12px;
    color:#6b7280;
    margin-bottom:7px;
}

.status-select{
    width:100%;
    height:46px;
    border:1px solid #ddd;
    border-radius:10px;
    padding:0 12px;
    background:white;
    cursor:pointer;
    font-size:14px;
}

/* MOBILE */

@media(max-width:700px){

    .side{
        transform:translateX(-100%);
    }

    .main{
        margin-left:0;
    }

    .content{
        padding:20px 15px;
    }

    .top{
        padding:0 15px;
    }

    .profile strong{
        display:none;
    }

    .customer-row,
    .info-grid{
        grid-template-columns:1fr;
    }

    .modal{
        padding:10px;
    }

    .modal-box{
        max-height:95vh;
        border-radius:16px;
    }
}

</style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="side">

    <div class="brand">
        Beat<span>root</span>
    </div>

    <div class="label">
        Admin Panel
    </div>

    <div class="menu">

        <button onclick="go('admin-dashboard.html')">
            📊 Dashboard
        </button>

        <button class="active">
            🛒 Orders
        </button>

        <button onclick="go('admin-customers.html')">
            👥 Customers
        </button>

        <button onclick="go('admin-restaurants.html')">
            🍔 Restaurants
        </button>

        <button onclick="go('admin-reports.html')">
            📈 Reports
        </button>

        <button onclick="go('settings.html')">

        </button>

    </div>

    <div class="bottom">

        <button class="logout" onclick="logout()">
            🚪 Logout
        </button>

    </div>

</aside>

<!-- MAIN -->

<div class="main">

<header class="top">

    <div class="title">
        Orders
    </div>

    <div class="profile">

        <div class="avatar" id="avatar">
            A
        </div>

        <strong id="adminName">
            Admin
        </strong>

    </div>

</header>

<main class="content">

    <div class="head">

        <h1>
            Orders
        </h1>

        <p>
            Manage customer orders and update their status.
        </p>

    </div>

    <div class="error" id="error"></div>

    <section class="card">

        <div class="toolbar">

            <input
                id="search"
                class="search"
                placeholder="Search order ID or customer ID..."
            >

            <select id="filter" class="filter">

                <option value="">
                    All Status
                </option>

                <option value="pending">
                    Pending
                </option>

                <option value="confirmed">
                    Confirmed
                </option>

                <option value="preparing">
                    Preparing
                </option>

                <option value="delivered">
                    Delivered
                </option>

                <option value="cancelled">
                    Cancelled
                </option>

            </select>

            <button class="refresh" onclick="loadOrders()">
                ↻ Refresh

        </div>

        <div class="table">

            <table>

                <thead>

                    <tr>
                        <th>ORDER</th>
                        <th>CUSTOMER</th>

                </thead>

                <tbody id="rows">

                    <tr>

                        <td colspan="6" class="msg">
                            Loading orders...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>

</div>

<!-- ORDER MODAL -->

<div
    class="modal"
    id="orderModal"
    onclick="closeOutside(event)"
>

    <div class="modal-box">

        <div class="modal-head">

            <h2>
                Order Details
            </h2>

            <button
                class="close-btn"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>

        <div
            class="modal-body"
            id="modalBody"
        >
            Loading...
        </div>

    </div>

</div>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://jhihjnsxazmftdqlitgk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_r_zMn0-GhFNtuvs5-UOo9w_D8SW8J57";

const ADMIN_EMAIL =
    "itnedumangad@gmail.com";

const sb =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   VARIABLES
========================= */

let orders = [];
let selectedOrder = null;


/* =========================
   ELEMENTS
========================= */

const search =
    document.getElementById("search");

const filter =
    document.getElementById("filter");

const rows =
    document.getElementById("rows");

const count =
    document.getElementById("count");

const errorBox =
    document.getElementById("error");

const modal =
    document.getElementById("orderModal");

const modalBody =
    document.getElementById("modalBody");

const adminName =
    document.getElementById("adminName");

const avatar =
    document.getElementById("avatar");


/* =========================
   ESCAPE HTML
========================= */

function esc(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   STATUS
========================= */

function normalizeStatus(value){

    const status =
        String(value || "pending")
        .toLowerCase()
        .trim();

    if(status === "processing"){
        return "preparing";
    }

    if(status === "completed"){
        return "delivered";
    }

    if(
        status === "canceled" ||
        status === "cancel"
    ){
        return "cancelled";
    }

    const allowed = [
        "pending",
        "confirmed",
        "preparing",
        "delivered",
        "cancelled"
    ];

    return allowed.includes(status)
        ? status
        : "pending";
}


/* =========================
   NAVIGATION
========================= */

function go(page){

    window.location.href = page;

}


/* =========================
   AUTH
========================= */

async function checkAuth(){

    try{

        const {
            data,
            error
        } =
        await sb.auth.getUser();

        if(error || !data || !data.user){

            window.location.href =
                "login.html";

            return false;
        }

        const user =
            data.user;

        if(
            !user.email ||
            user.email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
        ){

            alert(
                "Access denied. Admin only."
            );

            window.location.href =
                "../index.html";

            return false;
        }

        const email =
            user.email;

        adminName.textContent =
            email.split("@")[0];

        avatar.textContent =
            email.charAt(0).toUpperCase();

        return true;

    }
    catch(error){

        console.error(error);

        window.location.href =
            "login.html";

        return false;
    }

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

    errorBox.style.display =
        "none";

    rows.innerHTML = `
        <tr>
            <td colspan="6" class="msg">
                Loading orders...
            </td>
        </tr>
    `;

    count.textContent =
        "Loading...";

    const authenticated =
        await checkAuth();

    if(!authenticated){
        return;
    }

    try{

        const {
            data,
            error
        } =
        await sb
            .from("orders")
            .select(
                "id,status,total,customer_id,created_at"
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );

        if(error){
            throw error;
        }

        orders =
            data || [];

        render();

    }
    catch(error){

        console.error(
            "Orders error:",
            error
        );

        errorBox.textContent =
            "Orders loading error: " +
            error.message;

        errorBox.style.display =
            "block";

        count.textContent =
            "0 orders";

        rows.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="msg"
                >
                    Unable to load orders.
                    <br><br>
                    ${esc(error.message)}
                </td>
            </tr>
        `;
    }

}


/* =========================
   RENDER
========================= */

function render(){

    const query =
        search.value
            .toLowerCase()
            .trim();

    const selectedFilter =
        filter.value;

    const list =
        orders.filter(order => {

            const orderId =
                String(
                    order.id || ""
                )
                .toLowerCase();

            const customerId =
                String(
                    order.customer_id || ""
                )
                .toLowerCase();

            const status =
                normalizeStatus(
                    order.status
                );

            const searchMatch =
                !query ||
                orderId.includes(query) ||
                customerId.includes(query);

            const filterMatch =
                !selectedFilter ||
                status === selectedFilter;

            return (
                searchMatch &&
                filterMatch
            );

        });

    count.textContent =
        list.length +
        " order" +
        (
            list.length === 1
                ? ""
                : "s"
        );

    if(!list.length){

        rows.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="msg"
                >
                    No orders found.
                </td>
            </tr>
        `;

        return;
    }

    rows.innerHTML =
        list
            .map(order => {

                const status =
                    normalizeStatus(
                        order.status
                    );

                const date =
                    order.created_at
                        ? new Date(
                            order.created_at
                          ).toLocaleString(
                            "en-IN"
                          )
                        : "-";

                const total =
                    Number(
                        order.total || 0
                    ).toLocaleString(
                        "en-IN"
                    );

                return `
                    <tr>

                        <td>

                            <span
                                class="order-link"
                                onclick="openOrder(${Number(order.id)})"
                            >
                                #${esc(order.id)}
                            </span>

                        </td>

                        <td class="customer">

                            ${esc(
                                order.customer_id ||
                                "Customer"
                            )}

                        </td>

                        <td>
                            ${esc(date)}
                        </td>

                        <td>

                            <select
                                class="status ${status}"
                                onchange="
                                    updateStatus(
                                        ${Number(order.id)},
                                        this.value
                                    )
                                "
                            >

                                <option
                                    value="pending"
                                    ${status === "pending" ? "selected" : ""}
                                >
                                    Pending
                                </option>

                                <option
                                    value="confirmed"
                                    ${status === "confirmed" ? "selected" : ""}
                                >
                                    Confirmed
                                </option>

                                <option
                                    value="preparing"
                                    ${status === "preparing" ? "selected" : ""}
                                >
                                    Preparing
                                </option>

                                <option
                                    value="delivered"
                                    ${status === "delivered" ? "selected" : ""}
                                >
                                    Delivered
                                </option>

                                <option
                                    value="cancelled"
                                    ${status === "cancelled" ? "selected" : ""}
                                >
                                    Cancelled
                                </option>

                            </select>

                        </td>

                        <td>
                            <b>₹${total}</b>
                        </td>

                        <td>

                            <button
                                class="view-btn"
                                onclick="
                                    openOrder(
                                        ${Number(order.id)}
                                    )
                                "
                            >
                                View
                            </button>

                        </td>

                    </tr>
                `;

            })
            .join("");

}


/* =========================
   OPEN ORDER
========================= */

async function openOrder(orderId){

    modal.classList.add("show");

    modalBody.innerHTML = `
        <div class="msg">
            Loading order details...
        </div>
    `;

    const order =
        orders.find(
            item =>
                Number(item.id) ===
                Number(orderId)
        );

    if(!order){

        modalBody.innerHTML = `
            <div class="msg">
                Order not found.
            </div>
        `;

        return;
    }

    selectedOrder =
        order;


    /* ORDER ITEMS */

    const itemResult =
        await sb
            .from("order_items")
            .select(
                "id,order_id,menu_item_id,item_name,quantity,unit_price"
            )
            .eq(
                "order_id",
                orderId
            )
            .order(
                "id",
                {
                    ascending:true
                }
            );


    if(itemResult.error){

        modalBody.innerHTML = `
            <div class="msg">

                Unable to load order items.

                <br><br>

                ${esc(
                    itemResult.error.message
                )}

            </div>
        `;

        return;
    }


    const items =
        itemResult.data || [];


    /* CUSTOMER PROFILE */

    let profile = null;

    if(order.customer_id){

        const profileResult =
            await sb
                .from("profiles")
                .select(
                    "id,full_name,phone,role"
                )
                .eq(
                    "id",
                    order.customer_id
                )
                .maybeSingle();

        if(
            !profileResult.error &&
            profileResult.data
        ){

            profile =
                profileResult.data;

        }
    }


    /* BASIC INFO */

    const status =
        normalizeStatus(
            order.status
        );

    const date =
        order.created_at
            ? new Date(
                order.created_at
              ).toLocaleString(
                "en-IN"
              )
            : "-";

    const total =
        Number(
            order.total || 0
        ).toLocaleString(
            "en-IN"
        );


    const customerName =
        profile?.full_name ||
        "Customer";

    const phone =
        profile?.phone ||
        "Not available";


    /* ITEMS */

    let itemsHTML = "";

    if(!items.length){

        itemsHTML = `
            <div class="msg">
                No items found.
            </div>
        `;

    }
    else{

        itemsHTML =
            items
                .map(item => {

                    const quantity =
                        Number(
                            item.quantity || 0
                        );

                    const price =
                        Number(
                            item.unit_price || 0
                        );

                    const lineTotal =
                        quantity * price;

                    return `
                        <div class="item-row">

                            <div>

                                <div class="item-name">
                                    ${esc(
                                        item.item_name ||
                                        "Food Item"
                                    )}
                                </div>

                                <div class="item-meta">

                                    ${quantity}
                                    ×
                                    ₹${price.toLocaleString(
                                        "en-IN"
                                    )}

                                </div>

                            </div>

                            <div class="item-price">

                                ₹${lineTotal.toLocaleString(
                                    "en-IN"

/* =========================
   UPDATE STATUS
========================= */

async function updateStatus(
    orderId,
    newStatus
){

    try{

        const {
            error
        } =
        await sb
            .from("orders")
            .update({
                status:newStatus
            })
            .eq(
                "id",
                orderId
            );

        if(error){
            throw error;
        }

        const order =
            orders.find(
                item =>
                    Number(item.id) ===
                    Number(orderId)
            );

        if(order){
            order.status =
                newStatus;
        }

        if(
            selectedOrder &&
            Number(selectedOrder.id) ===
            Number(orderId)
        ){

            selectedOrder.status =
                newStatus;
        }

        render();

    }
    catch(error){

        console.error(
            "Status update error:",
            error
        );

        alert(
            "Status update failed:\n" +
            error.message
        );

        render();

    }

}


/* =========================
   MODAL STATUS
========================= */

async function updateModalStatus(
    status
){

    if(!selectedOrder){
        return;
    }

    await updateStatus(
        selectedOrder.id,
        status
    );

}


/* =========================
   CLOSE MODAL
========================= */

function closeModal(){

    modal.classList.remove(
        "show"
    );

    selectedOrder = null;

}

function closeOutside(event){

    if(event.target === modal){
        closeModal();
    }

}


/* =========================
   SEARCH
========================= */

search.addEventListener(
    "input",
    render
);


/* =========================
   FILTER
========================= */

filter.addEventListener(
    "change",
    render
);


/* =========================
   ESCAPE
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){
            closeModal();
        }

    }
);


/* =========================
   LOGOUT
========================= */

async function logout(){

    if(
        !confirm(
            "Are you sure you want to logout?"
        )
    ){
        return;
    }

    await sb.auth.signOut();

    window.location.href =
        "login.html";

}
