<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Checkout - Beatroot</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f6f7f9;
    color:#171717;
}

/* HEADER */

.header{
    height:72px;
    background:#fff;
    border-bottom:1px solid #e8e8e8;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
}

.logo{
    text-decoration:none;
    font-size:28px;
    font-weight:900;
    color:#ef3f3f;
}

.logo span{
    color:#171717;
}

.back{
    text-decoration:none;
    color:#333;
    font-size:14px;
    font-weight:600;
}

/* CONTAINER */

.container{
    max-width:1100px;
    margin:auto;
    padding:40px 20px 70px;
}

.title{
    font-size:34px;
    font-weight:800;
    margin-bottom:8px;
}

.subtitle{
    color:#777;
    margin-bottom:30px;
}

/* LAYOUT */

.checkout-layout{
    display:grid;
    grid-template-columns:1fr 360px;
    gap:24px;
}

.card{
    background:#fff;
    border:1px solid #e8e8e8;
    border-radius:18px;
    padding:24px;
    box-shadow:0 8px 30px rgba(0,0,0,.05);
}

.card h2{
    font-size:21px;
    margin-bottom:22px;
}

/* FORM */

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

.form-group input,
.form-group textarea{
    width:100%;
    border:1px solid #ddd;
    border-radius:11px;
    background:#fafafa;
    padding:13px 14px;
    font-size:14px;
    outline:none;
}

.form-group input{
    height:48px;
}

.form-group textarea{
    min-height:110px;
    resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus{
    background:#fff;
    border-color:#ef3f3f;
    box-shadow:0 0 0 3px rgba(239,63,63,.08);
}

/* ORDER ITEMS */

.order-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid #eee;
}

.order-item:last-child{
    border-bottom:none;
}

.order-item img{
    width:58px;
    height:58px;
    border-radius:10px;
    object-fit:cover;
}

.order-info{
    flex:1;
}

.order-name{
    font-size:14px;
    font-weight:700;
}

.order-meta{
    color:#777;
    font-size:12px;
    margin-top:4px;
}

.order-price{
    font-size:14px;
    font-weight:700;
}

/* SUMMARY */

.summary-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    color:#555;
    font-size:14px;
}

.total{
    border-top:1px solid #e5e5e5;
    margin-top:10px;
    padding-top:18px;
    font-size:21px;
    font-weight:800;
    color:#111;
}

.place-order{
    width:100%;
    height:53px;
    margin-top:22px;
    border:0;
    border-radius:11px;
    background:#ef3f3f;
    color:#fff;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
}

.place-order:hover{
    background:#d93434;
}

.place-order:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* MESSAGE */

.message{
    display:none;
    padding:13px 15px;
    border-radius:10px;
    margin-bottom:20px;
    font-size:14px;
}

.error{
    display:block;
    background:#fff0f0;
    color:#d32f2f;
    border:1px solid #ffd0d0;
}

/* SUCCESS */

.success{
    text-align:center;
    padding:55px 20px;
}

.success-icon{
    font-size:60px;
    margin-bottom:15px;
}

.success h2{
    font-size:25px;
    margin-bottom:10px;
}

.success p{
    color:#777;
    line-height:1.6;
}

.success-btn{
    display:inline-block;
    margin-top:22px;
    padding:13px 22px;
    background:#ef3f3f;
    color:#fff;
    text-decoration:none;
    border-radius:10px;
    font-weight:700;
}

/* MOBILE */

@media(max-width:800px){

    .header{
        padding:0 18px;
    }

    .container{
        padding:28px 15px 50px;
    }

    .title{
        font-size:28px;
    }

    .checkout-layout{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<header class="header">

    <a href="../index.html" class="logo">
        Beat<span>root</span>
    </a>

    <a href="cart.html" class="back">
        ← Back to Cart
    </a>

</header>


<main class="container">

    <h1 class="title">
        Checkout
    </h1>

    <p class="subtitle">
        Enter your delivery details and place your order.
    </p>


    <div id="message" class="message"></div>


    <div id="checkoutArea">

        <div class="checkout-layout">

            <!-- CUSTOMER DETAILS -->

            <div class="card">

                <h2>
                    Delivery Details
                </h2>


                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="customerName"
                        placeholder="Enter your full name"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="customerPhone"
                        placeholder="Enter your phone number"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Delivery Address
                    </label>

                    <textarea
                        id="deliveryAddress"
                        placeholder="House name, place, landmark..."
                    ></textarea>

                </div>

            </div>


            <!-- ORDER SUMMARY -->

            <div class="card">

                <h2>
                    Your Order
                </h2>

                <div id="orderItems"></div>


                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <strong id="subtotal">
                        ₹0.00
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Delivery Fee
                    </span>

                    <strong id="deliveryFee">
                        ₹40.00
                    </strong>

                </div>


                <div class="summary-row total">

                    <span>
                        Total
                    </span>

                    <span id="grandTotal">
                        ₹0.00
                    </span>

                </div>


                <button
                    id="placeOrderBtn"
                    class="place-order"
                    onclick="placeOrder()"
                >
                    Place Order
                </button>

            </div>

        </div>

    </div>

</main>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://jhihjnsxazmftdqlitgk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_r_zMn0-GhFNtuvs5-UOo9w_D8SW8J57";

const sb = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==========================================
   GLOBAL
========================================== */

let currentUser = null;

let cart = [];

let subtotal = 0;

let deliveryFee = 0;

let grandTotal = 0;


/* ==========================================
   MESSAGE
========================================== */

function showError(text){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message error";

}

function clearMessage(){

    const box =
        document.getElementById("message");

    box.textContent = "";

    box.className =
        "message";

}


/* ==========================================
   LOAD USER
========================================== */

async function loadUser(){

    const result =
        await sb.auth.getUser();

    if(
        result.error ||
        !result.data.user
    ){

        window.location.href =
            "login.html";

        return false;

    }

    currentUser =
        result.data.user;

    return true;

}


/* ==========================================
   LOAD CART
========================================== */

async function loadCart(){

    const result =
        await sb
        .from("cart_items")
        .select(`
            id,
            quantity,
            menu_item_id,
            menu_items (
                id,
                restaurant_id,
                name,
                description,
                price,
                image_url,
                restaurants (
                    id,
                    name
                )
            )
        `)
        .eq(
            "customer_id",
            currentUser.id
        )
        .order(
            "created_at",
            {ascending:true}
        );


    if(result.error){

        console.error(result.error);

        showError(
            "Cart load cheyyan kazhinjilla."
        );

        return false;

    }


    cart =
        result.data || [];


    if(cart.length === 0){

        showError(
            "Your cart is empty."
        );

        setTimeout(()=>{

            window.location.href =
                "restaurants.html";

        },1500);

        return false;

    }


    calculateTotal();

    renderItems();

    return true;

}


/* ==========================================
   CALCULATE
========================================== */

function calculateTotal(){

    subtotal = 0;


    cart.forEach(item=>{

        const price =
            Number(
                item.menu_items?.price || 0
            );

        const quantity =
            Number(
                item.quantity || 1
            );

        subtotal +=
            price * quantity;

    });


    deliveryFee =
        subtotal >= 500
        ? 0
        : 40;


    grandTotal =
        subtotal + deliveryFee;


    document.getElementById(
        "subtotal"
    ).textContent =
        "₹" + subtotal.toFixed(2);


    document.getElementById(
        "deliveryFee"
    ).textContent =
        deliveryFee === 0
        ? "FREE"
        : "₹" + deliveryFee.toFixed(2);


    document.getElementById(
        "grandTotal"
    ).textContent =
        "₹" + grandTotal.toFixed(2);

}


/* ==========================================
   RENDER ITEMS
========================================== */

function renderItems(){

    const area =
        document.getElementById(
            "orderItems"
        );


    let html = "";


    cart.forEach(item=>{

        const food =
            item.menu_items;

        if(!food){
            return;
        }


        const price =
            Number(food.price || 0);

        const quantity =
            Number(item.quantity || 1);

        const total =
            price * quantity;


        const image =
            food.image_url ||
            "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=300&q=80";


        html += `

            <div class="order-item">

                <img
                    src="${escapeHTML(image)}"
                    alt="${escapeHTML(food.name)}"
                >

                <div class="order-info">

                    <div class="order-name">
                        ${escapeHTML(food.name)}
                    </div>

                    <div class="order-meta">
                        Qty: ${quantity}
                    </div>

                </div>

                <div class="order-price">
                    ₹${total.toFixed(2)}
                </div>

            </div>

        `;

    });


    area.innerHTML = html;

}


/* ==========================================
   PLACE ORDER
========================================== */

async function placeOrder(){

    clearMessage();


    const name =
        document
        .getElementById("customerName")
        .value
        .trim();


    const phone =
        document
        .getElementById("customerPhone")
        .value
        .trim();


    const address =
        document
        .getElementById("deliveryAddress")
        .value
        .trim();


    if(!name){

        showError(
            "Full name enter cheyyuka."
        );

        return;

    }


    if(!phone){

        showError(
            "Phone number enter cheyyuka."
        );

        return;

    }


    if(!address){

        showError(
            "Delivery address enter cheyyuka."
        );

        return;

    }


    const button =
        document.getElementById(
            "placeOrderBtn"
        );


    button.disabled = true;

    button.textContent =
        "Placing Order...";


    try{

        /*
        ======================================
        STEP 1
        CREATE ORDER
        ======================================
        */

        /*
        All cart items should belong
        to the same restaurant.
        */

        const restaurantIds =
            cart.map(
                item =>
                item.menu_items?.restaurant_id
            );


        const uniqueRestaurants =
            [...new Set(restaurantIds)];


        if(uniqueRestaurants.length !== 1){

            throw new Error(
                "Cart contains items from different restaurants. Please order from one restaurant at a time."
            );

        }


        const restaurantId =
            uniqueRestaurants[0];


        const orderInsert =
            await sb
            .from("orders")
            .insert({

                customer_id:
                    currentUser.id,

                restaurant_id:
                    restaurantId,

                status:
                    "confirmed",

                customer_name:
                    name,

                customer_phone:
                    phone,

                delivery_address:
                    address,

                subtotal:
                    subtotal,

                delivery_fee:
                    deliveryFee,

                total:
                    grandTotal

            })
            .select()
            .single();


        if(orderInsert.error){

            throw orderInsert.error;

        }


        const order =
            orderInsert.data;


        /*
        ======================================
        STEP 2
        CREATE ORDER ITEMS
        ======================================
        */


        const orderItems =
            cart.map(item=>{

                const food =
                    item.menu_items;

                return {

                    order_id:
                        order.id,

                    menu_item_id:
                        food.id,

                    item_name:
                        food.name,

                    quantity:
                        Number(
                            item.quantity || 1
                        ),

                    unit_price:
                        Number(
                            food.price || 0
                        )

                };

            });


        const itemInsert =
            await sb
            .from("order_items")
            .insert(
                orderItems
            );


        if(itemInsert.error){

            /*
            If order items fail,
            remove the order.
            */

            await sb
            .from("orders")
            .delete()
            .eq(
                "id",
                order.id
            );

            throw itemInsert.error;

        }


        /*
        ======================================
        STEP 3
        CLEAR CART
        ======================================
        */


        const clearCart =
            await sb
            .from("cart_items")
            .delete()
            .eq(
                "customer_id",
                currentUser.id
            );


        if(clearCart.error){

            console.error(
                "Cart clear error:",
                clearCart.error
            );

        }


        /*
        ======================================
        SUCCESS
        ======================================
        */

        document.getElementById(
            "checkoutArea"
        ).innerHTML = `

            <div class="card success">

                <div class="success-icon">
                    ✅
                </div>

                <h2>
                    Order Placed Successfully!
                </h2>

                <p>
                    Your order has been received
                    successfully.
                </p>

                <p>
                    Order ID:
                    <strong>#${order.id}</strong>
                </p>

                <a
                    href="my-orders.html"
                    class="success-btn"
                >
                    View My Orders
                </a>

            </div>

        `;


    }catch(error){

        console.error(
            "Order Error:",
            error
        );


        showError(
            error.message ||
            "Order place cheyyan kazhinjilla."
        );


        button.disabled = false;

        button.textContent =
            "Place Order";

    }

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================
   START
========================================== */

async function start(){

    const loggedIn =
        await loadUser();

    if(!loggedIn){
        return;
    }


    await loadCart();

}


start();

</script>

</body>

</html>
