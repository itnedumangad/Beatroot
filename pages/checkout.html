<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout - Beatroot</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f7f7f7;
    color:#222;
}

/* HEADER */

.header{
    height:70px;
    background:#fff;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:26px;
    font-weight:800;
    color:#ff4d00;
    text-decoration:none;
}

.nav{
    display:flex;
    gap:20px;
    align-items:center;
}

.nav a{
    text-decoration:none;
    color:#333;
    font-size:14px;
    font-weight:600;
}

.cart-btn{
    background:#ff4d00;
    color:#fff !important;
    padding:10px 16px;
    border-radius:8px;
}

/* CONTAINER */

.container{
    max-width:1100px;
    margin:40px auto;
    padding:0 20px;
}

.page-title{
    font-size:32px;
    font-weight:800;
    margin-bottom:25px;
}

.checkout-layout{
    display:grid;
    grid-template-columns:1fr 380px;
    gap:25px;
}

/* BOX */

.box{
    background:#fff;
    border-radius:16px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
    margin-bottom:20px;
}

.box h2{
    font-size:21px;
    margin-bottom:20px;
}

/* FORM */

.form-group{
    margin-bottom:17px;
}

.form-group label{
    display:block;
    font-size:14px;
    font-weight:700;
    margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:9px;
    outline:none;
    font-size:14px;
    background:#fff;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:#ff4d00;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

/* TWO COLUMN */

.two-col{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

/* PAYMENT */

.payment-option{
    border:1px solid #ddd;
    border-radius:10px;
    padding:14px;
    margin-bottom:10px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:12px;
}

.payment-option:hover{
    border-color:#ff4d00;
}

.payment-option input{
    accent-color:#ff4d00;
}

/* ORDER SUMMARY */

.summary-item{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:12px 0;
    border-bottom:1px solid #eee;
    font-size:14px;
}

.summary-item:last-child{
    border-bottom:none;
}

.summary-name{
    flex:1;
}

.summary-price{
    font-weight:700;
    white-space:nowrap;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    color:#555;
}

.total-row{
    border-top:1px solid #eee;
    margin-top:10px;
    padding-top:18px;
    display:flex;
    justify-content:space-between;
    font-size:21px;
    font-weight:800;
}

.place-order{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#ff4d00;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-top:20px;
}

.place-order:hover{
    background:#e64400;
}

.back-cart{
    display:block;
    text-align:center;
    margin-top:15px;
    color:#ff4d00;
    text-decoration:none;
    font-weight:600;
}

/* EMPTY */

.empty{
    background:#fff;
    padding:70px 20px;
    text-align:center;
    border-radius:16px;
}

.empty-icon{
    font-size:60px;
    margin-bottom:15px;
}

.shop-btn{
    display:inline-block;
    margin-top:20px;
    padding:13px 22px;
    background:#ff4d00;
    color:white;
    text-decoration:none;
    border-radius:9px;
    font-weight:700;
}

/* MOBILE */

@media(max-width:800px){

    .header{
        padding:0 20px;
    }

    .nav a:not(.cart-btn){
        display:none;
    }

    .checkout-layout{
        grid-template-columns:1fr;
    }

    .page-title{
        font-size:27px;
    }

    .two-col{
        grid-template-columns:1fr;
        gap:0;
    }

}

</style>
</head>


<body>

<!-- HEADER -->

<header class="header">

    <a href="home.html" class="logo">
        Beatroot
    </a>

    <nav class="nav">

        <a href="home.html">
            Home
        </a>

        <a href="restaurants.html">
            Restaurants
        </a>

        <a href="my-orders.html">
            My Orders
        </a>

        <a href="profile.html">
            Profile
        </a>

        <a href="cart.html" class="cart-btn">
            🛒 Cart (<span id="cartCount">0</span>)
        </a>

    </nav>

</header>


<main class="container">

    <h1 class="page-title">
        Checkout
    </h1>

    <div id="checkoutArea"></div>

</main>


<script>

let cart =
JSON.parse(localStorage.getItem("beatrootCart")) || [];


/* CART COUNT */

function updateCartCount(){

    let count = cart.reduce(
        (sum,item)=>sum + Number(item.quantity || 1),
        0
    );

    document.getElementById("cartCount").innerText = count;
}


/* LOAD CHECKOUT */

function loadCheckout(){

    updateCartCount();

    const area =
    document.getElementById("checkoutArea");


    /* EMPTY CART */

    if(cart.length === 0){

        area.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🛒
                </div>

                <h2>
                    Your cart is empty
                </h2>

                <p>
                    Please add some food before checkout.
                </p>

                <a
                    href="restaurants.html"
                    class="shop-btn"
                >
                    Browse Restaurants
                </a>

            </div>

        `;

        return;
    }


    /* CALCULATE TOTAL */

    let subtotal = 0;

    let itemsHTML = "";


    cart.forEach(item=>{

        let price =
        Number(item.price || 0);

        let quantity =
        Number(item.quantity || 1);

        let total =
        price * quantity;

        subtotal += total;


        itemsHTML += `

            <div class="summary-item">

                <div class="summary-name">

                    <strong>
                        ${item.name || "Food Item"}
                    </strong>

                    <br>

                    <small>
                        Qty: ${quantity}
                    </small>

                </div>

                <div class="summary-price">
                    ₹${total.toFixed(2)}
                </div>

            </div>

        `;

    });


    let delivery =
    subtotal >= 500 ? 0 : 40;

    let grandTotal =
    subtotal + delivery;


    /* CHECKOUT UI */

    area.innerHTML = `

        <div class="checkout-layout">


            <!-- CUSTOMER DETAILS -->

            <div>


                <div class="box">

                    <h2>
                        👤 Customer Details
                    </h2>


                    <div class="form-group">

                        <label>
                            Full Name *
                        </label>

                        <input
                            type="text"
                            id="customerName"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <div class="two-col">


                        <div class="form-group">

                            <label>
                                Mobile Number *
                            </label>

                            <input
                                type="tel"
                                id="customerPhone"
                                placeholder="10 digit mobile number"
                                maxlength="10"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                Email
                            </label>

                            <input
                                type="email"
                                id="customerEmail"
                                placeholder="example@email.com"
                            >

                        </div>


                    </div>

                </div>


                <!-- ADDRESS -->

                <div class="box">

                    <h2>
                        📍 Delivery Address
                    </h2>


                    <div class="form-group">

                        <label>
                            House / Building *
                        </label>

                        <input
                            type="text"
                            id="house"
                            placeholder="House / Building name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Street / Area *
                        </label>

                        <input
                            type="text"
                            id="street"
                            placeholder="Street / Area"
                            required
                        >

                    </div>


                    <div class="two-col">


                        <div class="form-group">

                            <label>
                                City *
                            </label>

                            <input
                                type="text"
                                id="city"
                                placeholder="City"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                PIN Code *
                            </label>

                            <input
                                type="text"
                                id="pincode"
                                placeholder="PIN Code"
                                maxlength="6"
                                required
                            >

                        </div>


                    </div>


                    <div class="form-group">

                        <label>
                            Delivery Instructions
                        </label>

                        <textarea
                            id="instructions"
                            placeholder="Any instructions for delivery?"
                        ></textarea>

                    </div>

                </div>


                <!-- PAYMENT -->

                <div class="box">

                    <h2>
                        💳 Payment Method
                    </h2>


                    <label class="payment-option">

                        <input
                            type="radio"
                            name="payment"
                            value="COD"
                            checked
                        >

                        <span>
                            💵 Cash on Delivery
                        </span>

                    </label>


                    <label class="payment-option">

                        <input
                            type="radio"
                            name="payment"
                            value="ONLINE"
                        >

                        <span>
                            📱 Online Payment
                        </span>

                    </label>


                </div>


            </div>


            <!-- ORDER SUMMARY -->

            <div>


                <div class="box">

                    <h2>
                        🧾 Order Summary
                    </h2>


                    ${itemsHTML}


                    <div class="summary-row">

                        <span>
                            Subtotal
                        </span>

                        <strong>
                            ₹${subtotal.toFixed(2)}
                        </strong>

                    </div>


                    <div class="summary-row">

                        <span>
                            Delivery Fee
                        </span>

                        <strong>

                            ${
                                delivery === 0
                                ? "FREE"
                                : "₹" + delivery.toFixed(2)
                            }

                        </strong>

                    </div>


                    <div class="total-row">

                        <span>
                            Total
                        </span>

                        <span>
                            ₹${grandTotal.toFixed(2)}
                        </span>

                    </div>


                    <button
                        class="place-order"
                        onclick="placeOrder()"
                    >
                        Place Order
                    </button>


                    <a
                        href="cart.html"
                        class="back-cart"
                    >
                        ← Back to Cart
                    </a>

                </div>

            </div>


        </div>

    `;
}


/* PLACE ORDER */

function placeOrder(){

    const name =
    document.getElementById("customerName").value.trim();

    const phone =
    document.getElementById("customerPhone").value.trim();

    const email =
    document.getElementById("customerEmail").value.trim();

    const house =
    document.getElementById("house").value.trim();

    const street =
    document.getElementById("street").value.trim();

    const city =
    document.getElementById("city").value.trim();

    const pincode =
    document.getElementById("pincode").value.trim();

    const instructions =
    document.getElementById("instructions").value.trim();


    const payment =
    document.querySelector(
        'input[name="payment"]:checked'
    ).value;


    /* VALIDATION */

    if(!name){
        alert("Please enter your name.");
        return;
    }


    if(!/^[0-9]{10}$/.test(phone)){

        alert(
            "Please enter a valid 10 digit mobile number."
        );

        return;
    }


    if(!house){

        alert(
            "Please enter your house / building."
        );

        return;
    }


    if(!street){

        alert(
            "Please enter your street / area."
        );

        return;
    }


    if(!city){

        alert(
            "Please enter your city."
        );

        return;
    }


    if(!/^[0-9]{6}$/.test(pincode)){

        alert(
            "Please enter a valid 6 digit PIN code."
        );

        return;
    }


    /* TOTAL */

    let subtotal = 0;


    cart.forEach(item=>{

        subtotal +=
        Number(item.price || 0) *
        Number(item.quantity || 1);

    });


    let delivery =
    subtotal >= 500 ? 0 : 40;


    let grandTotal =
    subtotal + delivery;


    /* ORDER ID */

    let orderId =
    "BR" +
    Date.now().toString().slice(-8);


    /* ORDER OBJECT */

    let order = {

        orderId: orderId,

        date: new Date().toLocaleString(),

        customer: {

            name: name,

            phone: phone,

            email: email

        },

        address: {

            house: house,

            street: street,

            city: city,

            pincode: pincode,

            instructions: instructions

        },

        paymentMethod: payment,

        items: cart,

        subtotal: subtotal,

        deliveryFee: delivery,

        total: grandTotal,

        status: "Order Placed"

    };


    /* SAVE CURRENT ORDER */

    localStorage.setItem(
        "beatrootCurrentOrder",
        JSON.stringify(order)
    );


    /* SAVE ORDER HISTORY */

    let orders =
    JSON.parse(
        localStorage.getItem("beatrootOrders")
    ) || [];


    orders.unshift(order);


    localStorage.setItem(
        "beatrootOrders",
        JSON.stringify(orders)
    );


    /* CLEAR CART */

    localStorage.removeItem("beatrootCart");


    /* GO TO CONFIRMATION */

    window.location.href =
    "order-confirmation.html";

}


loadCheckout();

</script>

</body>
</html>
