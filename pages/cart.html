<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - Beatroot</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f7f7f7;
    color:#222;
}

.header{
    height:70px;
    background:#fff;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:26px;
    font-weight:800;
    color:#ff4d00;
    text-decoration:none;
}

.nav{
    display:flex;
    gap:20px;
    align-items:center;
}

.nav a{
    text-decoration:none;
    color:#333;
    font-size:14px;
    font-weight:600;
}

.cart-btn{
    background:#ff4d00;
    color:white !important;
    padding:10px 16px;
    border-radius:8px;
}

.container{
    max-width:1100px;
    margin:40px auto;
    padding:0 20px;
}

.page-title{
    font-size:32px;
    font-weight:800;
    margin-bottom:25px;
}

.cart-layout{
    display:grid;
    grid-template-columns:1fr 360px;
    gap:25px;
}

.cart-box,
.summary{
    background:#fff;
    border-radius:16px;
    padding:22px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.cart-item{
    display:flex;
    align-items:center;
    gap:18px;
    padding:18px 0;
    border-bottom:1px solid #eee;
}

.cart-item:last-child{
    border-bottom:none;
}

.food-img{
    width:90px;
    height:90px;
    border-radius:12px;
    object-fit:cover;
    background:#eee;
}

.item-info{
    flex:1;
}

.item-info h3{
    font-size:18px;
    margin-bottom:6px;
}

.item-info p{
    color:#777;
    font-size:14px;
}

.price{
    font-weight:700;
    margin-top:7px;
}

.qty{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
}

.qty button{
    width:30px;
    height:30px;
    border:none;
    border-radius:7px;
    background:#f0f0f0;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
}

.qty span{
    min-width:20px;
    text-align:center;
    font-weight:bold;
}

.remove{
    border:none;
    background:none;
    color:#e53935;
    cursor:pointer;
    font-size:13px;
    margin-top:10px;
}

.item-total{
    font-size:17px;
    font-weight:800;
    white-space:nowrap;
}

.summary h2{
    font-size:22px;
    margin-bottom:20px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    color:#555;
}

.summary-row.total{
    border-top:1px solid #eee;
    margin-top:10px;
    padding-top:18px;
    font-size:20px;
    color:#111;
    font-weight:800;
}

.checkout-btn{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#ff4d00;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.checkout-btn:hover{
    background:#e64400;
}

.continue{
    display:block;
    text-align:center;
    margin-top:15px;
    text-decoration:none;
    color:#ff4d00;
    font-weight:600;
}

.empty{
    text-align:center;
    padding:70px 20px;
}

.empty-icon{
    font-size:60px;
    margin-bottom:15px;
}

.empty h2{
    margin-bottom:10px;
}

.empty p{
    color:#777;
    margin-bottom:25px;
}

.shop-btn{
    display:inline-block;
    padding:13px 22px;
    background:#ff4d00;
    color:white;
    text-decoration:none;
    border-radius:9px;
    font-weight:700;
}

@media(max-width:800px){

    .header{
        padding:0 20px;
    }

    .nav a:not(.cart-btn){
        display:none;
    }

    .cart-layout{
        grid-template-columns:1fr;
    }

    .page-title{
        font-size:27px;
    }

    .cart-item{
        align-items:flex-start;
    }

    .food-img{
        width:75px;
        height:75px;
    }

    .item-total{
        font-size:15px;
    }
}
</style>
</head>

<body>

<header class="header">

<a href="home.html" class="logo">Beatroot</a>

<nav class="nav">
<a href="home.html">Home</a>
<a href="restaurants.html">Restaurants</a>
<a href="my-orders.html">My Orders</a>
<a href="profile.html">Profile</a>
<a href="cart.html" class="cart-btn">
🛒 Cart (<span id="cartCount">0</span>)
</a>
</nav>

</header>


<main class="container">

<h1 class="page-title">Your Cart</h1>

<div id="cartArea"></div>

</main>


<script>

let cart = JSON.parse(localStorage.getItem("beatrootCart")) || [];


function saveCart(){
    localStorage.setItem("beatrootCart", JSON.stringify(cart));
}


function updateCartCount(){

    let count = cart.reduce((sum,item)=>sum + Number(item.quantity || 1),0);

    document.getElementById("cartCount").innerText = count;
}


function changeQuantity(index, change){

    cart[index].quantity = Number(cart[index].quantity || 1) + change;

    if(cart[index].quantity <= 0){
        cart.splice(index,1);
    }

    saveCart();
    renderCart();
}


function removeItem(index){

    cart.splice(index,1);

    saveCart();
    renderCart();
}


function renderCart(){

    updateCartCount();

    const area = document.getElementById("cartArea");

    if(cart.length === 0){

        area.innerHTML = `
            <div class="cart-box empty">

                <div class="empty-icon">🛒</div>

                <h2>Your cart is empty</h2>

                <p>
                    Looks like you haven't added anything to your cart yet.
                </p>

                <a href="restaurants.html" class="shop-btn">
                    Browse Restaurants
                </a>

            </div>
        `;

        return;
    }


    let subtotal = 0;

    let itemsHTML = "";


    cart.forEach((item,index)=>{

        let price = Number(item.price || 0);
        let quantity = Number(item.quantity || 1);

        let total = price * quantity;

        subtotal += total;


        itemsHTML += `

        <div class="cart-item">

            <img
                class="food-img"
                src="${item.image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=300&q=80'}"
                alt="${item.name || 'Food'}"
            >

            <div class="item-info">

                <h3>${item.name || 'Food Item'}</h3>

                <p>${item.restaurant || 'Restaurant'}</p>

                <div class="price">
                    ₹${price.toFixed(2)}
                </div>

                <div class="qty">

                    <button onclick="changeQuantity(${index},-1)">
                        −
                    </button>

                    <span>${quantity}</span>

                    <button onclick="changeQuantity(${index},1)">
                        +
                    </button>

                </div>

                <button
                    class="remove"
                    onclick="removeItem(${index})"
                >
                    Remove
                </button>

            </div>

            <div class="item-total">
                ₹${total.toFixed(2)}
            </div>

        </div>

        `;

    });


    let delivery = subtotal >= 500 ? 0 : 40;

    let grandTotal = subtotal + delivery;


    area.innerHTML = `

        <div class="cart-layout">

            <div class="cart-box">

                ${itemsHTML}

            </div>


            <div class="summary">

                <h2>Order Summary</h2>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span>₹${subtotal.toFixed(2)}</span>
                </div>

                <div class="summary-row">
                    <span>Delivery Fee</span>
                    <span>
                        ${delivery === 0 ? "FREE" : "₹" + delivery.toFixed(2)}
                    </span>
                </div>

                <div class="summary-row total">
                    <span>Total</span>
                    <span>₹${grandTotal.toFixed(2)}</span>
                </div>

                <button
                    class="checkout-btn"
                    onclick="goCheckout()"
                >
                    Proceed to Checkout
                </button>

                <a
                    href="restaurants.html"
                    class="continue"
                >
                    ← Continue Shopping
                </a>

            </div>

        </div>

    `;
}


function goCheckout(){

    if(cart.length === 0){
        alert("Your cart is empty.");
        return;
    }

    window.location.href = "checkout.html";
}


renderCart();

</script>

</body>
</html>
