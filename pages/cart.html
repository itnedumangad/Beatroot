<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Beatroot - Cart</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top left,
            rgba(239,63,63,.07),
            transparent 30%
        ),
        #f6f7fa;

    color:#171717;
}


/* =========================================================
   REMOVE UNDERLINES
========================================================= */

a,
a:link,
a:visited,
a:hover,
a:active,
a:focus,
button,
button *{
    text-decoration:none !important;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    height:74px;

    background:
        rgba(255,255,255,.95);

    backdrop-filter:blur(15px);

    border-bottom:
        1px solid #e8e8e8;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 5%;

    position:sticky;

    top:0;

    z-index:1000;
}


.logo{

    font-size:29px;

    font-weight:900;

    letter-spacing:-1.5px;

    color:#ef3f3f;
}


.logo span{

    color:#171717;
}


.nav{

    display:flex;

    align-items:center;

    gap:10px;
}


.nav a{

    color:#555;

    font-size:13px;

    font-weight:700;

    padding:10px 13px;

    border-radius:10px;

    transition:.2s;
}


.nav a:hover{

    background:#f3f3f3;

    color:#ef3f3f;
}


.nav .cart-btn{

    background:#ef3f3f;

    color:white;

    padding:11px 16px;

    border-radius:11px;
}


.nav .cart-btn:hover{

    background:#d93232;

    color:white;
}


/* =========================================================
   MAIN
========================================================= */

.container{

    max-width:1150px;

    margin:auto;

    padding:38px 22px 70px;
}


/* =========================================================
   PAGE HEADER
========================================================= */

.page-header{

    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;
}


.page-title{

    font-size:34px;

    font-weight:900;

    letter-spacing:-1.2px;
}


.page-subtitle{

    color:#777;

    font-size:14px;

    margin-top:7px;
}


.item-count{

    color:#777;

    font-size:13px;

    background:white;

    border:1px solid #e8e8e8;

    padding:9px 13px;

    border-radius:20px;
}


/* =========================================================
   CART LAYOUT
========================================================= */

.cart-layout{

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        350px;

    gap:22px;

    align-items:start;
}


/* =========================================================
   CARD
========================================================= */

.card{

    background:white;

    border:1px solid #e6e6e6;

    border-radius:20px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.045);
}


/* =========================================================
   CART ITEMS
========================================================= */

.cart-box{

    padding:6px 20px;
}


.cart-item{

    display:grid;

    grid-template-columns:
        92px
        minmax(0,1fr)
        auto;

    gap:17px;

    align-items:center;

    padding:18px 0;

    border-bottom:
        1px solid #eeeeee;
}


.cart-item:last-child{

    border-bottom:0;
}


.food-image-wrap{

    width:92px;

    height:92px;

    border-radius:15px;

    overflow:hidden;

    background:#f0f0f0;
}


.food-img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;
}


.item-info{

    min-width:0;
}


.item-name{

    font-size:17px;

    font-weight:800;

    color:#171717;

    margin-bottom:5px;
}


.restaurant-name{

    color:#777;

    font-size:12px;

    margin-bottom:7px;
}


.item-price{

    font-size:13px;

    color:#555;

    font-weight:600;
}


/* =========================================================
   QUANTITY
========================================================= */

.item-controls{

    display:flex;

    align-items:center;

    gap:9px;

    margin-top:12px;
}


.qty{

    display:flex;

    align-items:center;

    background:#f5f5f6;

    border:1px solid #e5e5e5;

    border-radius:10px;

    overflow:hidden;
}


.qty button{

    width:31px;

    height:31px;

    border:0;

    background:transparent;

    color:#222;

    font-size:18px;

    font-weight:700;

    cursor:pointer;
}


.qty button:hover{

    background:#e9e9ea;
}


.qty span{

    min-width:30px;

    text-align:center;

    font-size:13px;

    font-weight:800;
}


.remove{

    border:0;

    background:transparent;

    color:#d93434;

    font-size:12px;

    font-weight:700;

    cursor:pointer;

    padding:7px;
}


.remove:hover{

    background:#fff0f0;

    border-radius:8px;
}


.item-total{

    font-size:16px;

    font-weight:900;

    white-space:nowrap;

    align-self:start;

    padding-top:5px;
}


/* =========================================================
   SUMMARY
========================================================= */

.summary{

    padding:22px;

    position:sticky;

    top:95px;
}


.summary-title{

    font-size:20px;

    font-weight:900;

    margin-bottom:20px;
}


.summary-row{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:10px 0;

    color:#666;

    font-size:13px;
}


.summary-row span:last-child{

    color:#222;

    font-weight:700;
}


.free{

    color:#16803c !important;

    font-weight:800 !important;
}


.summary-divider{

    height:1px;

    background:#eeeeee;

    margin:10px 0;
}


.total-row{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding-top:12px;
}


.total-label{

    font-size:14px;

    font-weight:700;
}


.total-price{

    font-size:24px;

    font-weight:900;

    color:#171717;
}


/* =========================================================
   CHECKOUT BUTTON
========================================================= */

.checkout-btn{

    width:100%;

    height:50px;

    margin-top:20px;

    border:0;

    border-radius:12px;

    background:#ef3f3f;

    color:white;

    font-size:14px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;

    box-shadow:
        0 8px 20px rgba(239,63,63,.20);
}


.checkout-btn:hover{

    background:#d93232;

    transform:translateY(-1px);
}


.continue{

    display:block;

    text-align:center;

    margin-top:15px;

    color:#555;

    font-size:13px;

    font-weight:700;
}


.continue:hover{

    color:#ef3f3f;
}


/* =========================================================
   DELIVERY NOTE
========================================================= */

.delivery-note{

    display:flex;

    gap:10px;

    align-items:flex-start;

    background:#f7f8fa;

    border-radius:12px;

    padding:13px;

    margin-top:20px;

    color:#666;

    font-size:11px;

    line-height:1.5;
}


.delivery-icon{

    font-size:18px;
}


/* =========================================================
   EMPTY CART
========================================================= */

.empty{

    background:white;

    border:
        1px solid #e6e6e6;

    border-radius:22px;

    padding:75px 25px;

    text-align:center;

    box-shadow:
        0 10px 35px rgba(0,0,0,.04);
}


.empty-icon{

    width:82px;

    height:82px;

    margin:0 auto 20px;

    border-radius:50%;

    background:#fff0f0;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:36px;
}


.empty h2{

    font-size:23px;

    margin-bottom:8px;
}


.empty p{

    color:#777;

    font-size:13px;

    line-height:1.6;

    max-width:420px;

    margin:auto;
}


.shop-btn{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    margin-top:23px;

    padding:12px 20px;

    background:#ef3f3f;

    color:white;

    border-radius:11px;

    font-size:13px;

    font-weight:800;
}


.shop-btn:hover{

    background:#d93232;
}


/* =========================================================
   COUPON
========================================================= */

.coupon{

    margin-top:18px;

    padding-top:18px;

    border-top:1px solid #eeeeee;
}


.coupon-title{

    font-size:12px;

    font-weight:800;

    margin-bottom:8px;
}


.coupon-box{

    display:flex;

    gap:7px;
}


.coupon-box input{

    flex:1;

    height:40px;

    border:
        1px solid #dedede;

    border-radius:9px;

    padding:0 10px;

    outline:none;

    font-size:12px;
}


.coupon-box button{

    height:40px;

    border:0;

    padding:0 13px;

    border-radius:9px;

    background:#171717;

    color:white;

    font-size:12px;

    font-weight:700;

    cursor:pointer;
}


.coupon-message{

    margin-top:7px;

    font-size:11px;

    color:#16803c;

    display:none;
}


/* =========================================================
   SECURITY
========================================================= */

.secure{

    margin-top:15px;

    text-align:center;

    color:#888;

    font-size:10px;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    background:#111827;

    color:white;

    padding:35px 22px;

    text-align:center;
}


.footer-logo{

    font-size:24px;

    font-weight:900;

    color:#ef3f3f;

    margin-bottom:6px;
}


.footer-logo span{

    color:white;
}


.footer p{

    color:#9ca3af;

    font-size:12px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:850px){

    .header{

        padding:0 18px;
    }


    .nav a:not(.cart-btn){

        display:none;
    }


    .container{

        padding:
            28px
            15px
            55px;
    }


    .cart-layout{

        grid-template-columns:1fr;
    }


    .summary{

        position:static;
    }

}


@media(max-width:600px){

    .header{

        height:66px;
    }


    .logo{

        font-size:25px;
    }


    .nav .cart-btn{

        padding:
            10px
            13px;
    }


    .page-header{

        align-items:flex-start;

        flex-direction:column;
    }


    .page-title{

        font-size:29px;
    }


    .cart-box{

        padding:
            5px
            15px;
    }


    .cart-item{

        grid-template-columns:
            72px
            minmax(0,1fr);

        gap:12px;
    }


    .food-image-wrap{

        width:72px;

        height:72px;
    }


    .item-total{

        grid-column:2;

        padding-top:0;
    }


    .item-name{

        font-size:15px;
    }


    .summary{

        padding:18px;
    }

}


@media(max-width:400px){

    .page-title{

        font-size:26px;
    }


    .cart-item{

        grid-template-columns:
            65px
            minmax(0,1fr);
    }


    .food-image-wrap{

        width:65px;

        height:65px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">

    <a
        href="../index.html"
        class="logo">

        Beat<span>root</span>

    </a>


    <nav class="nav">

        <a href="../index.html">
            Home
        </a>

        <a href="restaurants.html">
            Restaurants
        </a>

        <a href="my-orders.html">
            My Orders
        </a>

        <a href="profile.html">
            Profile
        </a>

        <a
            href="cart.html"
            class="cart-btn">

            🛒 Cart
            (<span id="cartCount">0</span>)

        </a>

    </nav>

</header>



<!-- =========================================================
     MAIN
========================================================= -->

<main class="container">


    <div class="page-header">

        <div>

            <h1 class="page-title">
                Your Cart
            </h1>

            <p class="page-subtitle">
                Review your items before checkout.
            </p>

        </div>


        <div
            class="item-count"
            id="itemCount">

            0 items

        </div>

    </div>



    <div id="cartArea"></div>


</main>



<!-- =========================================================
     FOOTER
========================================================= -->

<footer class="footer">

    <div class="footer-logo">

        Beat<span>root</span>

    </div>

    <p>
        Delicious food. Easy ordering.
    </p>

</footer>



<script>

/* =========================================================
   CART DATA
========================================================= */

let cart =
    JSON.parse(
        localStorage.getItem(
            "beatrootCart"
        )
    ) || [];


/* =========================================================
   SAVE CART
========================================================= */

function saveCart(){

    localStorage.setItem(
        "beatrootCart",
        JSON.stringify(cart)
    );

}


/* =========================================================
   CART COUNT
========================================================= */

function updateCartCount(){

    const count =
        cart.reduce(
            (sum,item) =>
                sum +
                Number(
                    item.quantity || 1
                ),
            0
        );


    document.getElementById(
        "cartCount"
    ).textContent =
        count;


    document.getElementById(
        "itemCount"
    ).textContent =
        count +
        (
            count === 1
                ? " item"
                : " items"
        );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        function(match){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[match];

        }
    );

}


/* =========================================================
   IMAGE ERROR
========================================================= */

function imageError(img){

    img.onerror = null;

    img.src =
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`

            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="400"
                height="400">

                <rect
                    width="100%"
                    height="100%"
                    fill="#f3f3f3"/>

                <text
                    x="50%"
                    y="50%"
                    dominant-baseline="middle"
                    text-anchor="middle"
                    font-size="70">

                    🍽️

                </text>

            </svg>

        `);

}


/* =========================================================
   CHANGE QUANTITY
========================================================= */

function changeQuantity(
    index,
    change
){

    if(!cart[index]){
        return;
    }


    let quantity =
        Number(
            cart[index].quantity || 1
        );


    quantity += change;


    if(quantity <= 0){

        removeItem(index);

        return;

    }


    cart[index].quantity =
        quantity;


    saveCart();

    renderCart();

}


/* =========================================================
   REMOVE ITEM
========================================================= */

function removeItem(index){

    if(!cart[index]){
        return;
    }


    cart.splice(
        index,
        1
    );


    saveCart();

    renderCart();

}


/* =========================================================
   COUPON
========================================================= */

function applyCoupon(){

    const input =
        document.getElementById(
            "couponInput"
        );

    const message =
        document.getElementById(
            "couponMessage"
        );


    const code =
        input.value
            .trim()
            .toUpperCase();


    message.style.display =
        "block";


    if(code === "BEATROOT10"){

        message.style.color =
            "#16803c";

        message.textContent =
            "Coupon applied!";

        localStorage.setItem(
            "beatrootCoupon",
            code
        );

    }
    else{

        message.style.color =
            "#d32f2f";

        message.textContent =
            code
                ? "Invalid coupon code."
                : "Enter a coupon code.";

        localStorage.removeItem(
            "beatrootCoupon"
        );

    }

}


/* =========================================================
   RENDER CART
========================================================= */

function renderCart(){

    updateCartCount();


    const area =
        document.getElementById(
            "cartArea"
        );


    if(
        !cart ||
        cart.length === 0
    ){

        area.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🛒
                </div>

                <h2>
                    Your cart is empty
                </h2>

                <p>
                    You haven't added anything yet.
                    Explore restaurants and add your favourite
                    food to your cart.
                </p>

                <a
                    href="restaurants.html"
                    class="shop-btn">

                    Browse Restaurants

                </a>

            </div>

        `;

        return;

    }


    let subtotal = 0;

    let totalItems = 0;

    let itemsHTML = "";


    cart.forEach(
        (item,index) => {

            const price =
                Number(
                    item.price || 0
                );


            const quantity =
                Number(
                    item.quantity || 1
                );


            const total =
                price * quantity;


            subtotal += total;

            totalItems += quantity;


            const image =
                item.image ||
                "";


            itemsHTML += `

                <div class="cart-item">


                    <div class="food-image-wrap">

                        ${
                            image
                            ?
                            `
                            <img
                                class="food-img"
                                src="${escapeHTML(image)}"
                                alt="${escapeHTML(item.name || "Food")}"
                                onerror="imageError(this)"
                            >
                            `
                            :
                            `
                            <div
                                class="food-img"
                                style="
                                    display:flex;
                                    align-items:center;
                                    justify-content:center;
                                    font-size:35px;
                                ">

                                🍽️

                            </div>
                            `
                        }

                    </div>



                    <div class="item-info">


                        <div class="item-name">

                            ${escapeHTML(
                                item.name ||
                                "Food Item"
                            )}

                        </div>


                        <div class="restaurant-name">

                            ${escapeHTML(
                                item.restaurant ||
                                "Restaurant"
                            )}

                        </div>


                        <div class="item-price">

                            ₹${price.toLocaleString(
                                "en-IN",
                                {
                                    minimumFractionDigits:2,
                                    maximumFractionDigits:2
                                }
                            )}

                            &nbsp; each

                        </div>


                        <div class="item-controls">


                            <div class="qty">

                                <button
                                    type="button"
                                    onclick="changeQuantity(${index},-1)">

                                    −

                                </button>


                                <span>

                                    ${quantity}

                                </span>


                                <button
                                    type="button"
                                    onclick="changeQuantity(${index},1)">

                                    +

                                </button>

                            </div>


                            <button
                                type="button"
                                class="remove"
                                onclick="removeItem(${index})">

                                Remove

                            </button>


                        </div>

                    </div>



                    <div class="item-total">

                        ₹${total.toLocaleString(
                            "en-IN",
                            {
                                minimumFractionDigits:2,
                                maximumFractionDigits:2
                            }
                        )}

                    </div>


                </div>

            `;

        }
    );


    /* =====================================================
       DELIVERY
    ====================================================== */

    const delivery =
        subtotal >= 500
            ? 0
            : 40;


    /* =====================================================
       COUPON
    ====================================================== */

    const coupon =
        localStorage.getItem(
            "beatrootCoupon"
        );


    let discount = 0;


    if(
        coupon === "BEATROOT10"
    ){

        discount =
            Math.round(
                subtotal * 0.10
            );

    }


    const grandTotal =
        Math.max(
            0,
            subtotal +
            delivery -
            discount
        );


    area.innerHTML = `

        <div class="cart-layout">


            <!-- =================================================
                 ITEMS
            ================================================== -->

            <section class="card cart-box">

                ${itemsHTML}

            </section>



            <!-- =================================================
                 SUMMARY
            ================================================== -->

            <aside class="card summary">


                <h2 class="summary-title">

                    Order Summary

                </h2>


                <div class="summary-row">

                    <span>
                        Items
                    </span>

                    <span>
                        ${totalItems}
                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <span>
                        ₹${subtotal.toLocaleString(
                            "en-IN",
                            {
                                minimumFractionDigits:2,
                                maximumFractionDigits:2
                            }
                        )}
                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Delivery Fee
                    </span>

                    <span
                        class="${
                            delivery === 0
                                ? "free"
                                : ""
                        }">

                        ${
                            delivery === 0
                                ? "FREE"
                                : "₹" +
                                  delivery.toLocaleString(
                                      "en-IN",
                                      {
                                          minimumFractionDigits:2,
                                          maximumFractionDigits:2
                                      }
                                  )
                        }

                    </span>

                </div>


                ${
                    discount > 0
                    ?
                    `
                    <div class="summary-row">

                        <span>
                            Coupon Discount
                        </span>

                        <span class="free">

                            -₹${discount.toLocaleString(
                                "en-IN"
                            )}

                        </span>

                    </div>
                    `
                    :
                    ""
                }


                <div class="summary-divider"></div>


                <div class="total-row">

                    <div class="total-label">

                        Total

                    </div>

                    <div class="total-price">

                        ₹${grandTotal.toLocaleString(
                            "en-IN",
                            {
                                minimumFractionDigits:2,
                                maximumFractionDigits:2
                            }
                        )}

                    </div>

                </div>



                <!-- COUPON -->

                <div class="coupon">

                    <div class="coupon-title">

                        Have a coupon?

                    </div>


                    <div class="coupon-box">

                        <input
                            id="couponInput"
                            type="text"
                            placeholder="Enter coupon code"
                            value="${
                                coupon || ""
                            }">

                        <button
                            type="button"
                            onclick="applyCoupon()">

                            Apply

                        </button>

                    </div>


                    <div
                        id="couponMessage"
                        class="coupon-message">

                        ${
                            coupon === "BEATROOT10"
                            ? "Coupon applied!"
                            : ""
                        }

                    </div>

                </div>



                <button
                    class="checkout-btn"
                    type="button"
                    onclick="goCheckout()">

                    Proceed to Checkout →

                </button>


                <a
                    href="restaurants.html"
                    class="continue">

                    ← Continue Shopping

                </a>

/* =========================================================
   CHECKOUT
========================================================= */

function goCheckout(){

    if(
        !cart ||
        cart.length === 0
    ){

        alert(
            "Your cart is empty."
        );

        return;

    }


    /*
     * Save cart before checkout.
     */

    saveCart();


    window.location.href =
        "checkout.html";

}


/* =========================================================
   REORDER SUPPORT
========================================================= */

function loadReorder(){

    const reorder =
        localStorage.getItem(
            "beatroot_reorder"
        );


    if(!reorder){

        return;

    }


    try{

        const items =
            JSON.parse(
                reorder
            );


        if(
            !Array.isArray(items) ||
            !items.length
        ){

            localStorage.removeItem(
                "beatroot_reorder"
            );

            return;

        }


        /*
         * Only add reorder items if
         * the current cart is empty.
         */

        if(
            cart.length === 0
        ){

            cart =
                items.map(
                    item => ({

                        id:
                            item.id ||
                            item.menu_item_id ||
                            null,

                        menu_item_id:
                            item.menu_item_id ||
                            item.id ||
                            null,

                        name:
                            item.item_name ||
                            item.name ||
                            "Food Item",

                        price:
                            Number(
                                item.unit_price ||
                                item.price ||
                                0
                            ),

                        quantity:
                            Number(
                                item.quantity ||
                                1
                            ),

                        restaurant:
                            item.restaurant ||
                            "Restaurant",

                        image:
                            item.image ||
                            ""

                    })
                );


            saveCart();

        }


        localStorage.removeItem(
            "beatroot_reorder"
        );


    }
    catch(error){

        console.error(
            "Reorder data error:",
            error
        );

        localStorage.removeItem(
            "beatroot_reorder"
        );

    }

}


/* =========================================================
   START
========================================================= */

loadReorder();

renderCart();

</script>
