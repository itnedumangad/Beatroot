<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cart - Beatroot</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f6f7f9;
    color:#171717;
}

/* HEADER */

.header{
    height:72px;
    background:#fff;
    border-bottom:1px solid #e8e8e8;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    text-decoration:none;
    font-size:28px;
    font-weight:900;
    letter-spacing:-1px;
    color:#ef3f3f;
}

.logo span{
    color:#171717;
}

.nav{
    display:flex;
    align-items:center;
    gap:22px;
}

.nav a{
    text-decoration:none;
    color:#333;
    font-size:14px;
    font-weight:600;
}

.cart-link{
    background:#ef3f3f;
    color:white !important;
    padding:11px 16px;
    border-radius:10px;
}

/* PAGE */

.container{
    max-width:1150px;
    margin:0 auto;
    padding:40px 20px 70px;
}

.page-title{
    font-size:34px;
    font-weight:800;
    margin-bottom:8px;
}

.page-subtitle{
    color:#777;
    margin-bottom:28px;
}

/* LAYOUT */

.cart-layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 360px;
    gap:24px;
}

.card{
    background:#fff;
    border:1px solid #e8e8e8;
    border-radius:18px;
    padding:22px;
    box-shadow:0 8px 30px rgba(0,0,0,.05);
}

/* ITEM */

.cart-item{
    display:flex;
    align-items:center;
    gap:18px;
    padding:18px 0;
    border-bottom:1px solid #eeeeee;
}

.cart-item:last-child{
    border-bottom:none;
}

.food-image{
    width:92px;
    height:92px;
    object-fit:cover;
    border-radius:14px;
    background:#f1f1f1;
    flex-shrink:0;
}

.item-info{
    flex:1;
    min-width:0;
}

.item-name{
    font-size:18px;
    font-weight:750;
    margin-bottom:5px;
}

.restaurant-name{
    color:#777;
    font-size:13px;
    margin-bottom:8px;
}

.item-price{
    font-size:14px;
    color:#555;
}

.item-total{
    font-size:18px;
    font-weight:800;
    white-space:nowrap;
}

/* QUANTITY */

.quantity{
    display:flex;
    align-items:center;
    gap:9px;
    margin-top:12px;
}

.quantity button{
    width:32px;
    height:32px;
    border:none;
    border-radius:8px;
    background:#f0f1f3;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.quantity button:hover{
    background:#e4e5e7;
}

.quantity span{
    min-width:24px;
    text-align:center;
    font-weight:700;
}

.remove{
    margin-top:9px;
    border:none;
    background:none;
    color:#e53935;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
}

/* SUMMARY */

.summary{
    position:sticky;
    top:95px;
    height:max-content;
}

.summary h2{
    font-size:21px;
    margin-bottom:20px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    color:#555;
    font-size:14px;
}

.summary-total{
    border-top:1px solid #e5e5e5;
    margin-top:10px;
    padding-top:18px;
    display:flex;
    justify-content:space-between;
    font-size:21px;
    font-weight:800;
}

.checkout-btn{
    width:100%;
    height:52px;
    margin-top:22px;
    border:none;
    border-radius:11px;
    background:#ef3f3f;
    color:white;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
}

.checkout-btn:hover{
    background:#d93434;
}

.continue{
    display:block;
    text-align:center;
    margin-top:16px;
    color:#ef3f3f;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:80px 20px;
}

.empty-icon{
    font-size:58px;
    margin-bottom:15px;
}

.empty h2{
    font-size:24px;
    margin-bottom:8px;
}

.empty p{
    color:#777;
    margin-bottom:25px;
}

.shop-btn{
    display:inline-block;
    text-decoration:none;
    background:#ef3f3f;
    color:white;
    padding:13px 22px;
    border-radius:10px;
    font-weight:700;
}

/* MESSAGE */

.message{
    display:none;
    padding:14px 16px;
    border-radius:10px;
    margin-bottom:20px;
    font-size:14px;
}

.message.error{
    display:block;
    background:#fff0f0;
    color:#d32f2f;
    border:1px solid #ffd1d1;
}

/* LOADING */

.loading{
    text-align:center;
    padding:60px;
    color:#777;
}

/* MOBILE */

@media(max-width:800px){

    .header{
        padding:0 18px;
    }

    .nav a:not(.cart-link){
        display:none;
    }

    .container{
        padding:28px 15px 50px;
    }

    .page-title{
        font-size:28px;
    }

    .cart-layout{
        grid-template-columns:1fr;
    }

    .summary{
        position:static;
    }

}

@media(max-width:520px){

    .card{
        padding:16px;
    }

    .cart-item{
        align-items:flex-start;
        gap:12px;
    }

    .food-image{
        width:72px;
        height:72px;
    }

    .item-name{
        font-size:15px;
    }

    .item-total{
        font-size:15px;
    }

}

</style>

</head>

<body>

<header class="header">

    <a href="../index.html" class="logo">
        Beat<span>root</span>
    </a>

    <nav class="nav">

        <a href="../index.html">
            Home
        </a>

        <a href="restaurants.html">
            Restaurants
        </a>

        <a href="my-orders.html">
            My Orders
        </a>

        <a href="profile.html">
            Profile
        </a>

        <a href="cart.html" class="cart-link">
            🛒 Cart
            (<span id="cartCount">0</span>)
        </a>

    </nav>

</header>


<main class="container">

    <h1 class="page-title">
        Your Cart
    </h1>

    <p class="page-subtitle">
        Review your items before checkout
    </p>

    <div id="message" class="message"></div>

    <div id="cartArea">

        <div class="loading">
            Loading cart...
        </div>

    </div>

</main>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://jhihjnsxazmftdqlitgk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_r_zMn0-GhFNtuvs5-UOo9w_D8SW8J57";

const sb = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==========================================
   GLOBAL
========================================== */

let cart = [];

let currentUser = null;


/* ==========================================
   MESSAGE
========================================== */

function showError(text){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className = "message error";

}

function hideMessage(){

    const box =
        document.getElementById("message");

    box.textContent = "";

    box.className = "message";

}


/* ==========================================
   AUTH
========================================== */

async function checkUser(){

    const result =
        await sb.auth.getUser();

    if(
        result.error ||
        !result.data.user
    ){

        window.location.href =
            "login.html";

        return false;

    }

    currentUser =
        result.data.user;

    return true;

}


/* ==========================================
   LOAD CART
========================================== */

async function loadCart(){

    hideMessage();

    const authenticated =
        await checkUser();

    if(!authenticated){
        return;
    }


    const result =
        await sb
        .from("cart_items")
        .select(`
            id,
            quantity,
            menu_item_id,
            menu_items (
                id,
                restaurant_id,
                name,
                description,
                price,
                image_url,
                restaurants (
                    id,
                    name
                )
            )
        `)
        .eq(
            "customer_id",
            currentUser.id
        )
        .order(
            "created_at",
            {ascending:true}
        );


    if(result.error){

        console.error(result.error);

        showError(
            "Cart load cheyyan kazhinjilla. " +
            result.error.message
        );

        return;

    }


    cart =
        result.data || [];

    renderCart();

}


/* ==========================================
   CART COUNT
========================================== */

function updateCartCount(){

    const count =
        cart.reduce(
            (sum,item)=>
                sum + Number(item.quantity || 0),
            0
        );

    document.getElementById(
        "cartCount"
    ).textContent = count;

}


/* ==========================================
   UPDATE QUANTITY
========================================== */

async function changeQuantity(
    cartId,
    quantity
){

    if(quantity <= 0){

        await removeItem(cartId);

        return;

    }


    const result =
        await sb
        .from("cart_items")
        .update({
            quantity:quantity
        })
        .eq("id",cartId)
        .eq(
            "customer_id",
            currentUser.id
        );


    if(result.error){

        showError(
            "Quantity update cheyyan kazhinjilla."
        );

        return;

    }


    await loadCart();

}


/* ==========================================
   REMOVE ITEM
========================================== */

async function removeItem(cartId){

    const result =
        await sb
        .from("cart_items")
        .delete()
        .eq("id",cartId)
        .eq(
            "customer_id",
            currentUser.id
        );


    if(result.error){

        showError(
            "Item remove cheyyan kazhinjilla."
        );

        return;

    }


    await loadCart();

}


/* ==========================================
   RENDER
========================================== */

function renderCart(){

    updateCartCount();

    const area =
        document.getElementById("cartArea");


    if(cart.length === 0){

        area.innerHTML = `

            <div class="card empty">

                <div class="empty-icon">
                    🛒
                </div>

                <h2>
                    Your cart is empty
                </h2>

                <p>
                    Add some delicious food
                    from our restaurants.
                </p>

                <a
                    href="restaurants.html"
                    class="shop-btn"
                >
                    Browse Restaurants
                </a>

            </div>

        `;

        return;

    }


    let subtotal = 0;

    let html = "";


    cart.forEach(item=>{

        const food =
            item.menu_items;

        if(!food){
            return;
        }


        const price =
            Number(food.price || 0);

        const quantity =
            Number(item.quantity || 1);

        const total =
            price * quantity;

        subtotal += total;


        const image =
            food.image_url ||
            "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=400&q=80";


        const restaurant =
            food.restaurants?.name ||
            "Restaurant";


        html += `

            <div class="cart-item">

                <img
                    class="food-image"
                    src="${escapeHTML(image)}"
                    alt="${escapeHTML(food.name)}"
                >

                <div class="item-info">

                    <div class="item-name">
                        ${escapeHTML(food.name)}
                    </div>

                    <div class="restaurant-name">
                        ${escapeHTML(restaurant)}
                    </div>

                    <div class="item-price">
                        ₹${price.toFixed(2)}
                    </div>

                    <div class="quantity">

                        <button
                            onclick="
                                changeQuantity(
                                    ${item.id},
                                    ${quantity - 1}
                                )
                            "
                        >
                            −
                        </button>

                        <span>
                            ${quantity}
                        </span>

                        <button
                            onclick="
                                changeQuantity(
                                    ${item.id},
                                    ${quantity + 1}
                                )
                            "
                        >
                            +
                        </button>

                    </div>

                    <button
                        class="remove"
                        onclick="
                            removeItem(${item.id})
                        "
                    >
                        Remove
                    </button>

                </div>

                <div class="item-total">
                    ₹${total.toFixed(2)}
                </div>

            </div>

        `;

    });


    /*
       Same delivery calculation
       as your previous cart.
    */

    const delivery =
        subtotal >= 500
            ? 0
            : 40;


    const grandTotal =
        subtotal + delivery;


    area.innerHTML = `

        <div class="cart-layout">

            <div class="card">

                ${html}

            </div>


            <div class="card summary">

                <h2>
                    Order Summary
                </h2>

                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <strong>
                        ₹${subtotal.toFixed(2)}
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Delivery Fee
                    </span>

                    <strong>
                        ${
                            delivery === 0
                            ? "FREE"
                            : "₹" + delivery.toFixed(2)
                        }
                    </strong>

                </div>


                <div class="summary-total">

                    <span>
                        Total
                    </span>

                    <span>
                        ₹${grandTotal.toFixed(2)}
                    </span>

                </div>


                <button
                    class="checkout-btn"
                    onclick="goCheckout()"
                >
                    Proceed to Checkout
                </button>


                <a
                    href="restaurants.html"
                    class="continue"
                >
                    ← Continue Shopping
                </a>

            </div>

        </div>

    `;

}


/* ==========================================
   CHECKOUT
========================================== */

function goCheckout(){

    if(cart.length === 0){

        showError(
            "Your cart is empty."
        );

        return;

    }


    window.location.href =
        "checkout.html";

}


/* ==========================================
   HTML ESCAPE
========================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================
   START
========================================== */

loadCart();

</script>

</body>

</html>
