<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beatroot - Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        html,body{
            width:100%;
            min-height:100%;
            font-family:Arial,Helvetica,sans-serif;
        }

        body{
            min-height:100vh;
            background:
                radial-gradient(circle at top left,#ffe8e6,transparent 35%),
                radial-gradient(circle at bottom right,#ffeef0,transparent 35%),
                #f7f8fc;

            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
        }

        .login-wrapper{
            width:100%;
            max-width:1050px;
            min-height:620px;

            background:#fff;

            border-radius:28px;

            box-shadow:
                0 25px 70px rgba(0,0,0,.12);

            overflow:hidden;

            display:grid;
            grid-template-columns:1fr 1fr;
        }

        /* LEFT */

        .left{
            background:
                linear-gradient(
                    145deg,
                    #111827,
                    #1f2937
                );

            color:#fff;

            padding:55px;

            display:flex;
            flex-direction:column;
            justify-content:center;

            position:relative;
            overflow:hidden;
        }

        .left::before{
            content:"";

            position:absolute;

            width:300px;
            height:300px;

            border-radius:50%;

            background:rgba(239,68,68,.12);

            top:-120px;
            right:-100px;
        }

        .left::after{
            content:"";

            position:absolute;

            width:250px;
            height:250px;

            border-radius:50%;

            background:rgba(255,255,255,.04);

            bottom:-100px;
            left:-80px;
        }

        .brand{
            position:relative;
            z-index:2;

            font-size:38px;
            font-weight:800;

            margin-bottom:45px;
        }

        .brand span{
            color:#ef4444;
        }

        .left h1{
            position:relative;
            z-index:2;

            font-size:42px;
            line-height:1.15;

            margin-bottom:18px;
        }

        .left p{
            position:relative;
            z-index:2;

            color:#d1d5db;

            font-size:16px;
            line-height:1.7;

            max-width:430px;
        }

        .features{
            position:relative;
            z-index:2;

            margin-top:40px;
        }

        .feature{
            display:flex;
            align-items:center;
            gap:12px;

            margin:15px 0;

            color:#e5e7eb;

            font-size:14px;
        }

        .feature-icon{
            width:35px;
            height:35px;

            border-radius:10px;

            background:#ef4444;

            display:flex;
            align-items:center;
            justify-content:center;
        }

        /* RIGHT */

        .right{
            padding:55px;

            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        .login-title{
            font-size:30px;
            font-weight:800;

            color:#111827;

            margin-bottom:8px;
        }

        .login-subtitle{
            color:#6b7280;

            font-size:14px;

            margin-bottom:30px;
        }

        .form-group{
            margin-bottom:20px;
        }

        .form-group label{
            display:block;

            font-size:13px;
            font-weight:700;

            color:#374151;

            margin-bottom:8px;
        }

        .input-box{
            position:relative;
        }

        .input-box input{
            width:100%;

            height:52px;

            border:1px solid #e5e7eb;

            border-radius:12px;

            padding:0 15px;

            font-size:14px;

            outline:none;

            transition:.2s;

            background:#fafafa;
        }

        .input-box input:focus{
            border-color:#ef4444;

            background:#fff;

            box-shadow:
                0 0 0 4px rgba(239,68,68,.08);
        }

        .password-toggle{
            position:absolute;

            right:14px;
            top:50%;

            transform:translateY(-50%);

            border:0;
            background:transparent;

            cursor:pointer;

            font-size:18px;
        }

        .options{
            display:flex;
            justify-content:space-between;
            align-items:center;

            margin:5px 0 25px;
        }

        .remember{
            display:flex;
            align-items:center;
            gap:7px;

            color:#6b7280;

            font-size:12px;
        }

        .remember input{
            accent-color:#ef4444;
        }

        .forgot{
            border:0;
            background:none;

            color:#ef4444;

            cursor:pointer;

            font-size:12px;
            font-weight:700;
        }

        .login-btn{
            width:100%;

            height:52px;

            border:0;

            border-radius:12px;

            background:#ef4444;

            color:#fff;

            font-size:15px;

            font-weight:700;

            cursor:pointer;

            transition:.2s;
        }

        .login-btn:hover{
            background:#dc2626;

            transform:translateY(-1px);

            box-shadow:
                0 8px 20px rgba(239,68,68,.25);
        }

        .login-btn:disabled{
            opacity:.65;
            cursor:not-allowed;
            transform:none;
        }

        .message{
            display:none;

            padding:12px 14px;

            border-radius:10px;

            font-size:13px;

            margin-bottom:18px;
        }

        .message.error{
            display:block;

            background:#fee2e2;

            color:#b91c1c;

            border:1px solid #fecaca;
        }

        .message.success{
            display:block;

            background:#dcfce7;

            color:#15803d;

            border:1px solid #bbf7d0;
        }

        .divider{
            display:flex;
            align-items:center;

            gap:12px;

            margin:28px 0;

            color:#9ca3af;

            font-size:12px;
        }

        .divider::before,
        .divider::after{
            content:"";

            height:1px;

            background:#e5e7eb;

            flex:1;
        }

        .footer-text{
            text-align:center;

            color:#9ca3af;

            font-size:12px;

            margin-top:25px;
        }

        .loading{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:8px;
        }

        .spinner{
            width:16px;
            height:16px;

            border:2px solid rgba(255,255,255,.4);
            border-top-color:#fff;

            border-radius:50%;

            animation:spin .7s linear infinite;
        }

        @keyframes spin{
            to{
                transform:rotate(360deg);
            }
        }

        /* MOBILE */

        @media(max-width:800px){

            body{
                padding:12px;
            }

            .login-wrapper{
                grid-template-columns:1fr;

                min-height:auto;

                max-width:520px;
            }

            .left{
                padding:35px 30px;

                min-height:280px;
            }

            .brand{
                font-size:30px;
                margin-bottom:25px;
            }

            .left h1{
                font-size:30px;
            }

            .left p{
                font-size:14px;
            }

            .features{
                display:none;
            }

            .right{
                padding:35px 25px;
            }

        }

        @media(max-width:450px){

            .left{
                padding:30px 22px;
            }

            .right{
                padding:30px 20px;
            }

            .login-title{
                font-size:25px;
            }

            .options{
                align-items:flex-start;
            }

        }

    </style>
</head>

<body>

<div class="login-wrapper">

    <!-- LEFT SIDE -->

    <section class="left">

        <div class="brand">
            Beat<span>root</span>
        </div>

        <h1>
            Welcome Back!
        </h1>

        <p>
            Login to your Beatroot account and manage your
            orders, restaurants and deliveries from one place.
        </p>

        <div class="features">

            <div class="feature">

                <div class="feature-icon">
                    🛒
                </div>

                <span>
                    Manage your orders
                </span>

            </div>

            <div class="feature">

                <div class="feature-icon">
                    🍔
                </div>

                <span>
                    Restaurant management
                </span>

            </div>

            <div class="feature">

                <div class="feature-icon">
                    🚴
                </div>

                <span>
                    Delivery management
                </span>

            </div>

        </div>

    </section>


    <!-- RIGHT SIDE -->

    <section class="right">

        <h2 class="login-title">
            Sign In
        </h2>

        <p class="login-subtitle">
            Enter your account details to continue.
        </p>


        <div id="messageBox" class="message"></div>


        <form id="loginForm">

            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <div class="input-box">

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword()"
                        id="passwordToggle"
                    >
                        👁️
                    </button>

                </div>

            </div>


            <!-- OPTIONS -->

            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    Remember me

                </label>

                <button
                    type="button"
                    class="forgot"
                    onclick="forgotPassword()"
                >
                    Forgot Password?
                </button>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Sign In
            </button>

        </form>


        <div class="divider">
            Beatroot
        </div>


        <div class="footer-text">
            © 2026 Beatroot. All rights reserved.
        </div>

    </section>

</div>


<script>

/* =========================================================
   SUPABASE CONFIGURATION
========================================================= */

const SUPABASE_URL =
    "https://jhihjnsxazmftdqlitgk.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_r_zMn0-GhFNtuvs5-UOo9w_D8SW8J57";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   ELEMENTS
========================================================= */

const loginForm =
    document.getElementById("loginForm");

const loginBtn =
    document.getElementById("loginBtn");

const messageBox =
    document.getElementById("messageBox");


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    message,
    type = "error"
){

    messageBox.textContent =
        message;

    messageBox.className =
        "message " + type;

}


function hideMessage(){

    messageBox.textContent = "";

    messageBox.className =
        "message";

}


/* =========================================================
   PASSWORD TOGGLE
========================================================= */

function togglePassword(){

    const password =
        document.getElementById("password");

    const toggle =
        document.getElementById("passwordToggle");


    if(password.type === "password"){

        password.type = "text";

        toggle.textContent = "🙈";

    }
    else{

        password.type = "password";

        toggle.textContent = "👁️";

    }

}


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        hideMessage();


        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("password")
                .value;


        if(!email || !password){

            showMessage(
                "Please enter your email and password."
            );

            return;

        }


        /* BUTTON LOADING */

        loginBtn.disabled = true;

        loginBtn.innerHTML = `
            <span class="loading">
                <span class="spinner"></span>
                Signing in...
            </span>
        `;


        try{

            /* -----------------------------------------
               SUPABASE LOGIN
            ----------------------------------------- */

            const {
                data,
                error
            } =
            await supabaseClient.auth.signInWithPassword({

                email:email,

                password:password

            });


            if(error){

                throw error;

            }


            if(!data || !data.user){

                throw new Error(
                    "Login failed. User not found."
                );

            }


            const user =
                data.user;


            /* -----------------------------------------
               GET USER ROLE
            ----------------------------------------- */

            const {
                data:roleData,
                error:roleError
            } =
            await supabaseClient
                .from("user_roles")
                .select(`
                    id,
                    role,
                    restaurant_id,
                    delivery_boy_id
                `)
                .eq(
                    "user_id",
                    user.id
                )
                .maybeSingle();


            if(roleError){

                console.error(
                    "Role error:",
                    roleError
                );

                throw new Error(
                    "Unable to load user role."
                );

            }


            /* -----------------------------------------
               NO ROLE
            ----------------------------------------- */

            if(!roleData){

                await supabaseClient.auth.signOut();

                throw new Error(
                    "Your account does not have a role assigned. Please contact the administrator."
                );

            }


            const role =
                String(
                    roleData.role || ""
                )
                .toLowerCase()
                .trim();


            console.log(
                "Logged in user:",
                user.email
            );

            console.log(
                "User role:",
                role
            );

            console.log(
                "Role data:",
                roleData
            );


            /* -----------------------------------------
               SUCCESS MESSAGE
            ----------------------------------------- */

            showMessage(
                "Login successful. Redirecting...",
                "success"
            );


            /*
               Small delay so user can see
               successful login message.
            */

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        500
                    )
            );


            /* =========================================
               ROLE BASED REDIRECTION
            ========================================= */


            /* ADMIN */

            if(role === "admin"){

                window.location.href =
                    "admin-dashboard.html";

                return;

            }


            /* RESTAURANT */

            if(
                role === "restaurant" ||
                role === "restaurant_owner"
            ){

                window.location.href =
                    "restaurant.html";

                return;

            }


            /* DELIVERY BOY */

            if(
                role === "delivery_boy" ||
                role === "delivery"
            ){

                window.location.href =
                    "delivery-dashboard.html";

                return;

            }


            /* CUSTOMER */

            if(role === "customer"){

                window.location.href =
                    "../index.html";

                return;

            }


            /* UNKNOWN ROLE */

            await supabaseClient.auth.signOut();

            throw new Error(
                "Unknown account role: " +
                role
            );

        }
        catch(error){

            console.error(
                "Login error:",
                error
            );


            let message =
                "Login failed.";


            if(error.message){

                message =
                    error.message;

            }


            /* FRIENDLY SUPABASE ERRORS */

            if(
                message
                    .toLowerCase()
                    .includes(
                        "invalid login credentials"
                    )
            ){

                message =
                    "Invalid email or password.";

            }


            if(
                message
                    .toLowerCase()
                    .includes(
                        "email not confirmed"
                    )
            ){

                message =
                    "Please confirm your email before logging in.";

            }


            showMessage(
                message
            );


            loginBtn.disabled = false;

            loginBtn.textContent =
                "Sign In";

        }

    }
);


/* =========================================================
   FORGOT PASSWORD
========================================================= */

async function forgotPassword(){

    hideMessage();


    const email =
        document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();


    if(!email){

        showMessage(
            "Enter your email address first."
        );

        document
            .getElementById("email")
            .focus();

        return;

    }


    try{

        const {
            error
        } =
        await supabaseClient.auth
            .resetPasswordForEmail(
                email,
                {
                    redirectTo:
                        window.location.origin +
                        "/pages/reset-password.html"
                }
            );


        if(error){

            throw error;

        }


        showMessage(
            "Password reset email has been sent. Please check your inbox.",
            "success"
        );

    }
    catch(error){

        console.error(
            "Password reset error:",
            error
        );

        showMessage(
            error.message ||
            "Unable to send password reset email."
        );

    }

}


/* =========================================================
   CHECK EXISTING SESSION
========================================================= */

async function checkExistingSession(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.getSession();


        if(error){

            console.error(
                "Session error:",
                error
            );

            return;

        }


        const session =
            data.session;


        if(!session){

            return;

        }


        const user =
            session.user;


        /* -----------------------------------------
           GET ROLE
        ----------------------------------------- */

        const {
            data:roleData,
            error:roleError
        } =
        await supabaseClient
            .from("user_roles")
            .select(`
                role,
                restaurant_id,
                delivery_boy_id
            `)
            .eq(
                "user_id",
                user.id
            )
            .maybeSingle();


        if(roleError){

            console.error(
                roleError
            );

            return;

        }


        if(!roleData){

            return;

        }


        const role =
            String(
                roleData.role || ""
            )
            .toLowerCase()
            .trim();


        /* ADMIN */

        if(role === "admin"){

            window.location.href =
                "admin-dashboard.html";

            return;

        }


        /* RESTAURANT */

        if(
            role === "restaurant" ||
            role === "restaurant_owner"
        ){

            window.location.href =
                "restaurant.html";

            return;

        }


        /* DELIVERY */

        if(
            role === "delivery_boy" ||
            role === "delivery"
        ){

            window.location.href =
                "delivery-dashboard.html";

            return;

        }


        /* CUSTOMER */

        if(role === "customer"){

            window.location.href =
                "../index.html";

            return;

        }

    }
    catch(error){

        console.error(
            "Session check error:",
            error
        );

    }

}


/* =========================================================
   START
========================================================= */

checkExistingSession();

</script>

</body>
</html>
