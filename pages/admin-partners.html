<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beatroot - Partner Applications</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#171717;
}

button{
    font-family:inherit;
    cursor:pointer;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{

    width:250px;

    background:#111827;

    color:white;

    position:fixed;

    left:0;
    top:0;
    bottom:0;

    padding:25px 15px;

    z-index:100;
}

.brand{

    font-size:27px;

    font-weight:800;

    padding:0 15px 30px;
}

.brand span{
    color:#ef4444;
}

.admin-label{

    font-size:12px;

    color:#9ca3af;

    padding:0 15px;

    margin-bottom:10px;

    text-transform:uppercase;

    letter-spacing:1px;
}

.menu{
    list-style:none;
}

.menu li{
    margin:5px 0;
}

.menu button{

    width:100%;

    border:0;

    background:transparent;

    color:#d1d5db;

    padding:13px 15px;

    text-align:left;

    border-radius:10px;

    font-size:14px;
}

.menu button:hover,
.menu button.active{

    background:#ef4444;

    color:white;
}

.menu-icon{

    width:25px;

    display:inline-block;
}

.sidebar-bottom{

    position:absolute;

    left:15px;
    right:15px;

    bottom:20px;
}

.logout{

    width:100%;

    border:1px solid #374151;

    background:transparent;

    color:#d1d5db;

    padding:12px;

    border-radius:10px;
}

.logout:hover{

    background:#1f2937;

    color:white;
}


/* =========================================================
   MAIN
========================================================= */

.main{

    margin-left:250px;

    min-height:100vh;
}


/* =========================================================
   TOPBAR
========================================================= */

.topbar{

    height:75px;

    background:white;

    border-bottom:1px solid #e5e7eb;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:0 30px;

    position:sticky;

    top:0;

    z-index:50;
}

.mobile-menu{

    display:none;

    border:0;

    background:#f3f4f6;

    padding:10px;

    border-radius:8px;
}

.top-title{

    font-size:22px;

    font-weight:700;
}

.top-right{

    display:flex;

    align-items:center;

    gap:15px;
}

.profile{

    display:flex;

    align-items:center;

    gap:10px;
}

.avatar{

    width:40px;
    height:40px;

    background:#ef4444;

    color:white;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:bold;
}

.profile-text strong{

    display:block;

    font-size:13px;
}

.profile-text small{

    color:#888;
}


/* =========================================================
   CONTENT
========================================================= */

.content{

    padding:30px;
}

.page-heading{

    margin-bottom:25px;
}

.page-heading h1{

    font-size:27px;

    margin-bottom:6px;
}

.page-heading p{

    color:#6b7280;
}


/* =========================================================
   ERROR / SUCCESS
========================================================= */

.message{

    display:none;

    padding:14px;

    border-radius:10px;

    margin-bottom:20px;

    font-size:13px;
}

.message.error{

    display:block;

    background:#fee2e2;

    color:#b91c1c;

    border:1px solid #fecaca;
}

.message.success{

    display:block;

    background:#dcfce7;

    color:#15803d;

    border:1px solid #bbf7d0;
}


/* =========================================================
   FILTERS
========================================================= */

.filter-card{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:16px;

    padding:18px;

    margin-bottom:20px;

    display:flex;

    gap:12px;

    flex-wrap:wrap;

    align-items:center;
}

.filter-btn{

    border:1px solid #e5e7eb;

    background:#fafafa;

    color:#374151;

    padding:10px 16px;

    border-radius:9px;

    font-size:12px;

    font-weight:700;
}

.filter-btn:hover,
.filter-btn.active{

    background:#ef4444;

    border-color:#ef4444;

    color:white;
}

.search-box{

    margin-left:auto;

    min-width:220px;
}

.search-box input{

    width:100%;

    height:40px;

    border:1px solid #e5e7eb;

    border-radius:9px;

    padding:0 12px;

    outline:none;
}

.search-box input:focus{

    border-color:#ef4444;
}


/* =========================================================
   STATS
========================================================= */

.stats{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:18px;

    margin-bottom:20px;
}

.stat{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:15px;

    padding:20px;
}

.stat small{

    color:#6b7280;

    font-size:12px;
}

.stat h2{

    margin-top:8px;

    font-size:27px;
}

.stat.pending h2{
    color:#d97706;
}

.stat.approved h2{
    color:#16a34a;
}

.stat.rejected h2{
    color:#dc2626;
}


/* =========================================================
   APPLICATION CARD
========================================================= */

.application-list{

    display:grid;

    gap:15px;
}

.application{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:16px;

    padding:20px;
}

.application-top{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:15px;

    margin-bottom:18px;
}

.applicant{

    display:flex;

    align-items:center;

    gap:13px;
}

.applicant-icon{

    width:48px;
    height:48px;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:23px;

    background:#fff1f2;
}

.applicant h3{

    font-size:16px;

    margin-bottom:4px;
}

.applicant p{

    color:#6b7280;

    font-size:12px;
}

.type-badge{

    display:inline-block;

    padding:5px 9px;

    border-radius:15px;

    font-size:10px;

    font-weight:700;

    margin-top:5px;
}

.type-restaurant{

    background:#fff7ed;

    color:#c2410c;
}

.type-delivery{

    background:#eff6ff;

    color:#2563eb;
}


/* STATUS */

.status{

    padding:7px 11px;

    border-radius:20px;

    font-size:11px;

    font-weight:700;

    white-space:nowrap;
}

.status-pending{

    background:#fef3c7;

    color:#92400e;
}

.status-approved{

    background:#dcfce7;

    color:#15803d;
}

.status-rejected{

    background:#fee2e2;

    color:#dc2626;
}


/* DETAILS */

.details{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:12px;

    background:#f9fafb;

    border-radius:12px;

    padding:15px;

    margin-bottom:15px;
}

.detail{

    font-size:12px;
}

.detail label{

    display:block;

    color:#9ca3af;

    font-size:10px;

    margin-bottom:4px;

    text-transform:uppercase;
}

.detail strong{

    color:#374151;

    font-size:12px;

    word-break:break-word;
}


/* ACTIONS */

.actions{

    display:flex;

    gap:9px;

    flex-wrap:wrap;
}

.action-btn{

    border:0;

    border-radius:9px;

    padding:10px 15px;

    font-size:12px;

    font-weight:700;
}

.view-btn{

    background:#eff6ff;

    color:#2563eb;
}

.approve-btn{

    background:#dcfce7;

    color:#15803d;
}

.reject-btn{

    background:#fee2e2;

    color:#dc2626;
}

.action-btn:hover{

    opacity:.8;
}


/* EMPTY */

.empty{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:16px;

    padding:50px 20px;

    text-align:center;

    color:#6b7280;
}

.empty-icon{

    font-size:40px;

    margin-bottom:12px;
}


/* LOADING */

.loading{

    text-align:center;

    padding:50px;

    color:#777;
}


/* =========================================================
   MODAL
========================================================= */

.modal{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(17,24,39,.55);

    z-index:500;

    align-items:center;

    justify-content:center;

    padding:20px;
}

.modal.show{

    display:flex;
}

.modal-box{

    width:100%;

    max-width:600px;

    max-height:90vh;

    overflow-y:auto;

    background:white;

    border-radius:18px;

    padding:25px;
}

.modal-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;
}

.modal-header h2{

    font-size:20px;
}

.close-btn{

    border:0;

    background:#f3f4f6;

    width:35px;
    height:35px;

    border-radius:8px;

    font-size:18px;
}

.modal-detail{

    padding:13px 0;

    border-bottom:1px solid #eee;
}

.modal-detail label{

    display:block;

    color:#9ca3af;

    font-size:11px;

    margin-bottom:4px;
}

.modal-detail strong{

    font-size:13px;

    color:#374151;
}

.modal-actions{

    display:flex;

    gap:10px;

    margin-top:20px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:1000px){

    .stats{

        grid-template-columns:repeat(2,1fr);
    }

    .details{

        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:700px){

    .sidebar{

        transform:translateX(-100%);

        transition:.25s;
    }

    .sidebar.open{

        transform:translateX(0);
    }

    .main{

        margin-left:0;
    }

    .mobile-menu{

        display:block;
    }

    .topbar{

        padding:0 15px;
    }

    .top-title{

        font-size:17px;
    }

    .profile-text{

        display:none;
    }

    .content{

        padding:20px 15px;
    }

    .search-box{

        width:100%;

        min-width:0;

        margin-left:0;
    }

}

@media(max-width:500px){

    .stats{

        grid-template-columns:1fr 1fr;

        gap:10px;
    }

    .stat{

        padding:15px;
    }

    .stat h2{

        font-size:22px;
    }

    .details{

        grid-template-columns:1fr;
    }

    .application-top{

        flex-direction:column;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside class="sidebar" id="sidebar">

    <div class="brand">
        Beat<span>root</span>
    </div>

    <div class="admin-label">

    </div>

    <ul class="menu">

        <li>
            <button onclick="goDashboard()">

                Dashboard
            </button>
        </li>

        <li>
            <button onclick="goOrders()">
                <span class="menu-icon">🛒</span>
                Orders
            </button>
        </li>

        <li>
            <button onclick="goCustomers()">
                <span class="menu-icon">👥</span>

            </button>
        </li>

        <li>
            <button class="active">
                <span class="menu-icon">🤝</span>
                Partner Applications
            </button>
        </li>

        <li>
            <button onclick="goRestaurants()">
                <span class="menu-icon">🍔</span>
                Restaurants
            </button>
        </li>

        <li>
            <button onclick="goReports()">
                <span class="menu-icon">📈</span>
                Reports

            <button onclick="goSettings()">

<!-- =====================================================

<!-- =====================================================

<section class="stats">

<!-- =====================================================

<div class="filter-card">

</main>

</div>


<!-- =====================================================
     DETAILS MODAL
===================================================== -->

<div
    class="modal"
    id="detailsModal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                Application Details

        <div id="modalContent">

        <div

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://jhihjnsxazmftdqlitgk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_r_zMn0-GhFNtuvs5-UOo9w_D8SW8J57";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   ADMIN
========================================================= */

const ADMIN_EMAIL =
    "itnedumangad@gmail.com";


/* =========================================================
   STATE
========================================================= */

let applications = [];

let currentFilter =
    "all";

let selectedApplication =
    null;


/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar(){

    document
        .getElementById("sidebar")
        .classList.toggle("open");

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    message,
    type="success"
){

    const box =
        document.getElementById(
            "messageBox"
        );

    box.textContent =
        message;

    box.className =
        "message " + type;

}

function hideMessage(){

    const box =
        document.getElementById(
            "messageBox"
        );

    box.textContent =
        "";

    box.className =
        "message";

}


/* =========================================================
   ADMIN CHECK
========================================================= */

async function checkAdmin(){

    const {
        data,
        error
    } =
    await supabaseClient.auth.getUser();


    if(error){

        throw error;

    }


    const user =
        data.user;


    if(!user){

        window.location.href =
            "login.html";

        return false;

    }


    if(
        !user.email ||
        user.email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ){

        await supabaseClient.auth.signOut();

        alert(
            "Access denied. Admin only."
        );

        window.location.href =
            "login.html";

        return false;

    }


    document.getElementById(
        "adminName"
    ).textContent =
        user.email.split("@")[0];


    document.getElementById(
        "avatar"
    ).textContent =
        user.email
            .charAt(0)
            .toUpperCase();


    return true;

}


/* =========================================================
   LOAD APPLICATIONS
========================================================= */

async function loadApplications(){

    try{

        const allowed =
            await checkAdmin();


        if(!allowed){

            return;

        }


        const {
            data,
            error
        } =
        await supabaseClient
            .from("partner_applications")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(error){

            throw error;

        }


        applications =
            data || [];


        updateStats();

        renderApplications();

    }
    catch(error){

        console.error(
            "Applications error:",
            error
        );


        showMessage(
            "Unable to load partner applications: " +
            error.message,
            "error"
        );


        document.getElementById(
            "applicationList"
        ).innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                Unable to load applications.

            </div>

        `;

    }

}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

    const total =
        applications.length;


    const pending =
        applications.filter(
            app =>
                String(
                    app.status || ""
                ).toLowerCase() ===
                "pending"
        ).length;


    const approved =
        applications.filter(
            app =>
                String(
                    app.status || ""
                ).toLowerCase() ===
                "approved"
        ).length;


    const rejected =
        applications.filter(
            app =>
                String(
                    app.status || ""
                ).toLowerCase() ===
                "rejected"
        ).length;


    document.getElementById(
        "totalCount"
    ).textContent =
        total;


    document.getElementById(
        "pendingCount"
    ).textContent =
        pending;


    document.getElementById(
        "approvedCount"
    ).textContent =
        approved;


    document.getElementById(
        "rejectedCount"
    ).textContent =
        rejected;

}


/* =========================================================
   FILTER
========================================================= */

function setFilter(
    filter,
    button
){

    currentFilter =
        filter;


    document
        .querySelectorAll(".filter-btn")
        .forEach(btn => {

            btn.classList.remove(
                "active"
            );

        });


    button.classList.add(
        "active"
    );


    renderApplications();

}


/* =========================================================
   RENDER
========================================================= */

function renderApplications(){

    const list =
        document.getElementById(
            "applicationList"
        );


    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    let filtered =
        applications.filter(
            app => {

                const status =
                    String(
                        app.status || ""
                    ).toLowerCase();


                const type =
                    String(
                        app.type || ""
                    ).toLowerCase();


                let filterMatch =
                    true;


                if(
                    [
                        "pending",
                        "approved",
                        "rejected"
                    ].includes(
                        currentFilter
                    )
                ){

                    filterMatch =
                        status ===
                        currentFilter;

                }


                if(
                    currentFilter ===
                    "restaurant"
                ){

                    filterMatch =
                        type ===
                            "restaurant" ||
                        type ===
                            "restaurant_owner";

                }


                if(
                    currentFilter ===
                    "delivery_boy"
                ){

                    filterMatch =
                        type ===
                            "delivery_boy" ||
                        type ===
                            "delivery";

                }


                const searchable =
                    [

                        app.full_name,

                        app.email,

                        app.phone,

                        app.business_name,

                        app.type,

                        app.address

                    ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();


                const searchMatch =
                    !search ||
                    searchable.includes(
                        search
                    );


                return (
                    filterMatch &&
                    searchMatch
                );

            }
        );


    if(!filtered.length){

        list.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📭
                </div>

                <strong>
                    No applications found
                </strong>

                <p style="margin-top:6px;">
                    There are no applications matching the selected filter.
                </p>

            </div>

        `;

        return;

    }


    list.innerHTML =
        filtered
            .map(
                app =>
                    createApplicationCard(
                        app
                    )
            )
            .join("");

}


/* =========================================================
   APPLICATION CARD
========================================================= */

function createApplicationCard(
    app
){

    const type =
        String(
            app.type || ""
        ).toLowerCase();


    const isRestaurant =
        type === "restaurant" ||
        type === "restaurant_owner";


    const status =
        String(
            app.status || "pending"
        ).toLowerCase();


    const name =
        app.full_name ||
        app.owner_name ||
        app.business_name ||
        "Unknown Applicant";


    const business =
        app.business_name ||
        (
            isRestaurant
                ? "Restaurant Partner"
                : "Delivery Partner"
        );


    const icon =
        isRestaurant
            ? "🏪"
            : "🚴";


    const typeClass =
        isRestaurant
            ? "type-restaurant"
            : "type-delivery";


    return `

        <div class="application">

            <div class="application-top">

                <div class="applicant">

                    <div class="applicant-icon">
                        ${icon}
                    </div>

                    <div>

                        <h3>
                            ${escapeHTML(name)}
                        </h3>

                        <p>
                            ${escapeHTML(
                                app.email || "No email"
                            )}
                        </p>

                        <span
                            class="type-badge ${typeClass}">

                            ${
                                isRestaurant
                                    ? "Restaurant"
                                    : "Delivery Partner"
                            }

                        </span>

                    </div>

                </div>


                <span
                    class="status status-${status}">

                    ${capitalize(status)}

                </span>

            </div>


            <div class="details">

                <div class="detail">

                    <label>
                        Phone
                    </label>

                    <strong>
                        ${escapeHTML(
                            app.phone || "-"
                        )}
                    </strong>

                </div>


                <div class="detail">

                    <label>
                        Partner
                    </label>

                    <strong>
                        ${escapeHTML(business)}
                    </strong>

                </div>


                <div class="detail">

                    <label>
                        Applied
                    </label>

                    <strong>
                        ${formatDate(
                            app.created_at
                        )}
                    </strong>

                </div>

            </div>


            <div class="actions">

                <button
                    class="action-btn view-btn"
                    onclick="viewApplication('${escapeJS(app.id)}')">

                    👁 View Details

                </button>


                ${
                    status === "pending"
                    ? `

                        <button
                            class="action-btn approve-btn"
                            onclick="approveApplication('${escapeJS(app.id)}')">

                            ✅ Approve

                        </button>


                        <button
                            class="action-btn reject-btn"
                            onclick="rejectApplication('${escapeJS(app.id)}')">

                            ❌ Reject

                        </button>

                    `
                    : ""
                }

            </div>

        </div>

    `;

}


/* =========================================================
   VIEW APPLICATION
========================================================= */

function viewApplication(id){

    const app =
        applications.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if(!app){

        return;

    }


    selectedApplication =
        app;


    const type =
        String(
            app.type || ""
        ).toLowerCase();


    const isRestaurant =
        type === "restaurant" ||
        type === "restaurant_owner";


    const fields = [

        [
            "Applicant Name",
            app.full_name ||
            app.owner_name ||
            "-"
        ],

        [
            "Email",
            app.email ||
            "-"
        ],

        [
            "Phone",
            app.phone ||
            "-"
        ],

        [
            "Partner Type",
            isRestaurant
                ? "Restaurant"
                : "Delivery Partner"
        ],

        [
            "Restaurant / Business",
            app.business_name ||
            "-"
        ],

        [
            "Address",
            app.address ||
            "-"
        ],

        [
            "Application Status",
            capitalize(
                app.status ||
                "Pending"
            )
        ],

        [
            "Applied On",
            formatDate(
                app.created_at
            )
        ]

    ];


    const content =
        document.getElementById(
            "modalContent"
        );


    content.innerHTML =
        fields
            .map(
                field => `

                    <div class="modal-detail">

                        <label>
                            ${escapeHTML(
                                field[0]
                            )}
                        </label>

                        <strong>
                            ${escapeHTML(
                                field[1]
                            )}
                        </strong>

                    </div>

                `
            )
            .join("");


    const actions =
        document.getElementById(
            "modalActions"
        );


    if(
        String(
            app.status || ""
        ).toLowerCase() ===
        "pending"
    ){

        actions.innerHTML = `

            <button
                class="action-btn approve-btn"
                onclick="approveApplication('${escapeJS(app.id)}')">

                ✅ Approve

            </button>

            <button
                class="action-btn reject-btn"
                onclick="rejectApplication('${escapeJS(app.id)}')">

                ❌ Reject

            </button>

        `;

    }
    else{

        actions.innerHTML = "";

    }


    document
        .getElementById(
            "detailsModal"
        )
        .classList.add(
            "show"
        );

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(){

    document
        .getElementById(
            "detailsModal"
        )
        .classList.remove(
            "show"
        );

}


/* =========================================================
   APPROVE
========================================================= */

async function approveApplication(
    id
){

    const app =
        applications.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if(!app){

        return;

    }


    const confirmApprove =
        confirm(
            "Approve this partner application?"
        );


    if(!confirmApprove){

        return;

    }


    try{

        /* =============================================
           UPDATE APPLICATION
        ============================================= */

        const {
            error:applicationError
        } =
        await supabaseClient
            .from("partner_applications")
            .update({

                status:
                    "approved"

            })
            .eq(
                "id",
                app.id
            );


        if(applicationError){

            throw applicationError;

        }


        /* =============================================
           UPDATE USER ROLE
        ============================================= */

        if(app.user_id){

            const {
                error:roleError
            } =
            await supabaseClient
                .from("user_roles")
                .update({

                    approval_status:
                        "approved"

                })
                .eq(
                    "user_id",
                    app.user_id
                );


            if(roleError){

                console.error(
                    "Role update error:",
                    roleError
                );

            }

        }


        showMessage(
            "Application approved successfully.",
            "success"
        );


        closeModal();

        await loadApplications();

    }
    catch(error){

        console.error(
            "Approve error:",
            error
        );

        showMessage(
            "Unable to approve application: " +
            error.message,
            "error"
        );

    }

}

/* =========================================================
   DATE
========================================================= */

function formatDate(
    value
){

    if(!value){

        return "-";

    }


    const date =
        new Date(value);


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "-";

    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );

}


/* =========================================================
   CAPITALIZE
========================================================= */

function capitalize(
    value
){

    const text =
        String(
            value || ""
        );


    return (
        text.charAt(0).toUpperCase() +
        text.slice(1)
    );

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   JS ESCAPE
========================================================= */

function escapeJS(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    );

}
