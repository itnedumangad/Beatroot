<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Restaurant Menu - Beatroot</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Inter,Arial,Helvetica,sans-serif;
    background:#f7f8fc;
    color:#171717;
}


/* =========================
   REMOVE UNDERLINES
========================= */

a,
a:link,
a:visited,
a:hover,
a:active,
a:focus{
    text-decoration:none !important;
}


/* =========================
   HEADER
========================= */

.header{
    height:72px;

    background:rgba(255,255,255,.96);

    backdrop-filter:blur(14px);

    border-bottom:1px solid #e8e8e8;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 6%;

    position:sticky;
    top:0;

    z-index:1000;
}

.logo{
    font-size:29px;
    font-weight:900;
    letter-spacing:-1.5px;
    color:#ef3f3f;
}

.logo span{
    color:#171717;
}


/* =========================
   NAV
========================= */

.nav{
    display:flex;
    align-items:center;
    gap:8px;
}

.nav-link{
    color:#333;

    font-size:14px;
    font-weight:700;

    padding:10px 13px;

    border-radius:10px;

    transition:.2s ease;
}

.nav-link:hover{
    background:#f3f4f6;
    color:#ef3f3f;
}


/* =========================
   ANIMATED CART
========================= */

.cart-link{

    position:relative;

    display:flex;
    align-items:center;

    gap:8px;

    background:#ef3f3f;

    color:#fff !important;

    padding:10px 15px;

    border-radius:11px;

    font-size:14px;
    font-weight:800;

    box-shadow:
        0 5px 15px rgba(239,62,62,.20);

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

.cart-link:hover{

    background:#d93232;

    transform:translateY(-2px);

    box-shadow:
        0 8px 22px rgba(239,62,62,.30);
}


/* CART ICON */

.cart-icon{

    display:inline-flex;

    font-size:19px;

    transform-origin:center;
}

.cart-link:hover .cart-icon{

    animation:cartBounce .55s ease;
}


@keyframes cartBounce{

    0%{
        transform:translateY(0) rotate(0deg);
    }

    25%{
        transform:translateY(-4px) rotate(-8deg);
    }

    50%{
        transform:translateY(0) rotate(8deg);
    }

    75%{
        transform:translateY(-2px) rotate(-4deg);
    }

    100%{
        transform:translateY(0) rotate(0deg);
    }

}


/* CART BADGE */

.cart-badge{

    min-width:21px;
    height:21px;

    padding:0 5px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#fff;

    color:#ef3f3f;

    border-radius:50px;

    font-size:11px;
    font-weight:900;

    box-shadow:
        0 2px 8px rgba(0,0,0,.15);
}

.cart-badge.pop{

    animation:cartCountPop .35s ease;
}


@keyframes cartCountPop{

    0%{
        transform:scale(.7);
    }

    50%{
        transform:scale(1.3);
    }

    100%{
        transform:scale(1);
    }

}


/* =========================
   RESTAURANT HERO
========================= */

.restaurant-hero{

    background:
        radial-gradient(
            circle at 85% 20%,
            rgba(239,62,62,.22),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #171717,
            #252525
        );

    color:white;
}

.restaurant-hero-inner{

    max-width:1200px;

    margin:auto;

    padding:40px 22px;
}


/* BACK */

.back-link{

    display:inline-flex;

    align-items:center;

    gap:7px;

    color:#d1d5db;

    font-size:14px;

    font-weight:700;

    margin-bottom:25px;
}

.back-link:hover{

    color:white;
}


/* RESTAURANT MAIN */

.restaurant-main{

    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:30px;
}

.restaurant-title{

    font-size:42px;

    line-height:1.1;

    letter-spacing:-1.5px;

    margin-bottom:10px;
}

.restaurant-description{

    color:#d1d5db;

    font-size:15px;

    line-height:1.6;

    max-width:650px;
}

.restaurant-meta{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

    margin-top:18px;
}

.meta-badge{

    background:rgba(255,255,255,.10);

    border:1px solid rgba(255,255,255,.12);

    padding:7px 11px;

    border-radius:20px;

    font-size:12px;
}

.rating{

    background:#16803c;

    border:none;

    color:white;
}


/* =========================
   SEARCH
========================= */

.search-area{

    max-width:1200px;

    margin:auto;

    padding:28px 22px 15px;
}

.search-box{

    height:52px;

    background:white;

    border:1px solid #e5e7eb;

    border-radius:14px;

    display:flex;

    align-items:center;

    padding:0 16px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.03);
}

.search-icon{

    font-size:19px;

    margin-right:10px;
}

.search-box input{

    width:100%;

    height:100%;

    border:0;

    outline:none;

    background:transparent;

    font-size:15px;
}


/* =========================
   CATEGORIES
========================= */

.category-area{

    max-width:1200px;

    margin:auto;

    padding:0 22px 20px;
}

.categories{

    display:flex;

    gap:9px;

    overflow-x:auto;

    padding:5px 0 8px;
}

.categories::-webkit-scrollbar{

    height:3px;
}

.category-btn{

    flex-shrink:0;

    border:1px solid #e5e7eb;

    background:white;

    color:#555;

    border-radius:25px;

    padding:9px 17px;

    cursor:pointer;

    font-size:13px;

    font-weight:700;

    transition:.2s ease;
}

.category-btn:hover{

    border-color:#ef3f3f;

    color:#ef3f3f;
}

.category-btn.active{

    background:#ef3f3f;

    color:white;

    border-color:#ef3f3f;
}


/* =========================
   MENU
========================= */

.menu-section{

    max-width:1200px;

    margin:auto;

    padding:0 22px 65px;
}

.section-head{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:18px;
}

.section-head h2{

    font-size:24px;

    letter-spacing:-.5px;
}

.item-count{

    color:#777;

    font-size:13px;
}


/* =========================
   MENU GRID
========================= */

.menu-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:20px;
}


/* =========================
   FOOD CARD
========================= */

.food-card{

    background:white;

    border:1px solid #e7e7e7;

    border-radius:20px;

    overflow:hidden;

    transition:.25s ease;
}

.food-card:hover{

    transform:translateY(-4px);

    box-shadow:
        0 15px 35px rgba(0,0,0,.08);
}


/* FOOD IMAGE */

.food-image{

    width:100%;

    height:190px;

    object-fit:cover;

    display:block;

    background:#f0f0f0;
}

.image-placeholder{

    width:100%;

    height:190px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #fff0f0,
            #f8f8f8
        );

    font-size:52px;
}


/* FOOD CONTENT */

.food-content{

    padding:17px;
}

.food-top{

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:12px;
}

.food-name{

    font-size:17px;

    font-weight:800;
}

.food-price{

    color:#ef3f3f;

    font-size:17px;

    font-weight:900;

    white-space:nowrap;
}

.food-description{

    color:#777;

    font-size:13px;

    line-height:1.5;

    margin:8px 0 15px;

    min-height:39px;
}


/* =========================
   ADD BUTTON
========================= */

.add-btn{

    width:100%;

    border:0;

    background:#ef3f3f;

    color:white;

    padding:12px;

    border-radius:10px;

    cursor:pointer;

    font-size:14px;

    font-weight:800;

    transition:.2s ease;
}

.add-btn:hover{

    background:#d93232;

    transform:translateY(-1px);
}

.add-btn:disabled{

    opacity:.6;

    cursor:not-allowed;

    transform:none;
}


/* =========================
   QUANTITY
========================= */

.quantity-control{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:16px;

    border:1px solid #eeeeee;

    border-radius:10px;

    padding:5px;
}

.qty-btn{

    width:34px;

    height:34px;

    border:0;

    border-radius:8px;

    background:#f1f2f5;

    cursor:pointer;

    font-size:19px;

    font-weight:800;

    transition:.2s ease;
}

.qty-btn:hover{

    background:#e5e7eb;

    transform:scale(1.04);
}

.qty-number{

    min-width:25px;

    text-align:center;

    font-weight:800;
}


/* =========================
   LOADING
========================= */

.loading{

    grid-column:1/-1;

    background:white;

    border:1px solid #eee;

    border-radius:18px;

    padding:60px 20px;

    text-align:center;

    color:#777;
}

.spinner{

    width:36px;

    height:36px;

    margin:0 auto 15px;

    border:4px solid #eee;

    border-top-color:#ef3f3f;

    border-radius:50%;

    animation:spin .8s linear infinite;
}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================
   EMPTY
========================= */

.empty{

    grid-column:1/-1;

    background:white;

    border:1px solid #eee;

    border-radius:18px;

    padding:60px 20px;

    text-align:center;
}

.empty-icon{

    font-size:52px;

    margin-bottom:12px;
}

.empty h3{

    margin-bottom:7px;
}

.empty p{

    color:#777;

    font-size:14px;
}


/* =========================
   ERROR
========================= */

.error-box{

    display:none;

    background:#fff0f0;

    color:#c62828;

    border:1px solid #ffd0d0;

    border-radius:12px;

    padding:14px;

    margin-bottom:20px;

    font-size:14px;
}


/* =========================
   TOAST
========================= */

.toast{

    position:fixed;

    right:25px;

    bottom:25px;

    background:#111827;

    color:white;

    padding:14px 19px;

    border-radius:11px;

    display:none;

    z-index:3000;

    box-shadow:
        0 10px 30px rgba(0,0,0,.20);

    font-size:14px;

    font-weight:600;
}


/* =========================
   FOOTER
========================= */

.footer{

    background:#111827;

    color:white;

    padding:35px 22px;
}

.footer-inner{

    max-width:1200px;

    margin:auto;

    text-align:center;
}

.footer-logo{

    font-size:25px;

    font-weight:900;

    margin-bottom:8px;
}

.footer-logo span{

    color:#ef3f3f;
}

.footer p{

    color:#9ca3af;

    font-size:13px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    .menu-grid{

        grid-template-columns:
            repeat(2,1fr);
    }

    .restaurant-title{

        font-size:35px;
    }

}


@media(max-width:600px){

    .header{

        height:64px;

        padding:0 15px;
    }

    .logo{

        font-size:25px;
    }

    .nav-link{

        display:none;
    }

    .cart-link{

        padding:9px 12px;
    }

    .cart-text{

        display:none;
    }

    .restaurant-hero-inner{

        padding:28px 15px;
    }

    .restaurant-main{

        display:block;
    }

    .restaurant-title{

        font-size:30px;
    }

    .restaurant-description{

        font-size:14px;
    }

    .search-area,
    .category-area,
    .menu-section{

        padding-left:15px;

        padding-right:15px;
    }

    .menu-grid{

        grid-template-columns:1fr;

        gap:15px;
    }

    .food-image,
    .image-placeholder{

        height:205px;
    }

    .toast{

        right:15px;

        left:15px;

        bottom:15px;

        text-align:center;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <a
        href="../index.html"
        class="logo">

        Beat<span>root</span>

    </a>


    <nav class="nav">

        <a
            href="restaurants.html"
            class="nav-link">

            Restaurants

        </a>


        <a
            href="my-orders.html"
            class="nav-link">

            Orders

        </a>


        <a
            href="profile.html"
            class="nav-link">

            Profile

        </a>


        <!-- ANIMATED CART -->

        <a
            href="cart.html"
            class="cart-link">

            <span class="cart-icon">
                🛒
            </span>

            <span class="cart-text">
                Cart
            </span>

            <span
                class="cart-badge"
                id="cartCount">

                0

            </span>

        </a>

    </nav>

</header>



<!-- =========================
     RESTAURANT HERO
========================= -->

<section class="restaurant-hero">

    <div class="restaurant-hero-inner">

        <a
            href="restaurants.html"
            class="back-link">

            ← Back to Restaurants

        </a>


        <div class="restaurant-main">

            <div>

                <h1
                    class="restaurant-title"
                    id="restaurantName">

                    Loading...

                </h1>


                <p
                    class="restaurant-description"
                    id="restaurantDescription">

                    Loading restaurant details...

                </p>


                <div class="restaurant-meta">

                    <span
                        class="meta-badge"
                        id="restaurantCategory">

                        🍴 Restaurant

                    </span>


                    <span
                        class="meta-badge rating"
                        id="restaurantRating">

                        ★ --

                    </span>

                </div>

            </div>

        </div>

    </div>

</section>



<!-- =========================
     SEARCH
========================= -->

<section class="search-area">

    <div class="search-box">

        <span class="search-icon">
            🔍
        </span>


        <input
            type="text"
            id="menuSearch"
            placeholder="Search food..."
            autocomplete="off">

    </div>

</section>



<!-- =========================
     CATEGORIES
========================= -->

<section class="category-area">

    <div
        class="categories"
        id="categories">

        <button
            class="category-btn active"
            data-category="all">

            All

        </button>

    </div>

</section>



<!-- =========================
     MENU
========================= -->

<main class="menu-section">

    <div class="section-head">

        <h2>
            Popular Menu
        </h2>


        <span
            class="item-count"
            id="itemCount">

            Loading...

        </span>

    </div>


    <div
        class="error-box"
        id="errorBox">
    </div>


    <div
        class="menu-grid"
        id="menuGrid">

        <div class="loading">

            <div class="spinner"></div>

            Loading menu...

        </div>

    </div>

</main>



<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

    <div class="footer-inner">

        <div class="footer-logo">

            Beat<span>root</span>

        </div>


        <p>
            Delicious food. Easy ordering.
        </p>

    </div>

</footer>



<!-- TOAST -->

<div
    class="toast"
    id="toast">
</div>



<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://jhihjnsxazmftdqlitgk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_r_zMn0-GhFNtuvs5-UOo9w_D8SW8J57";


const sb =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   VARIABLES
========================================= */

let restaurantId = null;

let restaurant = null;

let menuItems = [];

let selectedCategory = "all";

let currentUser = null;


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHTML(value){

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================
   TOAST
========================================= */

function showToast(message){

    const toast =
        document.getElementById("toast");


    toast.textContent =
        message;


    toast.style.display =
        "block";


    setTimeout(() => {

        toast.style.display =
            "none";

    },2200);

}


/* =========================================
   GET RESTAURANT ID
========================================= */

function getRestaurantId(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    return params.get("id");

}


/* =========================================
   GET CURRENT USER
========================================= */

async function getCurrentUser(){

    const {
        data,
        error
    } = await sb.auth.getUser();


    if(error){

        console.error(error);

        return null;

    }


    currentUser =
        data?.user || null;


    return currentUser;

}


/* =========================================
   LOAD RESTAURANT
========================================= */

async function loadRestaurant(){

    const {
        data,
        error
    } = await sb

        .from("restaurants")

        .select("*")

        .eq(
            "id",
            restaurantId
        )

        .single();


    if(error){

        console.error(error);

        showPageError(
            "Restaurant load cheyyan kazhinjilla."
        );

        return false;

    }


    restaurant =
        data;


    document.getElementById(
        "restaurantName"
    ).textContent =
        restaurant.name ||
        "Restaurant";


    document.getElementById(
        "restaurantDescription"
    ).textContent =
        restaurant.description ||
        "Delicious food and great service.";


    document.getElementById(
        "restaurantCategory"
    ).textContent =
        "🍴 " +
        (
            restaurant.category ||
            restaurant.cuisine ||
            "Restaurant"
        );


    if(
        restaurant.rating !== null &&
        restaurant.rating !== undefined
    ){

        document.getElementById(
            "restaurantRating"
        ).textContent =
            "★ " +
            restaurant.rating;

    }
    else{

        document.getElementById(
            "restaurantRating"
        ).textContent =
            "★ --";

    }


    return true;

}


/* =========================================
   LOAD MENU
========================================= */

async function loadMenu(){

    const grid =
        document.getElementById(
            "menuGrid"
        );


    grid.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            Loading menu...

        </div>

    `;


    const {
        data,
        error
    } = await sb

        .from("menu_items")

        .select("*")

        .eq(
            "restaurant_id",
            restaurantId
        )

        .order(
            "id",
            {
                ascending:true
            }
        );


    if(error){

        console.error(error);


        showPageError(
            "Menu load cheyyan kazhinjilla."
        );


        return;

    }


    menuItems =
        data || [];


    createCategories();

    renderMenu();

}


/* =========================================
   CREATE CATEGORIES
========================================= */

function createCategories(){

    const container =
        document.getElementById(
            "categories"
        );


    const categories = [];


    menuItems.forEach(item => {

        const category =
            item.category ||
            item.type ||
            item.menu_category ||
            "";


        if(
            category &&
            !categories.includes(
                category
            )
        ){

            categories.push(
                category
            );

        }

    });


    container.innerHTML = `

        <button
            class="category-btn active"
            data-category="all">

            All

        </button>

    `;


    categories.forEach(
        category => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "category-btn";


            button.dataset.category =
                category;


            button.textContent =
                category;


            container.appendChild(
                button
            );

        }
    );


    container
        .querySelectorAll(
            ".category-btn"
        )
        .forEach(button => {

            button.addEventListener(
                "click",
                function(){

                    container
                        .querySelectorAll(
                            ".category-btn"
                        )
                        .forEach(btn =>
                            btn.classList.remove(
                                "active"
                            )
                        );


                    this.classList.add(
                        "active"
                    );


                    selectedCategory =
                        this.dataset.category;


                    renderMenu();

                }
            );

        });

}


/* =========================================
   RENDER MENU
========================================= */

function renderMenu(){

    const grid =
        document.getElementById(
            "menuGrid"
        );


    const count =
        document.getElementById(
            "itemCount"
        );


    const search =
        document.getElementById(
            "menuSearch"
        )
        .value
        .toLowerCase()
        .trim();


    const filtered =
        menuItems.filter(item => {

            const name =
                String(
                    item.name || ""
                )
                .toLowerCase();


            const description =
                String(
                    item.description || ""
                )
                .toLowerCase();


            const category =
                String(
                    item.category ||
                    item.type ||
                    item.menu_category ||
                    ""
                );


            const matchesSearch =
                !search ||
                name.includes(search) ||
                description.includes(search) ||
                category
                    .toLowerCase()
                    .includes(search);


            const matchesCategory =
                selectedCategory === "all" ||
                category === selectedCategory;


            return (
                matchesSearch &&
                matchesCategory
            );

        });


    count.textContent =
        filtered.length +
        (
            filtered.length === 1
                ? " item"
                : " items"
        );


    if(!filtered.length){

        grid.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🍽️
                </div>

                <h3>
                    No food items found
                </h3>

                <p>
                    Try another search or category.
                </p>

            </div>

        `;

        return;

    }


    grid.innerHTML =
        filtered
            .map(
                createFoodCard
            )
            .join("");


    restoreQuantities();

}


/* =========================================
   CREATE FOOD CARD
========================================= */

function createFoodCard(item){

    const image =
        item.image_url || "";


    let imageHTML;


    if(image){

        imageHTML = `

            <img
                class="food-image"
                src="${escapeHTML(image)}"
                alt="${escapeHTML(item.name)}"
                loading="lazy"
                onerror="
                    this.style.display='none';
                    this.nextElementSibling.style.display='flex';
                "
            >


            <div
                class="image-placeholder"
                style="display:none;">

                🍽️

            </div>

        `;

    }
    else{

        imageHTML = `

            <div class="image-placeholder">

                🍽️

            </div>

        `;

    }


    return `

        <div
            class="food-card"
            data-id="${item.id}">


            ${imageHTML}


            <div class="food-content">


                <div class="food-top">

                    <span class="food-name">

                        ${escapeHTML(
                            item.name
                        )}

                    </span>


                    <span class="food-price">

                        ₹${Number(
                            item.price || 0
                        ).toFixed(2)}

                    </span>

                </div>


                <p class="food-description">

                    ${escapeHTML(
                        item.description ||
                        "Delicious food."
                    )}

                </p>


                <div
                    id="controls-${item.id}">

                    <button
                        class="add-btn"
                        onclick="
                            addToCart(
                                ${item.id}
                            )
                        ">

                        Add to Cart

                    </button>

                </div>


            </div>

        </div>

    `;

}

/* =========================================
   ADD TO CART
========================================= */

async function addToCart(
    menuItemId
){

    const user =
        await getCurrentUser();


    if(!user){

        showToast(
            "Please login to add items."
        );


        setTimeout(() => {

            window.location.href =
                "login.html";

        },800);


        return;

    }


    const item =
        menuItems.find(
            x =>
                Number(x.id) ===
                Number(menuItemId)
        );


    if(!item){

        showToast(
            "Food item not found."
        );

        return;

    }


    const controls =
        document.getElementById(
            "controls-" +
            menuItemId
        );


    if(controls){

        controls.innerHTML = `

            <button
                class="add-btn"
                disabled>

                Adding...

            </button>

        `;

    }


    try{

        const {
            data:existing,
            error:findError
        } = await sb

            .from("cart_items")

            .select(
                "id,quantity"
            )

            .eq(
                "customer_id",
                user.id
            )

            .eq(
                "menu_item_id",
                menuItemId
            )

            .maybeSingle();


        if(findError){

            throw findError;

        }


        if(existing){

            const {
                error:updateError
            } = await sb

                .from("cart_items")

                .update({

                    quantity:
                        Number(
                            existing.quantity || 0
                        ) + 1

                })

                .eq(
                    "id",
                    existing.id
                );


            if(updateError){

                throw updateError;

            }

        }
        else{

            const {
                error:insertError
            } = await sb

                .from("cart_items")

                .insert({

                    customer_id:
                        user.id,

                    menu_item_id:
                        menuItemId,

                    quantity:1

                });


            if(insertError){

                throw insertError;

            }

        }


        showToast(
            item.name +
            " added to cart ✓"
        );


        await updateCartCount();

        await restoreQuantity(
            menuItemId
        );

    }
    catch(error){

        console.error(
            "Add to cart error:",
            error
        );


        showToast(
            "Cart update failed."
        );


        await restoreQuantity(
            menuItemId
        );

    }

}


/* =========================================
   CHANGE QUANTITY
========================================= */

async function changeQuantity(
    menuItemId,
    change
){

    const user =
        await getCurrentUser();


    if(!user){

        return;

    }


    const {
        data:item,
        error
    } = await sb

        .from("cart_items")

        .select(
            "id,quantity"
        )

        .eq(
            "customer_id",
            user.id
        )

        .eq(
            "menu_item_id",
            menuItemId
        )

        .maybeSingle();


    if(error){

        console.error(error);

        return;

    }


    if(!item){

        return;

    }


    const newQuantity =
        Number(
            item.quantity || 0
        ) +
        Number(change);


    if(newQuantity <= 0){

        const {
            error:deleteError
        } = await sb

            .from("cart_items")

            .delete()

            .eq(
                "id",
                item.id
            );


        if(deleteError){

            console.error(
                deleteError
            );

            return;

        }

    }
    else{

        const {
            error:updateError
        } = await sb

            .from("cart_items")

            .update({

                quantity:
                    newQuantity

            })

            .eq(
                "id",
                item.id
            );


        if(updateError){

            console.error(
                updateError
            );

            return;

        }

    }


    await restoreQuantity(
        menuItemId
    );


    await updateCartCount();

}


/* =========================================
   RESTORE QUANTITY
========================================= */

async function restoreQuantity(
    menuItemId
){

    const controls =
        document.getElementById(
            "controls-" +
            menuItemId
        );


    if(!controls){

        return;

    }


    const user =
        await getCurrentUser();


    if(!user){

        controls.innerHTML = `

            <button
                class="add-btn"
                onclick="
                    addToCart(
                        ${menuItemId}
                    )
                ">

                Add to Cart

            </button>

        `;

        return;

    }


    const {
        data:item,
        error
    } = await sb

        .from("cart_items")

        .select(
            "quantity"
        )

        .eq(
            "customer_id",
            user.id
        )

        .eq(
            "menu_item_id",
            menuItemId
        )

        .maybeSingle();


    if(error){

        console.error(error);

        return;

    }


    const quantity =
        Number(
            item?.quantity || 0
        );


    if(quantity <= 0){

        controls.innerHTML = `

            <button
                class="add-btn"
                onclick="
                    addToCart(
                        ${menuItemId}
                    )
                ">

                Add to Cart

            </button>

        `;

        return;

    }


    controls.innerHTML = `

        <div class="quantity-control">


            <button
                class="qty-btn"
                onclick="
                    changeQuantity(
                        ${menuItemId},
                        -1
                    )
                ">

                −

            </button>


            <span class="qty-number">

                ${quantity}

            </span>


            <button
                class="qty-btn"
                onclick="
                    changeQuantity(
                        ${menuItemId},
                        1
                    )
                ">

                +

            </button>


        </div>

    `;

}


/* =========================================
   RESTORE ALL QUANTITIES
========================================= */

async function restoreQuantities(){

    for(
        const item
        of menuItems
    ){

        await restoreQuantity(
            item.id
        );

    }

}


/* =========================================
   CART COUNT
========================================= */

async function updateCartCount(){

    const user =
        await getCurrentUser();


    const badge =
        document.getElementById(
            "cartCount"
        );


    if(!user){

        badge.textContent =
            "0";

        return;

    }


    const {
        data,
        error
    } = await sb

        .from("cart_items")

        .select(
            "quantity"
        )

        .eq(
            "customer_id",
            user.id
        );


    if(error){

        console.error(error);

        badge.textContent =
            "0";

        return;

    }


    const total =
        (data || [])
        .reduce(
            (sum,item) =>
                sum +
                Number(
                    item.quantity || 0
                ),
            0
        );


    const oldCount =
        Number(
            badge.textContent || 0
        );


    badge.textContent =
        total;


    if(
        total !==
        oldCount
    ){

        badge.classList.remove(
            "pop"
        );


        void badge.offsetWidth;


        badge.classList.add(
            "pop"
        );

    }

}

){

    document.getElementById(

            </div>

            <h3>
                Something went wrong
            </h3>

            <p>
                ${escapeHTML(message)}
            </p>

        </div>

    `;

}
