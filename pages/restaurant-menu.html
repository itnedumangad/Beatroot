<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beatroot - Menu Management</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#111827;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.dashboard{
    min-height:100vh;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;

    width:250px;

    background:#111827;
    color:white;

    padding:25px 15px;

    z-index:100;

    transition:.25s;
}

.brand{
    font-size:28px;
    font-weight:800;

    padding:0 15px 30px;
}

.brand span{
    color:#ef4444;
}

.restaurant-label{
    color:#9ca3af;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;

    padding:0 15px;
    margin-bottom:10px;
}

.menu{
    list-style:none;
}

.menu li{
    margin:5px 0;
}

.menu button{
    width:100%;

    border:0;
    background:transparent;

    color:#d1d5db;

    padding:13px 15px;

    border-radius:10px;

    text-align:left;

    font-size:14px;
}

.menu button:hover,
.menu button.active{
    background:#ef4444;
    color:white;
}

.menu-icon{
    width:27px;
    display:inline-block;
}

.sidebar-bottom{
    position:absolute;

    left:15px;
    right:15px;
    bottom:20px;
}

.logout{
    width:100%;

    border:1px solid #374151;

    background:transparent;

    color:#d1d5db;

    padding:12px;

    border-radius:10px;
}

.logout:hover{
    background:#1f2937;
    color:white;
}

/* =========================================================
   MAIN
========================================================= */

.main{
    margin-left:250px;
    min-height:100vh;
}

/* =========================================================
   TOPBAR
========================================================= */

.topbar{
    height:75px;

    background:white;

    border-bottom:1px solid #e5e7eb;

    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:0 30px;

    position:sticky;
    top:0;

    z-index:50;
}

.mobile-menu{
    display:none;

    border:0;

    background:#f3f4f6;

    padding:10px;

    border-radius:8px;

    font-size:18px;
}

.top-title{
    font-size:22px;
    font-weight:800;
}

.profile{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:40px;
    height:40px;

    border-radius:50%;

    background:#ef4444;

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:800;
}

.profile-text strong{
    display:block;
    font-size:13px;
}

.profile-text small{
    color:#888;
}

/* =========================================================
   CONTENT
========================================================= */

.content{
    padding:30px;
}

.page-header{
    display:flex;

    justify-content:space-between;
    align-items:center;

    margin-bottom:25px;
}

.page-header h1{
    font-size:28px;
    margin-bottom:6px;
}

.page-header p{
    color:#6b7280;
    font-size:14px;
}

.add-btn{
    border:0;

    background:#ef4444;

    color:white;

    padding:13px 18px;

    border-radius:10px;

    font-size:13px;

    font-weight:800;
}

.add-btn:hover{
    background:#dc2626;
}

/* =========================================================
   RESTAURANT INFO
========================================================= */

.restaurant-info{
    background:white;

    border:1px solid #e5e7eb;

    border-radius:15px;

    padding:18px 20px;

    margin-bottom:20px;

    display:flex;

    justify-content:space-between;
    align-items:center;
}

.restaurant-name{
    font-size:18px;
    font-weight:800;
}

.restaurant-address{
    color:#6b7280;
    font-size:12px;
    margin-top:5px;
}

.status-badge{
    padding:7px 12px;

    border-radius:20px;

    font-size:11px;

    font-weight:800;

    background:#dcfce7;
    color:#15803d;
}

/* =========================================================
   MESSAGE
========================================================= */

.message{
    display:none;

    padding:13px 15px;

    border-radius:10px;

    margin-bottom:20px;

    font-size:13px;
}

.message.success{
    display:block;

    background:#dcfce7;
    border:1px solid #bbf7d0;

    color:#15803d;
}

.message.error{
    display:block;

    background:#fee2e2;
    border:1px solid #fecaca;

    color:#b91c1c;
}

/* =========================================================
   FILTER BAR
========================================================= */

.filter-bar{
    background:white;

    border:1px solid #e5e7eb;

    border-radius:15px;

    padding:18px;

    margin-bottom:20px;

    display:grid;

    grid-template-columns:2fr 1fr 1fr;

    gap:12px;
}

.search-box input,
.filter-box select{

    width:100%;

    height:45px;

    border:1px solid #e5e7eb;

    border-radius:9px;

    padding:0 13px;

    outline:none;

    background:#fafafa;

    font-size:13px;
}

.search-box input:focus,
.filter-box select:focus{

    border-color:#ef4444;

    background:white;

    box-shadow:0 0 0 4px rgba(239,68,68,.07);
}

/* =========================================================
   MENU GRID
========================================================= */

.menu-grid{

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:18px;
}

.food-card{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:16px;

    overflow:hidden;

    transition:.2s;
}

.food-card:hover{

    transform:translateY(-2px);

    box-shadow:
        0 12px 30px rgba(0,0,0,.08);
}

.food-image{

    height:170px;

    background:#f3f4f6;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    position:relative;
}

.food-image img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.no-image{

    font-size:48px;
}

.availability-badge{

    position:absolute;

    top:12px;
    right:12px;

    padding:6px 9px;

    border-radius:20px;

    font-size:10px;

    font-weight:800;
}

.available{

    background:#dcfce7;
    color:#15803d;
}

.unavailable{

    background:#fee2e2;
    color:#b91c1c;
}

.food-content{

    padding:17px;
}

.food-top{

    display:flex;

    justify-content:space-between;

    gap:10px;

    margin-bottom:7px;
}

.food-name{

    font-size:16px;

    font-weight:800;
}

.food-price{

    color:#ef4444;

    font-size:16px;

    font-weight:800;

    white-space:nowrap;
}

.food-category{

    display:inline-block;

    background:#fff1f2;

    color:#e53935;

    padding:5px 8px;

    border-radius:7px;

    font-size:10px;

    font-weight:800;

    margin-bottom:10px;
}

.food-description{

    color:#6b7280;

    font-size:12px;

    line-height:1.5;

    min-height:36px;

    margin-bottom:15px;
}

.food-actions{

    display:grid;

    grid-template-columns:1fr 1fr 1fr;

    gap:7px;
}

.action-btn{

    border:1px solid #e5e7eb;

    background:#fafafa;

    padding:9px 5px;

    border-radius:8px;

    font-size:11px;

    font-weight:700;
}

.action-btn:hover{

    background:#f3f4f6;
}

.edit-btn:hover{

    color:#2563eb;

    border-color:#bfdbfe;

    background:#eff6ff;
}

.delete-btn:hover{

    color:#dc2626;

    border-color:#fecaca;

    background:#fef2f2;
}

.toggle-btn:hover{

    color:#15803d;

    border-color:#bbf7d0;

    background:#f0fdf4;
}

/* =========================================================
   EMPTY / LOADING
========================================================= */

.empty{

    grid-column:1/-1;

    background:white;

    border:1px solid #e5e7eb;

    border-radius:15px;

    padding:60px 20px;

    text-align:center;

    color:#6b7280;
}

.empty-icon{

    font-size:50px;

    margin-bottom:15px;
}

.empty h3{

    color:#111827;

    margin-bottom:7px;
}

.loading{

    grid-column:1/-1;

    background:white;

    border:1px solid #e5e7eb;

    border-radius:15px;

    padding:50px;

    text-align:center;

    color:#777;
}

/* =========================================================
   MODAL
========================================================= */

.modal-overlay{

    position:fixed;

    inset:0;

    background:rgba(17,24,39,.6);

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    z-index:1000;
}

.modal-overlay.show{

    display:flex;
}

.modal{

    width:100%;

    max-width:550px;

    max-height:90vh;

    overflow-y:auto;

    background:white;

    border-radius:18px;

    padding:25px;
}

.modal-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;
}

.modal-header h2{

    font-size:21px;
}

.close-btn{

    width:35px;
    height:35px;

    border:0;

    background:#f3f4f6;

    border-radius:8px;

    font-size:18px;
}

.close-btn:hover{

    background:#fee2e2;

    color:#dc2626;
}

/* =========================================================
   FORM
========================================================= */

.form-group{

    margin-bottom:15px;
}

.form-group label{

    display:block;

    font-size:12px;

    font-weight:800;

    color:#374151;

    margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{

    width:100%;

    border:1px solid #e5e7eb;

    border-radius:9px;

    padding:11px 12px;

    font-size:13px;

    outline:none;

    background:#fafafa;
}

.form-group input{

    height:45px;
}

.form-group textarea{

    min-height:80px;

    resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{

    border-color:#ef4444;

    background:white;

    box-shadow:
        0 0 0 4px rgba(239,68,68,.07);
}

.form-row{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;
}

.checkbox-row{

    display:flex;

    align-items:center;

    gap:9px;

    margin:5px 0 15px;

    font-size:13px;

    color:#374151;
}

.checkbox-row input{

    width:17px;
    height:17px;

    accent-color:#ef4444;
}

.modal-actions{

    display:flex;

    gap:10px;

    margin-top:20px;
}

.cancel-btn{

    flex:1;

    height:46px;

    border:1px solid #e5e7eb;

    background:white;

    border-radius:9px;

    font-weight:700;
}

.save-btn{

    flex:1;

    height:46px;

    border:0;

    background:#ef4444;

    color:white;

    border-radius:9px;

    font-weight:800;
}

.save-btn:hover{

    background:#dc2626;
}

.save-btn:disabled{

    opacity:.6;

    cursor:not-allowed;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:1050px){

    .menu-grid{

        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

}

@media(max-width:800px){

    .sidebar{

        transform:translateX(-100%);
    }

    .sidebar.open{

        transform:translateX(0);
    }

    .main{

        margin-left:0;
    }

    .mobile-menu{

        display:block;
    }

    .topbar{

        padding:0 15px;
    }

    .content{

        padding:20px 15px;
    }

    .page-header{

        align-items:flex-start;

        gap:15px;
    }

    .page-header h1{

        font-size:23px;
    }

    .restaurant-info{

        align-items:flex-start;

        gap:12px;

        flex-direction:column;
    }

    .filter-bar{

        grid-template-columns:1fr;
    }

}

@media(max-width:600px){

    .menu-grid{

        grid-template-columns:1fr;
    }

    .form-row{

        grid-template-columns:1fr;

        gap:0;
    }

    .profile-text{

        display:none;
    }

    .top-title{

        font-size:17px;
    }

    .page-header{

        flex-direction:column;
    }

    .add-btn{

        width:100%;
    }

}

</style>

</head>

<body>

<div class="dashboard">

<!-- =========================================================
     SIDEBAR
========================================================= -->

<aside class="sidebar" id="sidebar">

    <div class="brand">
        Beat<span>root</span>
    </div>

    <div class="restaurant-label">
        Restaurant Panel
    </div>

    <ul class="menu">

        <li>
            <button onclick="goDashboard()">
                <span class="menu-icon">📊</span>
                Dashboard
            </button>
        </li>

        <li>
            <button class="active">
                <span class="menu-icon">🍔</span>
                Menu Management
            </button>
        </li>

        <li>
            <button onclick="goOrders()">
                <span class="menu-icon">🛒</span>
                Orders
            </button>
        </li>

        <li>
            <button onclick="goRestaurant()">
                <span class="menu-icon">🏪</span>
                Restaurant
            </button>
        </li>

        <li>
            <button onclick="goSettings()">
                <span class="menu-icon">⚙️</span>
                Settings
            </button>
        </li>

    </ul>

    <div class="sidebar-bottom">

        <button class="logout" onclick="logout()">
            🚪 Logout
        </button>

    </div>

</aside>


<!-- =========================================================
     MAIN
========================================================= -->

<div class="main">

    <!-- TOPBAR -->

    <header class="topbar">

        <div style="display:flex;align-items:center;gap:12px;">

            <button
                class="mobile-menu"
                onclick="toggleSidebar()">

                ☰

            </button>

            <div class="top-title">
                Menu Management
            </div>

        </div>


        <div class="profile">

            <div
                class="avatar"
                id="avatar">

                R

            </div>

            <div class="profile-text">

                <strong id="ownerName">
                    Restaurant
                </strong>

                <small>
                    Restaurant Partner
                </small>

            </div>

        </div>

    </header>


    <!-- CONTENT -->

    <main class="content">

        <div class="page-header">

            <div>

                <h1>
                    🍔 Your Menu
                </h1>

                <p>
                    Add and manage your restaurant food items.
                </p>

            </div>

            <button
                class="add-btn"
                onclick="openAddModal()">

                + Add Food Item

            </button>

        </div>


        <!-- RESTAURANT INFO -->

        <div class="restaurant-info">

            <div>

                <div
                    class="restaurant-name"
                    id="restaurantName">

                    Loading restaurant...

                </div>

                <div
                    class="restaurant-address"
                    id="restaurantAddress">

                    Loading...

                </div>

            </div>

            <div class="status-badge">

                ✓ Approved Partner

            </div>

        </div>


        <!-- MESSAGE -->

        <div
            id="messageBox"
            class="message">
        </div>


        <!-- FILTER -->

        <div class="filter-bar">

            <div class="search-box">

                <input
                    type="search"
                    id="searchInput"
                    placeholder="🔍 Search food items..."
                    oninput="filterMenu()">

            </div>

            <div class="filter-box">

                <select
                    id="categoryFilter"
                    onchange="filterMenu()">

                    <option value="">
                        All Categories
                    </option>

                </select>

            </div>

            <div class="filter-box">

                <select
                    id="availabilityFilter"
                    onchange="filterMenu()">

                    <option value="">
                        All Items
                    </option>

                    <option value="available">
                        Available
                    </option>

                    <option value="unavailable">
                        Unavailable
                    </option>

                </select>

            </div>

        </div>


        <!-- MENU -->

        <div
            class="menu-grid"
            id="menuGrid">

            <div class="loading">

                Loading menu...

            </div>

        </div>

    </main>

</div>

</div>


<!-- =========================================================
     ADD / EDIT MODAL
========================================================= -->

<div
    class="modal-overlay"
    id="modalOverlay">

    <div class="modal">

        <div class="modal-header">

            <h2 id="modalTitle">
                Add Food Item
            </h2>

            <button
                class="close-btn"
                onclick="closeModal()">

                ×

            </button>

        </div>


        <form id="foodForm">

            <input
                type="hidden"
                id="editingId">


            <div class="form-group">

                <label>
                    Food Name *
                </label>

                <input
                    type="text"
                    id="foodName"
                    placeholder="Example: Chicken Biriyani"
                    required>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        Category *
                    </label>

                    <input
                        type="text"
                        id="foodCategory"
                        list="categoryList"
                        placeholder="Example: Biriyani"
                        required>

                    <datalist id="categoryList">

                        <option value="Biriyani">
                        <option value="Meals">
                        <option value="Rice">
                        <option value="Burger">
                        <option value="Pizza">
                        <option value="Chicken">
                        <option value="Snacks">
                        <option value="Drinks">
                        <option value="Desserts">

                    </datalist>

                </div>


                <div class="form-group">

                    <label>
                        Price (₹) *
                    </label>

                    <input
                        type="number"
                        id="foodPrice"
                        min="0"
                        step="0.01"
                        placeholder="0.00"
                        required>

                </div>

            </div>


            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    id="foodDescription"
                    placeholder="Describe this food item...">
                </textarea>

            </div>


            <div class="form-group">

                <label>
                    Image URL
                </label>

                <input
                    type="url"
                    id="foodImage"
                    placeholder="https://example.com/food-image.jpg">

            </div>


            <label class="checkbox-row">

                <input
                    type="checkbox"
                    id="foodAvailable"
                    checked>

                <span>
                    Food item is currently available
                </span>

            </label>


            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeModal()">

                    Cancel

                </button>

                <button
                    type="submit"
                    class="save-btn"
                    id="saveBtn">

                    Save Food Item

                </button>

            </div>

        </form>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://jhihjnsxazmftdqlitgk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_r_zMn0-GhFNtuvs5-UOo9w_D8SW8J57";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   VARIABLES
========================================================= */

let currentUser = null;

let currentRestaurantId = null;

let allMenuItems = [];


/* =========================================================
   ELEMENTS
========================================================= */

const menuGrid =
    document.getElementById("menuGrid");

const modalOverlay =
    document.getElementById("modalOverlay");

const foodForm =
    document.getElementById("foodForm");

const saveBtn =
    document.getElementById("saveBtn");

const messageBox =
    document.getElementById("messageBox");


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(message,type="success"){

    messageBox.textContent = message;

    messageBox.className =
        "message " + type;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

    setTimeout(() => {

        messageBox.className =
            "message";

        messageBox.textContent = "";

    },5000);

}


/* =========================================================
   MOBILE SIDEBAR
========================================================= */

function toggleSidebar(){

    document
        .getElementById("sidebar")
        .classList.toggle("open");

}


/* =========================================================
   GET RESTAURANT
========================================================= */

async function loadRestaurant(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("user_roles")
        .select(`
            restaurant_id,
            role,
            approval_status
        `)
        .eq(
            "user_id",
            currentUser.id
        )
        .maybeSingle();


    if(error){

        throw error;

    }


    if(!data){

        throw new Error(
            "Restaurant account information not found."
        );

    }


    const role =
        String(data.role || "")
            .toLowerCase()
            .trim();


    if(
        role !== "restaurant" &&
        role !== "restaurant_owner"
    ){

        throw new Error(
            "This account is not a restaurant account."
        );

    }


    if(
        data.approval_status &&
        data.approval_status !== "approved"
    ){

        throw new Error(
            "Your restaurant account is still pending admin approval."
        );

    }


    if(!data.restaurant_id){

        throw new Error(
            "Restaurant ID is missing."
        );

    }


    currentRestaurantId =
        data.restaurant_id;


    /* LOAD RESTAURANT DETAILS */

    const {
        data:restaurant,
        error:restaurantError
    } =
    await supabaseClient
        .from("restaurants")
        .select(`
            id,
            name,
            address
        `)
        .eq(
            "id",
            currentRestaurantId
        )
        .maybeSingle();


    if(restaurantError){

        throw restaurantError;

    }


    if(restaurant){

        document.getElementById(
            "restaurantName"
        ).textContent =
            restaurant.name || "Restaurant";


        document.getElementById(
            "restaurantAddress"
        ).textContent =
            restaurant.address || "Address not available";


        document.getElementById(
            "ownerName"
        ).textContent =
            restaurant.name || "Restaurant";


        document.getElementById(
            "avatar"
        ).textContent =
            String(
                restaurant.name || "R"
            )
            .charAt(0)
            .toUpperCase();

    }

}


/* =========================================================
   LOAD MENU
========================================================= */

async function loadMenu(){

    menuGrid.innerHTML = `

        <div class="loading">

            Loading menu...

        </div>

    `;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("menu_items")
        .select(`
            id,
            restaurant_id,
            name,
            description,
            category,
            price,
            is_available,
            image_url,
            created_at,
            updated_at
        `)
        .eq(
            "restaurant_id",
            currentRestaurantId
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Menu loading error:",
            error
        );

        throw error;

    }


    allMenuItems =
        data || [];


    updateCategoryFilter();

    renderMenu(
        allMenuItems
    );

}


/* =========================================================
   CATEGORY FILTER
========================================================= */

function updateCategoryFilter(){

    const select =
        document.getElementById(
            "categoryFilter"
        );


    const categories =
        [
            ...new Set(
                allMenuItems
                    .map(item =>
                        String(
                            item.category || ""
                        ).trim()
                    )
                    .filter(Boolean)
            )
        ]
        .sort();


    select.innerHTML = `

        <option value="">
            All Categories
        </option>

    `;


    categories.forEach(category => {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            category;

        option.textContent =
            category;

        select.appendChild(
            option
        );

    });

}


/* =========================================================
   FILTER MENU
========================================================= */

function filterMenu(){

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    const category =
        document
            .getElementById(
                "categoryFilter"
            )
            .value;


    const availability =
        document
            .getElementById(
                "availabilityFilter"
            )
            .value;


    const filtered =
        allMenuItems.filter(item => {

            const name =
                String(
                    item.name || ""
                ).toLowerCase();


            const description =
                String(
                    item.description || ""
                ).toLowerCase();


            const itemCategory =
                String(
                    item.category || ""
                );


            const matchesSearch =
                !search ||
                name.includes(search) ||
                description.includes(search);


            const matchesCategory =
                !category ||
                itemCategory === category;


            const matchesAvailability =
                !availability ||
                (
                    availability === "available" &&
                    item.is_available === true
                ) ||
                (
                    availability === "unavailable" &&
                    item.is_available === false
                );


            return (
                matchesSearch &&
                matchesCategory &&
                matchesAvailability
            );

        });


    renderMenu(filtered);

}


/* =========================================================
   RENDER MENU
========================================================= */

function renderMenu(items){

    if(!items.length){

        menuGrid.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🍽️
                </div>

                <h3>
                    No food items found
                </h3>

                <p>
                    Add your first food item to start building your menu.
                </p>

            </div>

        `;

        return;

    }


    menuGrid.innerHTML =
        items.map(item => {

            const available =
                item.is_available === true;


            const image =
                item.image_url
                ? `

                    <img
                        src="${escapeHTML(item.image_url)}"
                        alt="${escapeHTML(item.name)}"
                        onerror="this.style.display='none';this.nextElementSibling.style.display='block';">

                    <div
                        class="no-image"
                        style="display:none;">

                        🍔

                    </div>

                  `
                : `

                    <div class="no-image">
                        🍔
                    </div>

                  `;


            return `

                <div class="food-card">

                    <div class="food-image">

                        ${image}

                        <span
                            class="availability-badge
                            ${available ? "available" : "unavailable"}">

                            ${available
                                ? "✓ Available"
                                : "✕ Unavailable"}

                        </span>

                    </div>


                    <div class="food-content">

                        <div class="food-top">

                            <div class="food-name">

                                ${escapeHTML(
                                    item.name
                                )}

                            </div>

                            <div class="food-price">

                                ₹${Number(
                                    item.price || 0
                                ).toLocaleString(
                                    "en-IN",
                                    {
                                        minimumFractionDigits:2
                                    }
                                )}

                            </div>

                        </div>


                        <span class="food-category">

                            ${escapeHTML(
                                item.category ||
                                "Food"
                            )}

                        </span>


                        <div class="food-description">

                            ${escapeHTML(
                                item.description ||
                                "No description added."
                            )}

                        </div>


                        <div class="food-actions">

                            <button
                                class="action-btn edit-btn"
                                onclick="editFood('${item.id}')">

                                ✏️ Edit

                            </button>


                            <button
                                class="action-btn toggle-btn"
                                onclick="toggleAvailability(
                                    '${item.id}',
                                    ${available}
                                )">

                                ${available
                                    ? "🔴 Hide"
                                    : "🟢 Show"}

                            </button>


                            <button
                                class="action-btn delete-btn"
                                onclick="deleteFood('${item.id}')">

                                🗑️ Delete

                            </button>

                        </div>

                    </div>

                </div>

            `;

        })
        .join("");

}


/* =========================================================
   OPEN ADD MODAL
========================================================= */

function openAddModal(){

    document.getElementById(
        "modalTitle"
    ).textContent =
        "Add Food Item";


    document.getElementById(
        "editingId"
    ).value = "";


    foodForm.reset();


    document.getElementById(
        "foodAvailable"
    ).checked = true;


    saveBtn.textContent =
        "Save Food Item";


    modalOverlay.classList.add(
        "show"
    );

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(){

    modalOverlay.classList.remove(
        "show"
    );

}


/* =========================================================
   EDIT FOOD
========================================================= */

function editFood(id){

    const item =
        allMenuItems.find(
            food =>
                String(food.id) ===
                String(id)
        );


    if(!item){

        showMessage(
            "Food item not found.",
            "error"
        );

        return;

    }


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Food Item";


    document.getElementById(
        "editingId"
    ).value =
        item.id;


    document.getElementById(
        "foodName"
    ).value =
        item.name || "";


    document.getElementById(
        "foodCategory"
    ).value =
        item.category || "";


    document.getElementById(
        "foodPrice"
    ).value =
        item.price || "";


    document.getElementById(
        "foodDescription"
    ).value =
        item.description || "";


    document.getElementById(
        "foodImage"
    ).value =
        item.image_url || "";


    document.getElementById(
        "foodAvailable"
    ).checked =
        item.is_available !== false;


    saveBtn.textContent =
        "Update Food Item";


    modalOverlay.classList.add(
        "show"
    );

}


/* =========================================================
   SAVE / UPDATE FOOD
========================================================= */

foodForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const editingId =
            document.getElementById(
                "editingId"
            ).value;


        const name =
            document.getElementById(
                "foodName"
            ).value
            .trim();


        const category =
            document.getElementById(
                "foodCategory"
            ).value
            .trim();


        const price =
            Number(
                document.getElementById(
                    "foodPrice"
                ).value
            );


        const description =
            document.getElementById(
                "foodDescription"
            ).value
            .trim();


        const imageUrl =
            document.getElementById(
                "foodImage"
            ).value
            .trim();


        const isAvailable =
            document.getElementById(
                "foodAvailable"
            ).checked;


        if(name.length < 2){

            alert(
                "Please enter a valid food name."
            );

            return;

        }


        if(!category){

            alert(
                "Please enter a food category."
            );

            return;

        }


        if(
            Number.isNaN(price) ||
            price < 0
        ){

            alert(
                "Please enter a valid price."
            );

            return;

        }


        saveBtn.disabled = true;

        saveBtn.textContent =
            editingId
            ? "Updating..."
            : "Saving...";


        try{

            const itemData = {

                restaurant_id:
                    currentRestaurantId,

                name:
                    name,

                category:
                    category,

                description:
                    description || null,

                price:
                    price,

                image_url:
                    imageUrl || null,

                is_available:
                    isAvailable

            };


            /* UPDATE */

            if(editingId){

                const {
                    error
                } =
                await supabaseClient
                    .from("menu_items")
                    .update(
                        itemData
                    )
                    .eq(
                        "id",
                        editingId
                    )
                    .eq(
                        "restaurant_id",
                        currentRestaurantId
                    );


                if(error){

                    throw error;

                }


                closeModal();

                showMessage(
                    "Food item updated successfully.",
                    "success"
                );

            }


            /* INSERT */

            else{

                const {
                    error
                } =
                await supabaseClient
                    .from("menu_items")
                    .insert(
                        itemData
                    );


                if(error){

                    throw error;

                }


                closeModal();

                showMessage(
                    "Food item added successfully.",
                    "success"
                );

            }


            await loadMenu();

        }
        catch(error){

            console.error(
                "Save food error:",
                error
            );


            showMessage(
                error.message ||
                "Unable to save food item.",
                "error"
            );

        }
        finally{

            saveBtn.disabled = false;

            saveBtn.textContent =
                editingId
                ? "Update Food Item"
                : "Save Food Item";

        }

    }
);


/* =========================================================
   TOGGLE AVAILABILITY
========================================================= */

async function toggleAvailability(
    id,
    currentStatus
){

    const newStatus =
        !currentStatus;


    try{

        const {
            error
        } =
        await supabaseClient
            .from("menu_items")
            .update({

                is_available:
                    newStatus

            })
            .eq(
                "id",
                id
            )
            .eq(
                "restaurant_id",
                currentRestaurantId
            );


        if(error){

            throw error;

        }


        showMessage(
            newStatus
            ? "Food item is now available."
            : "Food item is now unavailable.",
            "success"
        );


        await loadMenu();

    }
    catch(error){

        console.error(
            "Availability error:",
            error
        );


        showMessage(
            error.message ||
            "Unable to update availability.",
            "error"
        );

    }

}


/* =========================================================
   DELETE FOOD
========================================================= */

async function deleteFood(id){

    const item =
        allMenuItems.find(
            food =>
                String(food.id) ===
                String(id)
        );


    if(!item){

        return;

    }


    const confirmed =
        confirm(
            `Delete "${item.name}" from your menu?`
        );


    if(!confirmed){

        return;

    }


    try{

        const {
            error
        } =
        await supabaseClient
            .from("menu_items")
            .delete()
            .eq(
                "id",
                id
            )
            .eq(
                "restaurant_id",
                currentRestaurantId
            );


        if(error){

            throw error;

        }


        showMessage(
            "Food item deleted successfully.",
            "success"
        );


        await loadMenu();

    }
    catch(error){

        console.error(
            "Delete error:",
            error
        );


        showMessage(
            error.message ||
            "Unable to delete food item.",
            "error"
        );

    }

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

        confirm(

    await supabaseClient
        .auth
        .signOut();

/* =========================================================
   AUTH CHECK
========================================================= */

async function initialize(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .getUser();


        if(error){

            throw error;

        }


        if(!data || !data.user){

            window.location.href =
                "login.html";

            return;

        }


        currentUser =
            data.user;


        await loadRestaurant();

        await loadMenu();

    }
    catch(error){

        console.error(
            "Initialization error:",
            error
        );


        menuGrid.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                <h3>
                    Unable to load menu
                </h3>

                <p>
                    ${escapeHTML(
                        error.message ||
                        "Please login again."
                    )}
                </p>

            </div>

        `;

    }

}

);
