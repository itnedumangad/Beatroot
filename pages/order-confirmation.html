<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Confirmed - Beatroot</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f7f7f7;
    color:#222;
}

.header{
    height:70px;
    background:#fff;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:26px;
    font-weight:800;
    color:#ff4d00;
    text-decoration:none;
}

.nav{
    display:flex;
    gap:20px;
    align-items:center;
}

.nav a{
    text-decoration:none;
    color:#333;
    font-size:14px;
    font-weight:600;
}

.cart-btn{
    background:#ff4d00;
    color:#fff !important;
    padding:10px 16px;
    border-radius:8px;
}

.container{
    max-width:900px;
    margin:45px auto;
    padding:0 20px;
}

.success-box{
    background:#fff;
    border-radius:18px;
    padding:40px 30px;
    text-align:center;
    box-shadow:0 5px 25px rgba(0,0,0,.07);
}

.success-icon{
    width:80px;
    height:80px;
    margin:0 auto 20px;
    border-radius:50%;
    background:#e9f8ee;
    color:#20a44b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    font-weight:bold;
}

.success-box h1{
    font-size:30px;
    margin-bottom:10px;
}

.success-box p{
    color:#666;
    font-size:15px;
}

.order-id{
    display:inline-block;
    margin-top:18px;
    padding:10px 18px;
    background:#fff4ee;
    color:#ff4d00;
    border-radius:8px;
    font-weight:800;
}

.details{
    margin-top:30px;
    text-align:left;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.detail-box{
    border:1px solid #eee;
    border-radius:12px;
    padding:20px;
}

.detail-box h3{
    font-size:17px;
    margin-bottom:15px;
}

.detail-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:8px 0;
    font-size:14px;
}

.detail-row span:first-child{
    color:#777;
}

.items{
    margin-top:25px;
    text-align:left;
}

.items h2{
    font-size:21px;
    margin-bottom:15px;
}

.item{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:14px 0;
    border-bottom:1px solid #eee;
}

.item:last-child{
    border-bottom:none;
}

.item-name{
    font-weight:600;
}

.item-qty{
    color:#777;
    font-size:13px;
    margin-top:4px;
}

.item-price{
    font-weight:700;
    white-space:nowrap;
}

.total-box{
    margin-top:20px;
    border-top:1px solid #eee;
    padding-top:18px;
}

.total-row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    color:#555;
}

.grand-total{
    display:flex;
    justify-content:space-between;
    font-size:21px;
    font-weight:800;
    color:#111;
    margin-top:8px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:30px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    padding:13px 22px;
    border-radius:9px;
    text-decoration:none;
    font-weight:700;
    border:none;
    cursor:pointer;
    font-size:14px;
}

.primary{
    background:#ff4d00;
    color:#fff;
}

.secondary{
    background:#f1f1f1;
    color:#333;
}

.loading{
    text-align:center;
    padding:70px 20px;
}

@media(max-width:700px){

    .header{
        padding:0 20px;
    }

    .nav a:not(.cart-btn){
        display:none;
    }

    .success-box{
        padding:30px 18px;
    }

    .success-box h1{
        font-size:25px;
    }

    .details{
        grid-template-columns:1fr;
    }

}

</style>
</head>


<body>

<header class="header">

    <a href="../index.html" class="logo">
        Beatroot
    </a>

    <nav class="nav">

        <a href="../index.html">
            Home
        </a>

        <a href="restaurants.html">
            Restaurants
        </a>

        <a href="my-orders.html">
            My Orders
        </a>

        <a href="profile.html">
            Profile
        </a>

        <a href="cart.html" class="cart-btn">
            🛒 Cart
        </a>

    </nav>

</header>


<main class="container">

<div id="confirmationArea">

    <div class="loading">
        Loading order details...
    </div>

</div>

</main>


<script>

const order =
JSON.parse(
    localStorage.getItem("beatrootCurrentOrder")
);


function showConfirmation(){

    const area =
    document.getElementById("confirmationArea");


    if(!order){

        area.innerHTML = `

            <div class="success-box">

                <div class="success-icon">
                    !
                </div>

                <h1>
                    No Order Found
                </h1>

                <p>
                    We couldn't find a recent order.
                </p>

                <div class="buttons">

                    <a
                        href="restaurants.html"
                        class="btn primary"
                    >
                        Browse Restaurants
                    </a>

                    <a
                        href="my-orders.html"
                        class="btn secondary"
                    >
                        My Orders
                    </a>

                </div>

            </div>

        `;

        return;
    }


    let itemsHTML = "";


    order.items.forEach(item=>{

        const quantity =
        Number(item.quantity || 1);

        const price =
        Number(item.price || 0);

        const total =
        price * quantity;


        itemsHTML += `

            <div class="item">

                <div>

                    <div class="item-name">
                        ${item.name || "Food Item"}
                    </div>

                    <div class="item-qty">
                        Quantity: ${quantity}
                    </div>

                </div>

                <div class="item-price">
                    ₹${total.toFixed(2)}
                </div>

            </div>

        `;

    });


    const address = order.address || {};

    const customer = order.customer || {};


    area.innerHTML = `

        <div class="success-box">


            <div class="success-icon">
                ✓
            </div>


            <h1>
                Order Placed Successfully!
            </h1>


            <p>
                Thank you for ordering with Beatroot.
            </p>


            <div class="order-id">

                Order ID:
                ${order.orderId}

            </div>


            <div class="details">


                <!-- CUSTOMER -->

                <div class="detail-box">

                    <h3>
                        👤 Customer Details
                    </h3>


                    <div class="detail-row">

                        <span>
                            Name
                        </span>

                        <strong>
                            ${customer.name || "-"}
                        </strong>

                    </div>


                    <div class="detail-row">

                        <span>
                            Mobile
                        </span>

                        <strong>
                            ${customer.phone || "-"}
                        </strong>

                    </div>


                    <div class="detail-row">

                        <span>
                            Email
                        </span>

                        <strong>
                            ${customer.email || "-"}
                        </strong>

                    </div>

                </div>


                <!-- DELIVERY -->

                <div class="detail-box">

                    <h3>
                        📍 Delivery Address
                    </h3>


                    <div class="detail-row">

                        <span>
                            Address
                        </span>

                        <strong>
                            ${address.house || "-"}
                        </strong>

                    </div>


                    <div class="detail-row">

                        <span>
                            Area
                        </span>

                        <strong>
                            ${address.street || "-"}
                        </strong>

                    </div>


                    <div class="detail-row">

                        <span>
                            City
                        </span>

                        <strong>
                            ${address.city || "-"}
                        </strong>

                    </div>


                    <div class="detail-row">

                        <span>
                            PIN
                        </span>

                        <strong>
                            ${address.pincode || "-"}
                        </strong>

                    </div>

                </div>


            </div>


            <!-- ITEMS -->

            <div class="items">

                <h2>
                    🧾 Order Items
                </h2>

                ${itemsHTML}


                <div class="total-box">


                    <div class="total-row">

                        <span>
                            Subtotal
                        </span>

                        <strong>
                            ₹${Number(order.subtotal || 0).toFixed(2)}
                        </strong>

                    </div>


                    <div class="total-row">

                        <span>
                            Delivery Fee
                        </span>

                        <strong>

                            ${
                                Number(order.deliveryFee || 0) === 0
                                ? "FREE"
                                : "₹" +
                                Number(order.deliveryFee).toFixed(2)
                            }

                        </strong>

                    </div>


                    <div class="grand-total">

                        <span>
                            Total
                        </span>

                        <span>
                            ₹${Number(order.total || 0).toFixed(2)}
                        </span>

                    </div>


                </div>

            </div>


            <div class="buttons">

                <a
                    href="my-orders.html"
                    class="btn primary"
                >
                    📦 View My Orders
                </a>


                <a
                    href="restaurants.html"
                    class="btn secondary"
                >
                    🍽️ Order More
                </a>

            </div>


        </div>

    `;

}


showConfirmation();

</script>

</body>
</html>
