<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beatroot - Home</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/desktop.css">

<style>
.home-page{
    min-height:100vh;
    background:#f7f8fa;
}

.home-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px;
    background:#fff;
}

.home-logo{
    font-size:28px;
    font-weight:800;
    color:#e53935;
}

.home-logo span{
    color:#222;
}

.location{
    font-size:13px;
    color:#777;
    margin-top:3px;
}

.cart-btn{
    border:0;
    background:#fff;
    font-size:25px;
    cursor:pointer;
}

.hero{
    margin:15px 20px;
    padding:28px 22px;
    border-radius:22px;
    background:linear-gradient(135deg,#e53935,#ff8a65);
    color:#fff;
}

.hero h1{
    margin:0 0 8px;
    font-size:28px;
}

.hero p{
    margin:0 0 18px;
    font-size:15px;
}

.order-btn{
    border:0;
    padding:11px 18px;
    border-radius:12px;
    background:#fff;
    color:#e53935;
    font-weight:700;
    cursor:pointer;
}

.search-box{
    margin:18px 20px;
}

.search-box input{
    width:100%;
    padding:14px 16px;
    border:1px solid #ddd;
    border-radius:14px;
    font-size:15px;
    box-sizing:border-box;
}

.section{
    padding:0 20px;
    margin-top:25px;
}

.section h2{
    font-size:20px;
    margin-bottom:15px;
}

.categories{
    display:flex;
    gap:14px;
    overflow-x:auto;
}

.category{
    min-width:75px;
    text-align:center;
    background:#fff;
    padding:12px 8px;
    border-radius:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
    cursor:pointer;
}

.category-icon{
    font-size:30px;
}

.category-name{
    font-size:12px;
    margin-top:5px;
}

.restaurants{
    display:grid;
    gap:14px;
}

.restaurant-card{
    background:#fff;
    padding:16px;
    border-radius:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    cursor:pointer;
}

.restaurant-card h3{
    margin:0 0 5px;
}

.restaurant-card p{
    margin:0;
    color:#777;
    font-size:13px;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:430px;
    display:flex;
    justify-content:space-around;
    padding:12px 0;
    background:#fff;
    border-top:1px solid #eee;
}

.nav-item{
    text-align:center;
    font-size:12px;
    color:#777;
    cursor:pointer;
}

.nav-icon{
    font-size:21px;
    display:block;
    margin-bottom:3px;
}

@media(min-width:768px){

    .home-page{
        max-width:1200px;
        margin:auto;
        background:#fff;
    }

    .home-header{
        padding:25px 45px;
    }

    .hero{
        margin:25px 45px;
        padding:40px;
    }

    .search-box{
        margin:25px 45px;
    }

    .section{
        padding:0 45px;
    }

    .restaurants{
        grid-template-columns:repeat(3,1fr);
    }

    .bottom-nav{
        max-width:1200px;
    }
}
</style>
</head>

<body>

<div class="home-page">

    <!-- HEADER -->
    <header class="home-header">

        <div>
            <div class="home-logo">
                Beat<span>root</span>
            </div>

            <div class="location">
                📍 Deliver to <b>Home</b>
            </div>
        </div>

        <button class="cart-btn" onclick="openCart()">
            🛒 <sup id="cartCount">0</sup>
        </button>

    </header>


    <!-- HERO -->
    <section class="hero">

        <h1>Hungry? We've got you.</h1>

        <p>
            Fresh food delivered to your doorstep.
        </p>

        <button class="order-btn" onclick="goRestaurants()">
            Order Now →
        </button>

    </section>


    <!-- SEARCH -->
    <div class="search-box">

        <input
            type="search"
            id="searchInput"
            placeholder="🔍 Search restaurants or food"
            oninput="searchFood()"
        >

    </div>


    <!-- CATEGORIES -->
    <section class="section">

        <h2>Categories</h2>

        <div class="categories">

            <div class="category" onclick="selectCategory('Pizza')">
                <div class="category-icon">🍕</div>
                <div class="category-name">Pizza</div>
            </div>

            <div class="category" onclick="selectCategory('Burgers')">
                <div class="category-icon">🍔</div>
                <div class="category-name">Burgers</div>
            </div>

            <div class="category" onclick="selectCategory('Chicken')">
                <div class="category-icon">🍗</div>
                <div class="category-name">Chicken</div>
            </div>

            <div class="category" onclick="selectCategory('Meals')">
                <div class="category-icon">🍛</div>
                <div class="category-name">Meals</div>
            </div>

        </div>

    </section>


    <!-- RESTAURANTS -->
    <section class="section">

        <h2>Popular near you</h2>

        <div class="restaurants" id="restaurantList">

            <div class="restaurant-card">
                <h3>Restaurant 1</h3>
                <p>Delicious food • ⭐ 4.5</p>
            </div>

            <div class="restaurant-card">
                <h3>Restaurant 2</h3>
                <p>Fresh food • ⭐ 4.4</p>
            </div>

            <div class="restaurant-card">
                <h3>Restaurant 3</h3>
                <p>Fast delivery • ⭐ 4.6</p>
            </div>

        </div>

    </section>


    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">

        <div class="nav-item" onclick="goHome()">
            <span class="nav-icon">🏠</span>
            Home
        </div>

        <div class="nav-item" onclick="goOrders()">
            <span class="nav-icon">📦</span>
            Orders
        </div>

        <div class="nav-item" onclick="goProfile()">
            <span class="nav-icon">👤</span>
            Profile
        </div>

    </nav>

</div>


<script>

function goHome(){
    window.location.href="home.html";
}

function goRestaurants(){
    window.location.href="restaurants.html";
}

function goOrders(){
    window.location.href="orders.html";
}

function goProfile(){
    window.location.href="profile.html";
}

function openCart(){
    window.location.href="cart.html";
}

function selectCategory(category){
    window.location.href =
        "restaurants.html?category=" +
        encodeURIComponent(category);
}

function searchFood(){

    const value =
        document.getElementById("searchInput")
        .value
        .trim();

    if(value.length > 0){
        console.log("Searching:",value);
    }
}

</script>

</body>
</html>
