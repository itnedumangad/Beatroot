<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Addresses - Beatroot</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/desktop.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7f9;
      color: #171717;
    }

    .app {
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      background: #fff;
    }

    header {
      padding: 18px 20px;
      background: #ffffff;
      border-bottom: 1px solid #eeeeee;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: #f3f4f6;
      font-size: 22px;
      cursor: pointer;
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
    }

    .content {
      padding: 20px;
      padding-bottom: 90px;
    }

    .add-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #e53935;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .add-btn:hover {
      background: #c62828;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #555;
    }

    .address-card {
      border: 1px solid #e5e5e5;
      border-radius: 15px;
      padding: 16px;
      margin-bottom: 14px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .address-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .address-label {
      font-size: 16px;
      font-weight: 700;
    }

    .default-badge {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }

    .address-name {
      font-weight: 600;
      margin-bottom: 5px;
    }

    .address-text {
      color: #666;
      line-height: 1.5;
      font-size: 14px;
    }

    .phone {
      margin-top: 7px;
      font-size: 14px;
      color: #444;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .action-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 600;
    }

    .edit-btn {
      background: #f1f3f5;
      color: #333;
    }

    .default-btn {
      background: #fff3e0;
      color: #e65100;
    }

    .delete-btn {
      background: #ffebee;
      color: #c62828;
    }

    .empty {
      text-align: center;
      padding: 45px 20px;
      color: #777;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    /* Modal */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 22px 22px 0 0;
      padding: 22px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
    }

    .close-btn {
      border: none;
      background: #f1f1f1;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
      font-family: inherit;
    }

    .form-group textarea {
      min-height: 85px;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #e53935;
    }

    .save-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 11px;
      background: #e53935;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    @media (min-width: 700px) {
      .app {
        max-width: 700px;
      }

      .modal-box {
        max-width: 500px;
        border-radius: 20px;
        margin-bottom: 20px;
      }

      .modal {
        align-items: center;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- Header -->
  <header>
    <button class="back-btn" onclick="goBack()">‹</button>
    <div class="header-title">My Addresses</div>
  </header>

  <!-- Content -->
  <main class="content">

    <button class="add-btn" onclick="openAddModal()">
      + Add New Address
    </button>

    <div class="section-title">
      SAVED ADDRESSES
    </div>

    <div id="addressList"></div>

  </main>

</div>


<!-- Add / Edit Address Modal -->

<div class="modal" id="addressModal">

  <div class="modal-box">

    <div class="modal-header">
      <div class="modal-title" id="modalTitle">
        Add New Address
      </div>

      <button class="close-btn" onclick="closeModal()">
        ×
      </button>
    </div>

    <form id="addressForm">

      <div class="form-group">
        <label>Address Type</label>

        <select id="addressType">
          <option value="Home">Home</option>
          <option value="Work">Work</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Full Name</label>

        <input
          type="text"
          id="fullName"
          placeholder="Enter full name"
          required
        >
      </div>

      <div class="form-group">
        <label>Phone Number</label>

        <input
          type="tel"
          id="phone"
          placeholder="Enter phone number"
          required
        >
      </div>

      <div class="form-group">
        <label>Address</label>

        <textarea
          id="address"
          placeholder="House / Building, Street, Area"
          required
        ></textarea>
      </div>

      <div class="form-group">
        <label>City</label>

        <input
          type="text"
          id="city"
          placeholder="Enter city"
          required
        >
      </div>

      <div class="form-group">
        <label>PIN Code</label>

        <input
          type="text"
          id="pincode"
          placeholder="Enter PIN code"
          maxlength="6"
          required
        >
      </div>

      <button type="submit" class="save-btn">
        Save Address
      </button>

    </form>

  </div>

</div>


<script>

  let addresses = JSON.parse(
    localStorage.getItem("beatroot_addresses")
  ) || [];

  let editingId = null;


  /* Render Addresses */

  function renderAddresses() {

    const list = document.getElementById("addressList");

    list.innerHTML = "";

    if (addresses.length === 0) {

      list.innerHTML = `
        <div class="empty">
          <div class="empty-icon">📍</div>

          <h3>No saved addresses</h3>

          <p>
            Add your delivery address to order faster.
          </p>
        </div>
      `;

      return;
    }


    addresses.forEach(address => {

      const card = document.createElement("div");

      card.className = "address-card";

      card.innerHTML = `

        <div class="address-top">

          <div class="address-label">
            ${escapeHtml(address.type)}
          </div>

          ${
            address.isDefault
              ? `<span class="default-badge">
                   DEFAULT
                 </span>`
              : ""
          }

        </div>

        <div class="address-name">
          ${escapeHtml(address.name)}
        </div>

        <div class="address-text">
          ${escapeHtml(address.address)}<br>
          ${escapeHtml(address.city)} -
          ${escapeHtml(address.pincode)}
        </div>

        <div class="phone">
          📞 ${escapeHtml(address.phone)}
        </div>

        <div class="actions">

          <button
            class="action-btn edit-btn"
            onclick="editAddress('${address.id}')">
            Edit
          </button>

          ${
            !address.isDefault
            ? `
              <button
                class="action-btn default-btn"
                onclick="setDefault('${address.id}')">
                Set Default
              </button>
            `
            : ""
          }

          <button
            class="action-btn delete-btn"
            onclick="deleteAddress('${address.id}')">
            Delete
          </button>

        </div>
      `;

      list.appendChild(card);

    });

  }


  /* Open Add Modal */

  function openAddModal() {

    editingId = null;

    document.getElementById("modalTitle").textContent =
      "Add New Address";

    document.getElementById("addressForm").reset();

    document.getElementById("addressModal")
      .classList.add("active");
  }


  /* Edit Address */

  function editAddress(id) {

    const address = addresses.find(
      item => item.id === id
    );

    if (!address) return;

    editingId = id;

    document.getElementById("modalTitle").textContent =
      "Edit Address";

    document.getElementById("addressType").value =
      address.type;

    document.getElementById("fullName").value =
      address.name;

    document.getElementById("phone").value =
      address.phone;

    document.getElementById("address").value =
      address.address;

    document.getElementById("city").value =
      address.city;

    document.getElementById("pincode").value =
      address.pincode;

    document.getElementById("addressModal")
      .classList.add("active");
  }


  /* Close Modal */

  function closeModal() {

    document.getElementById("addressModal")
      .classList.remove("active");

    editingId = null;
  }


  /* Save Address */

  document.getElementById("addressForm")
    .addEventListener("submit", function(e) {

      e.preventDefault();

      const type =
        document.getElementById("addressType").value;

      const name =
        document.getElementById("fullName").value.trim();

      const phone =
        document.getElementById("phone").value.trim();

      const address =
        document.getElementById("address").value.trim();

      const city =
        document.getElementById("city").value.trim();

      const pincode =
        document.getElementById("pincode").value.trim();


      if (!name || !phone || !address ||
          !city || !pincode) {

        alert("Please fill all fields.");

        return;
      }


      if (editingId) {

        const index = addresses.findIndex(
          item => item.id === editingId
        );

        if (index !== -1) {

          addresses[index].type = type;
          addresses[index].name = name;
          addresses[index].phone = phone;
          addresses[index].address = address;
          addresses[index].city = city;
          addresses[index].pincode = pincode;

        }

      } else {

        const newAddress = {

          id: Date.now().toString(),

          type: type,

          name: name,

          phone: phone,

          address: address,

          city: city,

          pincode: pincode,

          isDefault: addresses.length === 0

        };

        addresses.push(newAddress);

      }


      saveAddresses();

      closeModal();

      renderAddresses();

    });


  /* Set Default Address */

  function setDefault(id) {

    addresses = addresses.map(address => ({

      ...address,

      isDefault: address.id === id

    }));

    saveAddresses();

    renderAddresses();

  }


  /* Delete Address */

  function deleteAddress(id) {

    const address =
      addresses.find(item => item.id === id);

    if (!address) return;


    const confirmDelete = confirm(
      "Are you sure you want to delete this address?"
    );

    if (!confirmDelete) return;


    addresses =
      addresses.filter(item => item.id !== id);


    /* Make first address default */

    if (
      addresses.length > 0 &&
      !addresses.some(item => item.isDefault)
    ) {

      addresses[0].isDefault = true;

    }


    saveAddresses();

    renderAddresses();

  }


  /* Save to Local Storage */

  function saveAddresses() {

    localStorage.setItem(
      "beatroot_addresses",
      JSON.stringify(addresses)
    );

  }


  /* Back Button */

  function goBack() {

    if (history.length > 1) {

      history.back();

    } else {

      window.location.href = "home.html";

    }

  }


  /* Basic HTML Escape */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* Initial Load */

  renderAddresses();


  /* Close modal when clicking outside */

  document.getElementById("addressModal")
    .addEventListener("click", function(e) {

      if (e.target === this) {

        closeModal();

      }

    });

</script>

</body>
</html>
