<!doctype html>
<html lang="en">

<head>

<title>Beatroot - Orders</title>

<style>

/* ================================
   RESET
================================ */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#171717;
}


/* ================================
   SIDEBAR
================================ */

.side{
    position:fixed;
    top:0;
    left:0;
    bottom:0;
    width:250px;
    background:#111827;
    color:white;
    padding:25px 15px;
    z-index:100;
}

.brand{
    font-size:27px;
    font-weight:800;
    padding:0 15px 30px;
}

.brand span{
    color:#ef4444;
}

.label{
    font-size:12px;
    color:#9ca3af;
    padding:0 15px 10px;
    text-transform:uppercase;
}

.menu button,
.logout{
    width:100%;
    border:0;
    background:transparent;
    color:#d1d5db;
    padding:13px 15px;
    text-align:left;
    border-radius:10px;
    cursor:pointer;
    margin:3px 0;
    font-size:14px;
}

.menu button:hover,
.menu .active{
    background:#ef4444;
    color:white;
}

.bottom{
    position:absolute;
    bottom:20px;
    left:15px;
    right:15px;
}

.logout{
    border:1px solid #374151;
}

.logout:hover{
    background:#1f2937;
}


/* ================================
   MAIN
================================ */

.main{
    margin-left:250px;
}

.top{
    height:75px;
    background:white;
    border-bottom:1px solid #e5e7eb;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 30px;

    position:sticky;
    top:0;

    z-index:50;
}

.title{
    font-size:22px;
    font-weight:700;
}

.profile{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#ef4444;
    color:white;

    display:grid;
    place-items:center;

    font-weight:bold;
}


/* ================================
   CONTENT
================================ */

.content{
    padding:30px;
}

.head{
    margin-bottom:22px;
}

.head h1{
    margin:0 0 6px;
    font-size:28px;
}

.head p{
    margin:0;
    color:#6b7280;
}


/* ================================
   ERROR
================================ */

.error{
    display:none;

    background:#fee2e2;
    color:#b91c1c;

    padding:14px;

    border-radius:10px;

    margin-bottom:18px;

    font-size:14px;
}


/* ================================
   CARD
================================ */

.card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:16px;
    padding:22px;
}


/* ================================
   TOOLBAR
================================ */

.toolbar{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.search{
    flex:1;
    min-width:220px;

    height:44px;

    border:1px solid #ddd;
    border-radius:10px;

    padding:0 13px;

    font-size:14px;
    outline:none;
}

.search:focus{
    border-color:#ef4444;
}

.filter{
    height:44px;

    border:1px solid #ddd;
    border-radius:10px;

    padding:0 12px;

    background:white;

    cursor:pointer;
}

.refresh{
    height:44px;

    border:0;
    border-radius:10px;

    padding:0 16px;

    background:#111827;
    color:white;

    cursor:pointer;
}

.refresh:hover{
    background:#1f2937;
}


/* ================================
   COUNT
================================ */

.count{
    font-size:13px;
    color:#6b7280;

    margin-bottom:10px;
}


/* ================================
   TABLE
================================ */

.table{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;

    min-width:800px;
}

th,
td{
    text-align:left;

    padding:14px 10px;

    border-bottom:1px solid #eee;

    font-size:13px;
}

th{
    font-size:12px;
    color:#6b7280;
}

.order-number{
    color:#111827;
    cursor:pointer;
}

.order-number:hover{
    color:#ef4444;
    text-decoration:underline;
}

.customer{
    max-width:220px;

    word-break:break-all;

    color:#6b7280;
}


/* ================================
   STATUS
================================ */

.status{
    border:0;

    border-radius:20px;

    padding:7px 10px;

    font-size:11px;

    font-weight:bold;

    cursor:pointer;
}

.status.pending{
    background:#fef3c7;
    color:#92400e;
}

.status.confirmed{
    background:#dbeafe;
    color:#2563eb;
}

.status.preparing{
    background:#ffedd5;
    color:#c2410c;
}

.status.delivered{
    background:#dcfce7;
    color:#15803d;
}

.status.cancelled{
    background:#fee2e2;
    color:#dc2626;
}


/* ================================
   VIEW BUTTON
================================ */

.view-btn{
    border:0;

    background:#f3f4f6;

    padding:7px 11px;

    border-radius:8px;

    cursor:pointer;

    font-size:12px;
}

.view-btn:hover{
    background:#fee2e2;
    color:#ef4444;
}


/* ================================
   MESSAGE
================================ */

.msg{
    text-align:center;

    padding:35px;

    color:#777;
}


/* ================================
   MODAL
================================ */

.modal{
    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.55);

    z-index:999;

    align-items:center;
    justify-content:center;

    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:650px;

    max-height:90vh;

    overflow:auto;

    background:white;

    border-radius:18px;

    box-shadow:0 25px 80px rgba(0,0,0,.25);
}

.modal-head{
    padding:20px 22px;

    border-bottom:1px solid #eee;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.modal-head h2{
    margin:0;

    font-size:21px;
}

.close-btn{
    width:35px;
    height:35px;

    border:0;

    border-radius:50%;

    background:#f3f4f6;

    cursor:pointer;

    font-size:18px;
}

.close-btn:hover{
    background:#fee2e2;
    color:#ef4444;
}

.modal-body{
    padding:22px;
}


/* ================================
   ORDER INFO
================================ */

.info-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-bottom:22px;
}

.info-box{
    background:#f8fafc;

    border:1px solid #e5e7eb;

    border-radius:10px;

    padding:12px;
}

.info-label{
    font-size:11px;

    color:#6b7280;

    margin-bottom:5px;
}

.info-value{
    font-size:14px;

    font-weight:600;

    word-break:break-word;
}


/* ================================
   ITEMS
================================ */

.items-title{
    font-size:17px;

    font-weight:700;

    margin-bottom:10px;
}

.item-row{
    display:flex;

    justify-content:space-between;

    gap:15px;

    padding:13px 0;

    border-bottom:1px solid #eee;
}

.item-name{
    font-weight:600;

    font-size:14px;
}

.item-meta{
    color:#777;

    font-size:12px;

    margin-top:4px;
}

.item-price{
    font-weight:700;

    white-space:nowrap;
}

.order-total{
    display:flex;

    justify-content:space-between;

    padding-top:18px;

    font-size:18px;

    font-weight:800;
}


/* ================================
   MODAL STATUS
================================ */

.status-area{
    margin-top:20px;

    padding-top:18px;

    border-top:1px solid #eee;
}

.status-area label{
    display:block;

    font-size:12px;

    color:#6b7280;

    margin-bottom:7px;
}

.status-select{
    width:100%;

    height:44px;

    border:1px solid #ddd;

    border-radius:10px;

    padding:0 12px;

    background:white;

    cursor:pointer;
}


/* ================================
   MOBILE
================================ */

@media(max-width:700px){

    .side{
        transform:translateX(-100%);
    }

    .main{
        margin-left:0;
    }

    .content{
        padding:20px 15px;
    }

    .top{
        padding:0 15px;
    }

    .profile small{
        display:none;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://jhihjnsxazmftdqlitgk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_r_zMn0-GhFNtuvs5-UOo9w_D8SW8J57";

const ADMIN_EMAIL =
    "itnedumangad@gmail.com";


const sb =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   VARIABLES
========================================= */

let orders = [];

let selectedOrder = null;


/* =========================================
   ELEMENTS
========================================= */

const searchInput =
    document.getElementById("search");

const filterInput =
    document.getElementById("filter");

const rowsElement =
    document.getElementById("rows");

const countElement =
    document.getElementById("count");

const errorElement =
    document.getElementById("error");

const modal =
    document.getElementById("orderModal");

const modalBody =
    document.getElementById("modalBody");

const adminNameElement =
    document.getElementById("adminName");

const avatarElement =
    document.getElementById("avatar");


/* =========================================
   ESCAPE HTML
========================================= */

function esc(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================
   STATUS NORMALIZE
========================================= */

function normalizeStatus(value){

    const s =
        String(value || "pending")
        .toLowerCase();

    if(s === "processing"){
        return "preparing";
    }

    if(s === "completed"){
        return "delivered";
    }

    if(s === "canceled"){
        return "cancelled";
    }

    const allowed = [
        "pending",
        "confirmed",
        "preparing",
        "delivered",
        "cancelled"
    ];

    if(allowed.includes(s)){
        return s;
    }

    return "pending";

}


/* =========================================
   NAVIGATION
========================================= */

function go(page){

    window.location.href = page;

}


/* =========================================
   AUTH CHECK
========================================= */

async function checkAuth(){

    try{

        const result =
            await sb.auth.getUser();


        if(
            result.error ||
            !result.data ||
            !result.data.user
        ){

            window.location.href =
                "login.html";

            return false;

        }


        const user =
            result.data.user;


        if(
            user.email !== ADMIN_EMAIL
        ){

            alert(
                "Access denied. Admin only."
            );

            window.location.href =
                "../index.html";

            return false;

        }


        const email =
            user.email || "Admin";


        adminNameElement.textContent =
            email.split("@")[0];


        avatarElement.textContent =
            email.charAt(0).toUpperCase();


        return true;

    }

    catch(error){

        console.error(
            "Auth error:",
            error
        );

        window.location.href =
            "login.html";

        return false;

    }

}


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders(){

    errorElement.style.display =
        "none";

    rowsElement.innerHTML = `
        <tr>
            <td colspan="6" class="msg">
                Loading orders...
            </td>
        </tr>
    `;


    const authenticated =
        await checkAuth();


    if(!authenticated){
        return;
    }


    try{

        const result =
            await sb
            .from("orders")
            .select(
                "id,status,total,customer_id,created_at"
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(result.error){

            throw result.error;

        }


        orders =
            result.data || [];


        renderOrders();

    }

    catch(error){

        console.error(
            "Orders error:",
            error
        );


        errorElement.textContent =
            "Orders loading error: " +
            error.message;


        errorElement.style.display =
            "block";


        rowsElement.innerHTML = `
            <tr>
                <td colspan="6" class="msg">
                    Unable to load orders.
                </td>
            </tr>
        `;

    }

}


/* =========================================
   RENDER ORDERS
========================================= */

function renderOrders(){

    const query =
        searchInput.value
        .toLowerCase()
        .trim();


    const selectedFilter =
        filterInput.value;


    const filtered =
        orders.filter(function(order){

            const idMatch =
                String(order.id || "")
                .toLowerCase()
                .includes(query);


            const customerMatch =
                String(order.customer_id || "")
                .toLowerCase()
                .includes(query);


            const searchMatch =
                !query ||
                idMatch ||
                customerMatch;


            const status =
                normalizeStatus(
                    order.status
                );


            const statusMatch =
                !selectedFilter ||
                status === selectedFilter;


            return (
                searchMatch &&
                statusMatch
            );

        });


    countElement.textContent =
        filtered.length +
        " order" +
        (
            filtered.length === 1
                ? ""
                : "s"
        );


    if(filtered.length === 0){

        rowsElement.innerHTML = `
            <tr>
                <td colspan="6"
                    class="msg">
                    No orders found.
                </td>
            </tr>
        `;

        return;

    }


    rowsElement.innerHTML =
        filtered.map(function(order){

            const status =
                normalizeStatus(
                    order.status
                );


            const date =
                order.created_at
                ? new Date(
                    order.created_at
                  ).toLocaleString(
                    "en-IN"
                  )
                : "-";


            const total =
                Number(
                    order.total || 0
                ).toLocaleString(
                    "en-IN"
                );


            return `

<tr>

<td>

    <b
        class="order-number"
        onclick="openOrder(${Number(order.id)})">

        #${esc(order.id)}

    </b>

</td>


<td class="customer">

    ${esc(
        order.customer_id ||
        "Customer"
    )}

</td>


<td>

    ${esc(date)}

</td>


<td>

<select
    class="status ${status}"
    onchange="updateStatus(
        ${Number(order.id)},
        this.value
    )">

    <option
        value="pending"
        ${status === "pending"
            ? "selected"
            : ""}>

        Pending

    </option>

    <option
        value="confirmed"
        ${status === "confirmed"
            ? "selected"
            : ""}>

        Confirmed

    </option>

    <option
        value="preparing"
        ${status === "preparing"
            ? "selected"
            : ""}>

        Preparing

    </option>

    <option
        value="delivered"
        ${status === "delivered"
            ? "selected"
            : ""}>

        Delivered

    </option>

    <option
        value="cancelled"
        ${status === "cancelled"
            ? "selected"
            : ""}>

        Cancelled

    </option>

</select>

</td>


<td>

    <b>
        ₹${total}
    </b>

</td>


<td>

    <button
        class="view-btn"
        onclick="openOrder(${Number(order.id)})">

        View

    </button>

</td>

</tr>

`;

        }).join("");

}


/* =========================================
   OPEN ORDER
========================================= */

async function openOrder(orderId){

    modal.classList.add("show");


    modalBody.innerHTML = `
        <div class="msg">
            Loading order details...
        </div>
    `;


    const order =
        orders.find(
            function(item){
                return Number(item.id) ===
                       Number(orderId);
            }
        );


    if(!order){

        modalBody.innerHTML = `
            <div class="msg">
                Order not found.
            </div>
        `;

        return;

    }


    selectedOrder = order;


    const result =
        await sb
        .from("order_items")
        .select(
            "id,order_id,menu_item_id,item_name,quantity,unit_price"
        )
        .eq(
            "order_id",
            orderId
        )
        .order(
            "id",
            {
                ascending:true
            }
        );


    if(result.error){

        console.error(
            "Order items error:",
            result.error
        );


        modalBody.innerHTML = `
            <div class="msg">
                Could not load order items.
                <br><br>
                ${esc(result.error.message)}
            </div>
        `;

        return;

    }


    const items =
        result.data || [];


    const status =
        normalizeStatus(
            order.status
        );


    const date =
        order.created_at
        ? new Date(
            order.created_at
          ).toLocaleString(
            "en-IN"
          )
        : "-";


    const total =
        Number(
            order.total || 0
        ).toLocaleString(
            "en-IN"
        );


    let itemsHTML = "";


    if(items.length === 0){

        itemsHTML = `
            <div class="msg">
                No items found for this order.
            </div>
        `;

    }

    else{

        itemsHTML =
            items.map(function(item){

                const quantity =
                    Number(
                        item.quantity || 0
                    );


                const unitPrice =
                    Number(
                        item.unit_price || 0
                    );


                const lineTotal =
                    quantity *
                    unitPrice;


                return `

<div class="item-row">

    <div>

        <div class="item-name">

            ${esc(
                item.item_name ||
                "Food Item"
            )}

        </div>

        <div class="item-meta">

            ${quantity}
            ×
            ₹${unitPrice.toLocaleString(
                "en-IN"
            )}

        </div>

    </div>


    <div class="item-price">

        ₹${lineTotal.toLocaleString(
            "en-IN"
        )}

    </div>

</div>

`;

            }).join("");

    }


    modalBody.innerHTML = `

<div class="info-grid">


    <div class="info-box">

        <div class="info-label">
            Order ID
        </div>

        <div class="info-value">
            #${esc(order.id)}
        </div>

    </div>


    <div class="info-box">

        <div class="info-label">
            Date & Time
        </div>

        <div class="info-value">
            ${esc(date)}
        </div>

    </div>


    <div class="info-box">

        <div class="info-label">
            Customer ID
        </div>

        <div class="info-value">
            ${esc(
                order.customer_id ||
                "Customer"
            )}
        </div>

    </div>


    <div class="info-box">

        <div class="info-label">
            Current Status
        </div>

        <div class="info-value">

            ${status.charAt(0).toUpperCase()
              + status.slice(1)}

        </div>

    </div>


</div>



<div class="items-title">
    Ordered Items
</div>


${itemsHTML}


<div class="order-total">

    <span>
        Order Total
    </span>

    <span>
        ₹${total}
    </span>

</div>



<div class="status-area">

    <label>
        Update Order Status
    </label>


    <select
        id="modalStatus"
        class="status-select"
        onchange="updateModalStatus(this.value)">

        <option
            value="pending"
            ${status === "pending"
                ? "selected"
                : ""}>

            Pending

        </option>

        <option
            value="confirmed"
            ${status === "confirmed"
                ? "selected"
                : ""}>

            Confirmed

        </option>

        <option
            value="preparing"
            ${status === "preparing"
                ? "selected"
                : ""}>

            Preparing

        </option>

        <option
            value="delivered"
            ${status === "delivered"
                ? "selected"
                : ""}>

            Delivered

        </option>

        <option
            value="cancelled"
            ${status === "cancelled"
                ? "selected"
                : ""}>

            Cancelled

        </option>

    </select>

</div>

`;

}


/* =========================================
   UPDATE STATUS
========================================= */

async function updateStatus(
    orderId,
    newStatus
){

    try{

        const result =
            await sb
            .from("orders")
            .update({
                status:newStatus
            })
            .eq(
                "id",
                orderId
            );


        if(result.error){

            throw result.error;

        }


        const order =
            orders.find(
                function(item){
                    return Number(item.id) ===
                           Number(orderId);
                }
            );


        if(order){

            order.status =
                newStatus;

        }


        renderOrders();


        if(
            selectedOrder &&
            Number(selectedOrder.id) ===
            Number(orderId)
        ){

            selectedOrder.status =
                newStatus;

            const modalStatus =
                document.getElementById(
                    "modalStatus"
                );

            if(modalStatus){

                modalStatus.value =
                    newStatus;

            }

        }


    }

    catch(error){

        console.error(error);

        alert(
            "Status update failed: " +
            error.message
        );

        renderOrders();

    }

}


/* =========================================
   UPDATE MODAL STATUS
========================================= */

async function updateModalStatus(
    newStatus
){

    if(!selectedOrder){
        return;
    }


    await updateStatus(
        selectedOrder.id,
        newStatus
    );

}


/* =========================================
   CLOSE MODAL
========================================= */

function closeModal(){

    modal.classList.remove("show");

    selectedOrder = null;

}


function closeModalOutside(event){

    if(event.target === modal){

        closeModal();

    }

}


/* =========================================
   SEARCH
========================================= */

searchInput.addEventListener(
    "input",
    renderOrders
);


/* =========================================
   FILTER
========================================= */

filterInput.addEventListener(
    "change",
    renderOrders
);


/* =========================================
   LOGOUT
========================================= */

async function logout(){

    const confirmed =
        confirm(
            "Are you sure you want to logout?"
        );


    if(!confirmed){
        return;
    }


    await sb.auth.signOut();


    window.location.href =
        "login.html";

}


/* =========================================
   ESC KEY
========================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            closeModal();

        }

    }
);


/* =========================================
   START
========================================= */

loadOrders();

</script>
