<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>My Orders - Beatroot</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="../css/style.css">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f6f6f6;
    color:#171717;
}

.page{
    max-width:900px;
    margin:auto;
    min-height:100vh;
    background:#fff;
}

/* HEADER */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px;
    border-bottom:1px solid #eee;
    position:sticky;
    top:0;
    background:#fff;
    z-index:10;
}

.logo{
    font-size:27px;
    font-weight:800;
    color:#e53935;
}

.logo span{
    color:#171717;
}

.back{
    border:0;
    background:#f5f5f5;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

/* CONTENT */

.content{
    padding:25px 20px 40px;
}

.title{
    font-size:28px;
    margin:0 0 6px;
}

.subtitle{
    color:#777;
    margin:0 0 25px;
}

/* LOADING */

.loading{
    text-align:center;
    padding:50px 20px;
    color:#777;
}

.loading-icon{
    font-size:40px;
    margin-bottom:10px;
}

/* ERROR */

.error-box{
    display:none;
    background:#fff0f0;
    border:1px solid #ffd0d0;
    color:#c62828;
    padding:18px;
    border-radius:12px;
    margin-bottom:20px;
}

/* ORDER CARD */

.order-card{
    border:1px solid #e5e5e5;
    border-radius:16px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.order-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.order-id{
    font-weight:700;
    font-size:16px;
}

.status{
    padding:7px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
    text-transform:capitalize;
}

/* STATUS COLORS */

.status.delivered{
    background:#e8f7ed;
    color:#18864b;
}

.status.confirmed{
    background:#e8f7ed;
    color:#18864b;
}

.status.preparing{
    background:#fff4df;
    color:#b76b00;
}

.status.pending{
    background:#fff4df;
    color:#b76b00;
}

.status.out_for_delivery{
    background:#e8f0ff;
    color:#2457c5;
}

.status.cancelled{
    background:#ffe8e8;
    color:#d52d2d;
}

/* RESTAURANT */

.restaurant{
    font-size:18px;
    font-weight:700;
    margin-bottom:5px;
}

.date{
    font-size:13px;
    color:#777;
    margin-bottom:15px;
}

/* ITEMS */

.items{
    border-top:1px solid #eee;
    border-bottom:1px solid #eee;
    padding:12px 0;
}

.item{
    display:flex;
    justify-content:space-between;
    margin:8px 0;
    font-size:14px;
    gap:15px;
}

.item-name{
    color:#444;
}

.item-price{
    font-weight:600;
    white-space:nowrap;
}

/* BOTTOM */

.order-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:15px;
    gap:10px;
}

.total{
    font-size:18px;
    font-weight:800;
}

.actions{
    display:flex;
    gap:8px;
}

.btn{
    border:0;
    padding:9px 13px;
    border-radius:9px;
    cursor:pointer;
    font-weight:600;
    font-size:13px;
}

.view-btn{
    background:#f1f1f1;
    color:#222;
}

.reorder-btn{
    background:#e53935;
    color:white;
}

.track-btn{
    background:#171717;
    color:white;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:60px 20px;
    display:none;
}

.empty-icon{
    font-size:50px;
    margin-bottom:10px;
}

.empty h2{
    margin:10px 0;
}

.empty p{
    color:#777;
}

.home-btn{
    margin-top:15px;
    border:0;
    background:#e53935;
    color:#fff;
    padding:12px 20px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:600px){

    .content{
        padding:20px 15px 35px;
    }

    .title{
        font-size:24px;
    }

    .order-card{
        padding:15px;
    }

    .order-top{
        align-items:flex-start;
    }

    .order-bottom{
        flex-direction:column;
        align-items:flex-start;
    }

    .actions{
        width:100%;
    }

    .btn{
        flex:1;
    }

}

</style>

</head>


<body>

<div class="page">

    <!-- HEADER -->

    <header class="header">

        <button class="back" onclick="goHome()">
            ← Back
        </button>

        <div class="logo">
            Beat<span>root</span>
        </div>

        <div style="width:65px;"></div>

    </header>


    <!-- CONTENT -->

    <main class="content">

        <h1 class="title">
            My Orders
        </h1>

        <p class="subtitle">
            View and manage your previous orders
        </p>


        <!-- ERROR -->

        <div class="error-box" id="errorBox"></div>


        <!-- LOADING -->

        <div class="loading" id="loadingOrders">

            <div class="loading-icon">
                ⏳
            </div>

            <div>
                Loading your orders...
            </div>

        </div>


        <!-- ORDERS WILL APPEAR HERE -->

        <div id="ordersList"></div>


        <!-- EMPTY ORDERS -->

        <div class="empty" id="emptyOrders">

            <div class="empty-icon">
                📦
            </div>

            <h2>
                No Orders Yet
            </h2>

            <p>
                Your orders will appear here after you place an order.
            </p>

            <button class="home-btn"
                    onclick="goHome()">
                Start Ordering
            </button>

        </div>

    </main>

</div>


<script>

/* =========================================
   HOME
========================================= */

function goHome(){

    window.location.href = "home.html";

}


/* =========================================
   VIEW ORDER
========================================= */

function viewOrder(orderId){

    window.location.href =
        "order-confirmation.html?order=" +
        encodeURIComponent(orderId);

}


/* =========================================
   TRACK ORDER
========================================= */

function trackOrder(orderId){

    alert(
        "Tracking Order: " +
        orderId +
        "\n\nPlease check the current order status."
    );

}


/* =========================================
   REORDER
========================================= */

function reorder(orderId){

    const confirmReorder =
        confirm(
            "Would you like to reorder Order #" +
            orderId +
            "?"
        );

    if(confirmReorder){

        window.location.href = "cart.html";

    }

}


/* =========================================
   SUPABASE CONNECTION
========================================= */

const SUPABASE_URL =
    "https://jihjnsxazmftdqlitgk.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_r_zMn0-GhFNtuvs5-UOo9w_D8SW8J57";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================
   FORMAT DATE
========================================= */

function formatDate(dateString){

    if(!dateString){
        return "";
    }

    const date = new Date(dateString);

    return date.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    )
    +
    " • "
    +
    date.toLocaleTimeString(
        "en-IN",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================
   STATUS CLASS
========================================= */

function getStatusClass(status){

    if(!status){
        return "pending";
    }

    return String(status)
        .toLowerCase()
        .replace(/\s+/g,"_");

}


/* =========================================
   LOAD ORDERS
========================================= */

async function loadSupabaseOrders(){

    const loading =
        document.getElementById(
            "loadingOrders"
        );

    const ordersList =
        document.getElementById(
            "ordersList"
        );

    const emptyOrders =
        document.getElementById(
            "emptyOrders"
        );

    const errorBox =
        document.getElementById(
            "errorBox"
        );


    loading.style.display = "block";

    ordersList.innerHTML = "";

    emptyOrders.style.display = "none";

    errorBox.style.display = "none";


    try{

        /* ===============================
           GET LOGGED USER
        =============================== */

        const {
            data: {
                user
            },
            error: authError
        } =
        await supabaseClient
            .auth
            .getUser();


        if(authError){

            throw authError;

        }


        if(!user){

            loading.style.display = "none";

            emptyOrders.style.display = "block";

            return;

        }


        console.log(
            "Logged in user:",
            user.id
        );


        /* ===============================
           GET ORDERS
        =============================== */

        const {
            data: orders,
            error
        } =
        await supabaseClient

            .from("orders")

            .select(`
                id,
                status,
                total,
                delivery_address,
                latitude,
                longitude,
                created_at,

                order_items (
                    id,
                    item_name,
                    quantity,
                    unit_price
                )
            `)

            .eq(
                "customer_id",
                user.id
            )

            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(error){

            throw error;

        }


        console.log(
            "Orders from Supabase:",
            orders
        );


        loading.style.display = "none";


        /* ===============================
           NO ORDERS
        =============================== */

        if(
            !orders ||
            orders.length === 0
        ){

            emptyOrders.style.display =
                "block";

            return;

        }


        /* ===============================
           RENDER ORDERS
        =============================== */

        orders.forEach(
            order => {

                renderOrder(
                    order,
                    ordersList
                );

            }
        );


    }

    catch(error){

        console.error(
            "Orders loading error:",
            error
        );


        loading.style.display = "none";


        errorBox.style.display = "block";

        errorBox.innerHTML =
            "Orders load cheyyan kazhinjilla.<br><br>" +
            "<small>" +
            (
                error.message ||
                "Unknown error"
            ) +
            "</small>";

    }

}


/* =========================================
   RENDER ONE ORDER
========================================= */

function renderOrder(
    order,
    container
){

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "order-card";


    /* ===============================
       ORDER ID
    =============================== */

    const orderId =
        order.id;


    /* ===============================
       STATUS
    =============================== */

    const status =
        order.status ||
        "pending";


    const statusClass =
        getStatusClass(
            status
        );


    /* ===============================
       ITEMS
    =============================== */

    const items =
        order.order_items || [];


    let itemsHTML = "";


    if(items.length > 0){

        items.forEach(
            item => {

                const quantity =
                    item.quantity || 1;


                const price =
                    Number(
                        item.unit_price || 0
                    );


                const itemTotal =
                    quantity * price;


                itemsHTML += `

                    <div class="item">

                        <span class="item-name">

                            ${escapeHTML(
                                item.item_name ||
                                "Item"
                            )}

                            × ${quantity}

                        </span>

                        <span class="item-price">

                            ₹${itemTotal.toFixed(2)}

                        </span>

                    </div>

                `;

            }
        );

    }
    else{

        itemsHTML = `

            <div class="item">

                <span class="item-name">
                    Order items
                </span>

            </div>

        `;

    }


    /* ===============================
       TOTAL
    =============================== */

    const total =
        Number(
            order.total || 0
        );


    /* ===============================
       CARD
    =============================== */

    card.innerHTML = `

        <div class="order-top">

            <div class="order-id">

                Order #${escapeHTML(
                    String(orderId)
                )}

            </div>


            <div class="status ${statusClass}">

                ${escapeHTML(
                    String(status)
                )}

            </div>

        </div>


        <div class="restaurant">

            🍽️ Food Order

        </div>


        <div class="date">

            ${formatDate(
                order.created_at
            )}

        </div>


        <div class="items">

            ${itemsHTML}

        </div>


        <div class="order-bottom">

            <div class="total">

                Total:
                ₹${total.toFixed(2)}

            </div>


            <div class="actions">

                <button
                    class="btn view-btn"
                    onclick="viewOrder('${escapeJS(
                        String(orderId)
                    )}')">

                    View

                </button>


                <button
                    class="btn track-btn"
                    onclick="trackOrder('${escapeJS(
                        String(orderId)
                    )}')">

                    Track

                </button>


                <button
                    class="btn reorder-btn"
                    onclick="reorder('${escapeJS(
                        String(orderId)
                    )}')">

                    Reorder

                </button>

            </div>

        </div>

    `;


    container.appendChild(
        card
    );

}


/* =========================================
   SECURITY HELPERS
========================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeJS(value){

    return String(value)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,'\\"');

}


/* =========================================
   START
========================================= */

loadSupabaseOrders();

</script>

</body>

</html>
