<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>My Orders - Beatroot</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at 0% 0%,
            rgba(239,68,68,.08),
            transparent 30%
        ),
        radial-gradient(
            circle at 100% 100%,
            rgba(239,68,68,.06),
            transparent 30%
        ),
        #f6f7fb;

    color:#171717;
}


/* =========================================================
   PAGE
========================================================= */

.page{
    width:100%;
    max-width:1100px;
    min-height:100vh;
    margin:auto;
    background:#f6f7fb;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    height:76px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 28px;

    background:
        rgba(255,255,255,.94);

    backdrop-filter:blur(15px);

    border-bottom:
        1px solid #e8e8e8;

    position:sticky;

    top:0;

    z-index:50;
}

.logo{

    font-size:28px;

    font-weight:900;

    letter-spacing:-1.5px;

    color:#ef3f3f;
}

.logo span{
    color:#171717;
}


/* =========================================================
   HEADER USER
========================================================= */

.user-box{

    display:flex;

    align-items:center;

    gap:10px;
}

.user-avatar{

    width:38px;
    height:38px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #ef4444,
            #d92f2f
        );

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:800;

    font-size:14px;
}

.user-info{

    display:flex;

    flex-direction:column;

    line-height:1.2;
}

.user-name{

    font-size:13px;

    font-weight:800;
}

.user-email{

    font-size:11px;

    color:#777;

    max-width:180px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-btn{

    border:0;

    background:#f1f2f4;

    color:#222;

    padding:10px 15px;

    border-radius:11px;

    font-size:13px;

    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.back-btn:hover{

    background:#e8e9eb;

    transform:translateX(-2px);
}


/* =========================================================
   CONTENT
========================================================= */

.content{

    padding:32px 28px 60px;
}


/* =========================================================
   HERO
========================================================= */

.hero{

    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;
}

.hero h1{

    margin:0;

    font-size:34px;

    letter-spacing:-1px;
}

.hero p{

    margin:8px 0 0;

    color:#737373;

    font-size:14px;
}


/* =========================================================
   STATS
========================================================= */

.stats{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:14px;

    margin-bottom:22px;
}

.stat{

    background:white;

    border:1px solid #e7e7e7;

    border-radius:18px;

    padding:18px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.04);
}

.stat-label{

    color:#777;

    font-size:12px;

    margin-bottom:8px;
}

.stat-value{

    font-size:23px;

    font-weight:900;
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{

    background:white;

    border:1px solid #e6e6e6;

    border-radius:18px;

    padding:15px;

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:20px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.035);
}

.search-box{

    flex:1;

    position:relative;
}

.search-box input{

    width:100%;

    height:45px;

    border:1px solid #dedede;

    border-radius:11px;

    padding:0 14px 0 40px;

    outline:none;

    font-size:13px;

    background:#fafafa;

    transition:.2s;
}

.search-box input:focus{

    border-color:#ef4444;

    background:white;

    box-shadow:
        0 0 0 3px rgba(239,68,68,.08);
}

.search-icon{

    position:absolute;

    left:14px;

    top:50%;

    transform:translateY(-50%);

    color:#888;

    font-size:15px;
}

.filter{

    height:45px;

    border:1px solid #dedede;

    border-radius:11px;

    padding:0 13px;

    background:#fff;

    outline:none;

    cursor:pointer;

    font-size:13px;
}

.refresh-btn{

    height:45px;

    padding:0 16px;

    border:0;

    border-radius:11px;

    background:#171717;

    color:white;

    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.refresh-btn:hover{

    background:#2c2c2c;
}


/* =========================================================
   ERROR
========================================================= */

.error-box{

    display:none;

    background:#fff0f0;

    border:1px solid #ffcaca;

    color:#c62828;

    padding:16px;

    border-radius:14px;

    margin-bottom:20px;

    font-size:13px;

    line-height:1.5;
}


/* =========================================================
   LOADING
========================================================= */

.loading{

    display:none;

    gap:15px;

    flex-direction:column;
}

.skeleton{

    height:185px;

    border-radius:18px;

    background:
        linear-gradient(
            90deg,
            #eeeeee 25%,
            #f8f8f8 50%,
            #eeeeee 75%
        );

    background-size:400% 100%;

    animation:
        loading 1.4s infinite;
}

@keyframes loading{

    0%{
        background-position:100% 0;
    }

    100%{
        background-position:-100% 0;
    }
}


/* =========================================================
   ORDERS GRID
========================================================= */

.orders-list{

    display:flex;

    flex-direction:column;

    gap:16px;
}


/* =========================================================
   ORDER CARD
========================================================= */

.order-card{

    background:white;

    border:1px solid #e6e6e6;

    border-radius:20px;

    padding:20px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.045);

    transition:.25s;
}

.order-card:hover{

    transform:translateY(-2px);

    box-shadow:
        0 15px 40px rgba(0,0,0,.07);
}


/* =========================================================
   ORDER HEADER
========================================================= */

.order-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    padding-bottom:16px;

    border-bottom:1px solid #eeeeee;
}

.order-number{

    font-size:16px;

    font-weight:900;
}

.order-date{

    color:#888;

    font-size:12px;

    margin-top:5px;
}


/* =========================================================
   STATUS
========================================================= */

.status{

    display:inline-flex;

    align-items:center;

    gap:6px;

    padding:7px 11px;

    border-radius:30px;

    font-size:11px;

    font-weight:800;

    text-transform:capitalize;

    white-space:nowrap;
}

.status-dot{

    width:6px;

    height:6px;

    border-radius:50%;

    background:currentColor;
}

.status.pending{

    background:#fff4d8;

    color:#a96b00;
}

.status.confirmed{

    background:#e7f0ff;

    color:#2563eb;
}

.status.preparing{

    background:#fff0df;

    color:#d05b00;
}

.status.out_for_delivery{

    background:#e9edff;

    color:#4f46e5;
}

.status.delivered{

    background:#e6f8ed;

    color:#168044;
}

.status.cancelled{

    background:#ffe8e8;

    color:#d32f2f;
}


/* =========================================================
   ITEMS
========================================================= */

.items{

    padding:16px 0;

    border-bottom:1px solid #eeeeee;
}

.item{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    padding:7px 0;

    font-size:13px;
}

.item-left{

    display:flex;

    align-items:center;

    gap:10px;

    min-width:0;
}

.item-quantity{

    min-width:27px;

    height:27px;

    border-radius:8px;

    background:#f3f3f3;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:11px;

    font-weight:800;
}

.item-name{

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    color:#444;
}

.item-price{

    font-weight:800;

    white-space:nowrap;
}


/* =========================================================
   ORDER FOOTER
========================================================= */

.order-footer{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    padding-top:16px;
}

.total-label{

    color:#777;

    font-size:12px;
}

.total-value{

    font-size:21px;

    font-weight:900;

    margin-top:3px;
}

.actions{

    display:flex;

    align-items:center;

    gap:8px;
}

.btn{

    border:0;

    padding:10px 14px;

    border-radius:10px;

    font-size:12px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;
}

.view-btn{

    background:#f1f2f4;

    color:#222;
}

.view-btn:hover{

    background:#e4e5e7;
}

.track-btn{

    background:#171717;

    color:white;
}

.track-btn:hover{

    background:#303030;
}

.reorder-btn{

    background:#ef3f3f;

    color:white;
}

.reorder-btn:hover{

    background:#d93232;
}


/* =========================================================
   EMPTY
========================================================= */

.empty{

    display:none;

    background:white;

    border:1px solid #e7e7e7;

    border-radius:20px;

    padding:65px 25px;

    text-align:center;
}

.empty-icon{

    width:70px;

    height:70px;

    margin:auto;

    border-radius:50%;

    background:#fff0f0;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:30px;
}

.empty h2{

    margin:18px 0 8px;

    font-size:22px;
}

.empty p{

    margin:0;

    color:#777;

    font-size:13px;
}

.home-btn{

    margin-top:20px;

    border:0;

    background:#ef3f3f;

    color:white;

    padding:12px 20px;

    border-radius:11px;

    font-weight:800;

    cursor:pointer;
}


/* =========================================================
   LOGIN REQUIRED
========================================================= */

.login-required{

    display:none;

    background:white;

    border:1px solid #e7e7e7;

    border-radius:20px;

    padding:60px 25px;

    text-align:center;
}

.login-required .icon{

    font-size:45px;

    margin-bottom:15px;
}

.login-required h2{

    margin:0 0 8px;
}

.login-required p{

    margin:0;

    color:#777;

    font-size:13px;
}

.login-btn{

    margin-top:20px;

    border:0;

    background:#ef3f3f;

    color:white;

    padding:12px 22px;

    border-radius:11px;

    font-weight:800;

    cursor:pointer;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:750px){

    .header{

        padding:0 15px;
    }

    .content{

        padding:22px 15px 45px;
    }

    .hero{

        align-items:flex-start;

        flex-direction:column;
    }

    .hero h1{

        font-size:28px;
    }

    .stats{

        grid-template-columns:1fr;
    }

    .toolbar{

        flex-direction:column;

        align-items:stretch;
    }

    .filter,
    .refresh-btn{

        width:100%;
    }

    .order-header{

        align-items:flex-start;

        flex-direction:column;
    }

    .order-footer{

        align-items:flex-start;

        flex-direction:column;
    }

    .actions{

        width:100%;
    }

    .btn{

        flex:1;
    }

    .user-email{

        display:none;
    }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media(max-width:430px){

    .logo{

        font-size:24px;
    }

    .back-btn{

        padding:9px 11px;

        font-size:12px;
    }

    .user-name{

        display:none;
    }

    .order-card{

        padding:16px;
    }

    .actions{

        flex-wrap:wrap;
    }

    .btn{

        min-width:calc(50% - 5px);
    }

}

</style>

</head>


<body>


<div class="page">


    <!-- =====================================================
         HEADER
    ====================================================== -->

        </div>

            <div

                id="userAvatar">

                U

            </div>

            <div class="user-info">

                    class="user-name"
                    id="userName">

                    Customer

                </div>

                <div
                    class="user-email"

        <!-- =================================================

        ================================================== -->

                <div

            </div>


            <div class="stat">

                <div class="stat-label">

                </div>

                    class="stat-value"

            </div>


            <select
                id="statusFilter"

                <option value="">
                    All Orders

                <option value="pending">
                    Pending
                </option>

                <option value="confirmed">
                    Confirmed
                </option>

                <option value="preparing">

                <option value="out_for_delivery">

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://jhihjnsxazmftdqlitgk.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_r_zMn0-GhFNtuvs5-UOo9w_D8SW8J57";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
            auth:{
                persistSession:true,
                autoRefreshToken:true,
                detectSessionInUrl:true
            }
        }
    );


/* =========================================================
   GLOBAL
========================================================= */

let allOrders = [];

let currentUser = null;


/* =========================================================
   NAVIGATION
========================================================= */

function goHome(){

    window.location.href =
        "../index.html";

}


function goLogin(){

    window.location.href =
        "login.html";

}


function viewOrder(orderId){

    window.location.href =
        "order-confirmation.html?order=" +
        encodeURIComponent(orderId);

}


function trackOrder(orderId){

    window.location.href =
        "order-confirmation.html?order=" +
        encodeURIComponent(orderId) +
        "&track=true";

}


/* =========================================================
   REORDER
========================================================= */

async function reorder(orderId){

    try{

        const order =
            allOrders.find(
                o => String(o.id) === String(orderId)
            );


        if(!order){

            alert(
                "Order details not found."
            );

            return;
        }


        const items =
            order.order_items || [];


        if(!items.length){

            alert(
                "This order has no items to reorder."
            );

            return;
        }


        /*
         * Save order items temporarily.
         * cart.html can read this data.
         */

        const cartItems =
            items.map(item => ({

                id:
                    item.menu_item_id ||
                    null,

                menu_item_id:
                    item.menu_item_id ||
                    null,

                item_name:
                    item.item_name ||
                    "Item",

                quantity:
                    Number(item.quantity || 1),

                unit_price:
                    Number(item.unit_price || 0)

            }));


        localStorage.setItem(
            "beatroot_reorder",
            JSON.stringify(cartItems)
        );


        alert(
            "Items added for reorder. Opening cart..."
        );


        window.location.href =
            "cart.html";

    }
    catch(error){

        console.error(
            "Reorder error:",
            error
        );

        alert(
            "Reorder cheyyan kazhinjilla."
        );

    }

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(dateString){

    if(!dateString){

        return "-";

    }


    const date =
        new Date(dateString);


    return date.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    )
    +
    " • "
    +
    date.toLocaleTimeString(
        "en-IN",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   NORMALIZE STATUS
========================================================= */

function normalizeStatus(status){

    const s =
        String(
            status ||
            "pending"
        )
        .toLowerCase()
        .trim();


    if(s === "processing"){
        return "preparing";
    }


    if(s === "completed"){
        return "delivered";
    }


    if(s === "canceled"){
        return "cancelled";
    }


    return s;

}


/* =========================================================
   STATUS LABEL
========================================================= */

function statusLabel(status){

    const s =
        normalizeStatus(status);


    const labels = {

        pending:
            "Pending",

        confirmed:
            "Confirmed",

        preparing:
            "Preparing",

        out_for_delivery:
            "Out for Delivery",

        delivered:
            "Delivered",

        cancelled:
            "Cancelled"

    };


    return labels[s] ||
        (
            s.charAt(0).toUpperCase() +
            s.slice(1)
        );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            function(match){

                return {

                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    '"':"&quot;",
                    "'":"&#039;"

                }[match];

            }
        );

}


/* =========================================================
   GET SESSION
========================================================= */

async function getCurrentUser(){

    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .getSession();


    if(error){

        throw error;

    }


    return data.session
        ? data.session.user
        : null;

}


/* =========================================================
   LOAD ORDERS
========================================================= */

async function loadOrders(){

    const loading =
        document.getElementById(
            "loadingOrders"
        );

    const ordersList =
        document.getElementById(
            "ordersList"
        );

    const empty =
        document.getElementById(
            "emptyOrders"
        );

    const errorBox =
        document.getElementById(
            "errorBox"
        );

    const loginRequired =
        document.getElementById(
            "loginRequired"
        );


    loading.style.display =
        "flex";

    ordersList.innerHTML =
        "";

    empty.style.display =
        "none";

    errorBox.style.display =
        "none";

    loginRequired.style.display =
        "none";


    try{

        /* =============================================
           SESSION
        ============================================== */

        currentUser =
            await getCurrentUser();


        if(!currentUser){

            loading.style.display =
                "none";

            loginRequired.style.display =
                "block";

            return;

        }


        updateUserUI(
            currentUser
        );


        /* =============================================
           ORDERS
        ============================================== */

        const {
            data:orders,
            error
        } =
            await supabaseClient

                .from("orders")

                .select(`
                    id,
                    status,
                    total,
                    customer_id,
                    delivery_address,
                    latitude,
                    longitude,
                    created_at,

                    order_items (
                        id,
                        order_id,
                        menu_item_id,
                        item_name,
                        quantity,
                        unit_price
                    )
                `)

                .eq(
                    "customer_id",
                    currentUser.id
                )

                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );


        if(error){

            throw error;

        }


        allOrders =
            orders || [];


        console.log(
            "My Orders:",
            allOrders
        );


        updateStats(
            allOrders
        );


        loading.style.display =
            "none";


        renderOrders();


    }
    catch(error){

        console.error(
            "My Orders Error:",
            error
        );


        loading.style.display =
            "none";


        errorBox.style.display =
            "block";


        errorBox.innerHTML = `

            <strong>
                Orders load cheyyan kazhinjilla.
            </strong>

            <br><br>

            ${escapeHTML(
                error.message ||
                "Unknown error"
            )}

            <br><br>

            <small>
                Please refresh the page and try again.
            </small>

        `;

    }

}


/* =========================================================
   UPDATE USER UI
========================================================= */

function updateUserUI(user){

    const email =
        user.email ||
        "";


    const userName =
        email
            ? email.split("@")[0]
            : "Customer";


    document.getElementById(
        "userName"
    ).textContent =
        userName;


    document.getElementById(
        "userEmail"
    ).textContent =
        email;


    document.getElementById(
        "userAvatar"
    ).textContent =
        userName
            .charAt(0)
            .toUpperCase();

}


/* =========================================================
   UPDATE STATS
========================================================= */

function updateStats(orders){

    const total =
        orders.length;


    const active =
        orders.filter(
            order => {

                const s =
                    normalizeStatus(
                        order.status
                    );

                return ![
                    "delivered",
                    "cancelled"
                ].includes(s);

            }
        ).length;


    const spent =
        orders.reduce(
            (sum, order) => {

                return sum +
                    Number(
                        order.total || 0
                    );

            },
            0
        );


    document.getElementById(
        "totalOrders"
    ).textContent =
        total;


    document.getElementById(
        "activeOrders"
    ).textContent =
        active;


    document.getElementById(
        "totalSpent"
    ).textContent =
        "₹" +
        spent.toLocaleString(
            "en-IN"
        );

}


/* =========================================================
   RENDER ORDERS
========================================================= */

function renderOrders(){

    const ordersList =
        document.getElementById(
            "ordersList"
        );

    const empty =
        document.getElementById(
            "emptyOrders"
        );


    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


    const filter =
        document.getElementById(
            "statusFilter"
        )
        .value;


    const filtered =
        allOrders.filter(
            order => {

                const idMatch =
                    String(order.id)
                        .toLowerCase()
                        .includes(search);


                const status =
                    normalizeStatus(
                        order.status
                    );


                const statusMatch =
                    !filter ||
                    status === filter;


                return (
                    idMatch &&
                    statusMatch
                );

            }
        );


    ordersList.innerHTML =
        "";


    if(!filtered.length){

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    filtered.forEach(
        order => {

            ordersList.appendChild(
                createOrderCard(
                    order
                )
            );

        }
    );

}


/* =========================================================
   CREATE ORDER CARD
========================================================= */

function createOrderCard(order){

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "order-card";


    const status =
        normalizeStatus(
            order.status
        );


    const items =
        order.order_items ||
        [];


    const total =
        Number(
            order.total || 0
        );


    let itemsHTML =
        "";


    if(items.length){

        items.forEach(
            item => {

                const qty =
                    Number(
                        item.quantity || 1
                    );


                const price =
                    Number(
                        item.unit_price || 0
                    );


                const itemTotal =
                    qty * price;


                itemsHTML += `

                    <div class="item">

                        <div class="item-left">

                            <div class="item-quantity">

                                ${qty}

                            </div>

                            <div class="item-name">

                                ${escapeHTML(
                                    item.item_name ||
                                    "Food Item"
                                )}

                            </div>

                        </div>


                        <div class="item-price">

                            ₹${itemTotal.toLocaleString(
                                "en-IN"
                            )}

                        </div>

                    </div>

                `;

            }
        );

    }
    else{

        itemsHTML = `

            <div class="item">

                <div class="item-left">

                    <div class="item-quantity">
                        1
                    </div>

                    <div class="item-name">
                        Order items
                    </div>

                </div>

            </div>

        `;

    }


    card.innerHTML = `

        <!-- ORDER HEADER -->

        <div class="order-header">

            <div>

                <div class="order-number">

                    Order #${escapeHTML(
                        String(order.id)
                    )}

                </div>

                <div class="order-date">

                    ${formatDate(
                        order.created_at
                    )}

                </div>

            </div>


            <div
                class="status ${escapeHTML(status)}">

                <span class="status-dot"></span>

                ${escapeHTML(
                    statusLabel(status)
                )}

            </div>

        </div>



        <!-- ITEMS -->

        <div class="items">

            ${itemsHTML}

        </div>



        <!-- FOOTER -->

        <div class="order-footer">

            <div>

                <div class="total-label">
                    Order Total
                </div>

                <div class="total-value">

                    ₹${total.toLocaleString(
                        "en-IN"
                    )}

                </div>

            </div>


            <div class="actions">

                <button
                    class="btn view-btn"
                    data-action="view">

                    View

                </button>


                <button
                    class="btn track-btn"
                    data-action="track">

                    Track

                </button>


                <button
                    class="btn reorder-btn"
                    data-action="reorder">

                    Reorder

                </button>

            </div>

        </div>

    `;


    /* =====================================================
       BUTTON EVENTS
    ====================================================== */

    card
        .querySelector(
            '[data-action="view"]'
        )
        .addEventListener(
            "click",
            function(){

                viewOrder(
                    order.id
                );

            }
        );


    card
        .querySelector(
            '[data-action="track"]'
        )
        .addEventListener(
            "click",
            function(){

                trackOrder(
                    order.id
                );

            }
        );


    card
        .querySelector(
            '[data-action="reorder"]'
        )
        .addEventListener(
            "click",
            function(){

                reorder(
                    order.id
                );

            }
        );


    return card;

}


/* =========================================================
   SEARCH
========================================================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        function(){

            renderOrders();

        }
    );


/* =========================================================
   FILTER
========================================================= */

document
    .getElementById(
        "statusFilter"
    )
    .addEventListener(
        "change",
        function(){

            renderOrders();

        }
    );


/* =========================================================
   AUTH STATE CHANGE
========================================================= */

supabaseClient
    .auth
    .onAuthStateChange(
        function(
            event,
            session
        ){

            console.log(
                "Auth event:",
                event
            );


            if(
                event ===
                "SIGNED_IN"
            ){

                loadOrders();

            }


            if(
                event ===
                "SIGNED_OUT"
            ){

                window.location.href =
                    "login.html";

            }

        }
    );


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadOrders();

    }
);

</script>
