<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Checkout - Beatroot</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Inter,Arial,Helvetica,sans-serif;
    background:#f7f8fc;
    color:#171717;
}


/* REMOVE UNDERLINES */

a,
a:link,
a:visited,
a:hover,
a:active,
a:focus{
    text-decoration:none !important;
}


/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;

    height:72px;

    background:rgba(255,255,255,.95);
    backdrop-filter:blur(14px);

    border-bottom:1px solid #eeeeee;
}

.header-inner{
    max-width:1200px;
    height:100%;
    margin:auto;
    padding:0 22px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:29px;
    font-weight:900;
    letter-spacing:-1.5px;
    color:#ef3e3e;
}

.logo span{
    color:#171717;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.back-btn,
.cart-btn{
    border:0;
    border-radius:10px;
    padding:10px 15px;

    font-size:14px;
    font-weight:700;

    cursor:pointer;
}

.back-btn{
    background:#f1f2f5;
    color:#222;
}

.cart-btn{
    background:#ef3e3e;
    color:#fff;
}


/* =========================
   PAGE
========================= */

.container{
    max-width:1200px;
    margin:auto;
    padding:40px 22px 70px;
}

.page-title{
    font-size:38px;
    font-weight:850;
    letter-spacing:-1px;
    margin-bottom:8px;
}

.page-subtitle{
    color:#777;
    font-size:15px;
    margin-bottom:30px;
}


/* =========================
   LAYOUT
========================= */

.checkout-layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 360px;
    gap:24px;
    align-items:start;
}

.card{
    background:#fff;
    border:1px solid #e7e7e7;
    border-radius:20px;
    padding:25px;

    box-shadow:0 8px 30px rgba(0,0,0,.05);
}


/* =========================
   SECTION
========================= */

.section-title{
    font-size:20px;
    font-weight:800;
    margin-bottom:20px;
}

.section-subtitle{
    color:#777;
    font-size:13px;
    margin-top:-12px;
    margin-bottom:20px;
}


/* =========================
   FORM
========================= */

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{

    width:100%;

    border:1px solid #dedede;
    border-radius:11px;

    padding:13px 14px;

    background:#fff;

    outline:none;

    font-family:inherit;
    font-size:14px;

    transition:.2s;
}

.form-group textarea{
    min-height:95px;
    resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{

    border-color:#ef3e3e;

    box-shadow:
        0 0 0 3px rgba(239,62,62,.08);
}


/* =========================
   TWO COLUMN FORM
========================= */

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}


/* =========================
   PAYMENT
========================= */

.payment-options{
    display:grid;
    gap:10px;
}

.payment-option{

    border:1px solid #e2e2e2;

    border-radius:12px;

    padding:14px;

    display:flex;
    align-items:center;

    gap:12px;

    cursor:pointer;

    transition:.2s;
}

.payment-option:hover{
    border-color:#ef3e3e;
    background:#fffafa;
}

.payment-option input{
    accent-color:#ef3e3e;
}

.payment-info strong{
    display:block;
    font-size:14px;
    margin-bottom:3px;
}

.payment-info span{
    color:#777;
    font-size:12px;
}


/* =========================
   ORDER ITEMS
========================= */

.order-items{
    margin-top:10px;
}

.order-item{

    display:flex;
    align-items:center;

    gap:12px;

    padding:13px 0;

    border-bottom:1px solid #eeeeee;
}

.order-item:last-child{
    border-bottom:none;
}

.item-image{

    width:58px;
    height:58px;

    object-fit:cover;

    border-radius:10px;

    background:#f1f1f1;

    flex-shrink:0;
}

.item-details{
    flex:1;
    min-width:0;
}

.item-name{
    font-size:14px;
    font-weight:750;
    margin-bottom:4px;
}

.item-meta{
    color:#777;
    font-size:12px;
}

.item-price{
    font-size:14px;
    font-weight:800;
    white-space:nowrap;
}


/* =========================
   SUMMARY
========================= */

.summary{
    position:sticky;
    top:95px;
}

.summary h2{
    font-size:21px;
    margin-bottom:18px;
}

.summary-row{

    display:flex;

    justify-content:space-between;

    padding:9px 0;

    color:#555;

    font-size:14px;
}

.summary-total{

    border-top:1px solid #e5e5e5;

    margin-top:10px;

    padding-top:18px;

    display:flex;

    justify-content:space-between;

    font-size:21px;

    font-weight:850;

    color:#111;
}


/* =========================
   PLACE ORDER
========================= */

.place-order{

    width:100%;

    height:54px;

    margin-top:22px;

    border:0;

    border-radius:12px;

    background:#ef3e3e;

    color:#fff;

    font-size:15px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;
}

.place-order:hover{
    background:#d93434;
    transform:translateY(-1px);
}

.place-order:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}


/* =========================
   SECURITY NOTE
========================= */

.secure-note{

    text-align:center;

    color:#777;

    font-size:12px;

    margin-top:13px;

    line-height:1.5;
}


/* =========================
   MESSAGE
========================= */

.message{

    display:none;

    padding:14px 16px;

    border-radius:11px;

    margin-bottom:20px;

    font-size:14px;

    line-height:1.5;
}

.message.error{

    display:block;

    background:#fff0f0;

    color:#c62828;

    border:1px solid #ffd0d0;
}

.message.success{

    display:block;

    background:#effaf3;

    color:#16803c;

    border:1px solid #c9efd7;
}


/* =========================
   LOADING
========================= */

.loading{

    text-align:center;

    padding:70px 20px;

    color:#777;
}

.spinner{

    width:36px;
    height:36px;

    border:4px solid #eee;

    border-top-color:#ef3e3e;

    border-radius:50%;

    margin:0 auto 15px;

    animation:spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================
   EMPTY
========================= */

.empty{

    text-align:center;

    padding:70px 20px;
}

.empty-icon{

    font-size:55px;

    margin-bottom:15px;
}

.empty h2{

    font-size:24px;

    margin-bottom:8px;
}

.empty p{

    color:#777;

    margin-bottom:22px;
}

.shop-btn{

    display:inline-block;

    background:#ef3e3e;

    color:#fff;

    padding:13px 22px;

    border-radius:10px;

    font-weight:700;
}


/* =========================
   MOBILE
========================= */

@media(max-width:850px){

    .checkout-layout{
        grid-template-columns:1fr;
    }

    .summary{
        position:static;
    }

}

@media(max-width:600px){

    .header{
        height:64px;
    }

    .header-inner{
        padding:0 15px;
    }

    .logo{
        font-size:25px;
    }

    .back-btn,
    .cart-btn{
        padding:9px 11px;
        font-size:12px;
    }

    .container{
        padding:25px 15px 50px;
    }

    .page-title{
        font-size:30px;
    }

    .card{
        padding:18px;
        border-radius:17px;
    }

    .form-row{
        grid-template-columns:1fr;
        gap:0;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="header-inner">

        <a href="../index.html" class="logo">
            Beat<span>root</span>
        </a>

        <div class="header-right">

            <button
                class="back-btn"
                onclick="goBack()">

                ← Back

            </button>

            <button
                class="cart-btn"
                onclick="goCart()">

                🛒 Cart
                (<span id="cartCount">0</span>)

            </button>

        </div>

    </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="container">

    <h1 class="page-title">
        Checkout
    </h1>

    <p class="page-subtitle">
        Complete your details and place your order
    </p>


    <div
        id="message"
        class="message">
    </div>


    <div
        id="checkoutArea">

        <div class="loading">

            <div class="spinner"></div>

            Loading checkout...

        </div>

    </div>

</main>



<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://jhihjnsxazmftdqlitgk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_r_zMn0-GhFNtuvs5-UOo9w_D8SW8J57";

const sb =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   GLOBAL
========================================= */

let currentUser = null;

let cart = [];

let subtotal = 0;

let deliveryFee = 0;

let totalAmount = 0;


/* =========================================
   MESSAGE
========================================= */

function showMessage(
    text,
    type = "error"
){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message " + type;

}

function hideMessage(){

    const box =
        document.getElementById("message");

    box.textContent = "";

    box.className = "message";

}


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================
   AUTH
========================================= */

async function checkUser(){

    const result =
        await sb.auth.getUser();

    if(
        result.error ||
        !result.data.user
    ){

        window.location.href =
            "login.html";

        return false;

    }

    currentUser =
        result.data.user;

    return true;

}


/* =========================================
   LOAD CART
========================================= */

async function loadCart(){

    hideMessage();

    const authenticated =
        await checkUser();

    if(!authenticated){
        return;
    }


    const result =
        await sb
        .from("cart_items")
        .select(`
            id,
            quantity,
            menu_item_id,
            menu_items (
                id,
                restaurant_id,
                name,
                description,
                price,
                image_url,
                restaurants (
                    id,
                    name
                )
            )
        `)
        .eq(
            "customer_id",
            currentUser.id
        )
        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(result.error){

        console.error(result.error);

        showMessage(
            "Cart load cheyyan kazhinjilla. " +
            result.error.message
        );

        return;

    }


    cart =
        result.data || [];


    if(cart.length === 0){

        renderEmpty();

        return;

    }


    calculateTotals();

    renderCheckout();

}


/* =========================================
   CALCULATE TOTAL
========================================= */

function calculateTotals(){

    subtotal = 0;


    cart.forEach(item => {

        const food =
            item.menu_items;

        if(!food){
            return;
        }

        const price =
            Number(food.price || 0);

        const quantity =
            Number(item.quantity || 1);

        subtotal +=
            price * quantity;

    });


    /*
       Current delivery rule:
       ₹40 below ₹500
       FREE at ₹500+
    */

    deliveryFee =
        subtotal >= 500
            ? 0
            : 40;


    totalAmount =
        subtotal + deliveryFee;

}


/* =========================================
   CART COUNT
========================================= */

function updateCartCount(){

    const count =
        cart.reduce(
            (sum,item) =>
                sum +
                Number(item.quantity || 0),
            0
        );


    document.getElementById(
        "cartCount"
    ).textContent = count;

}


/* =========================================
   EMPTY
========================================= */

function renderEmpty(){

    updateCartCount();

    document.getElementById(
        "checkoutArea"
    ).innerHTML = `

        <div class="card empty">

            <div class="empty-icon">
                🛒
            </div>

            <h2>
                Your cart is empty
            </h2>

            <p>
                Add some delicious food
                before checkout.
            </p>

            <a
                href="restaurants.html"
                class="shop-btn">

                Browse Restaurants

            </a>

        </div>

    `;

}


/* =========================================
   RENDER CHECKOUT
========================================= */

function renderCheckout(){

    updateCartCount();


    let itemsHTML = "";


    cart.forEach(item => {

        const food =
            item.menu_items;

        if(!food){
            return;
        }


        const price =
            Number(food.price || 0);

        const quantity =
            Number(item.quantity || 1);

        const itemTotal =
            price * quantity;


        const image =
            food.image_url ||
            "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=400&q=80";


        itemsHTML += `

            <div class="order-item">

                <img
                    class="item-image"
                    src="${escapeHTML(image)}"
                    alt="${escapeHTML(food.name)}"
                >

                <div class="item-details">

                    <div class="item-name">
                        ${escapeHTML(food.name)}
                    </div>

                    <div class="item-meta">

                        ${quantity}
                        ×
                        ₹${price.toFixed(2)}

                    </div>

                </div>

                <div class="item-price">

                    ₹${itemTotal.toFixed(2)}

                </div>

            </div>

        `;

    });


    document.getElementById(
        "checkoutArea"
    ).innerHTML = `

        <div class="checkout-layout">


            <!-- CUSTOMER DETAILS -->

            <div>


                <div class="card">

                    <h2 class="section-title">
                        Delivery Details
                    </h2>

                    <p class="section-subtitle">
                        Enter the details needed for delivery.
                    </p>


                    <div class="form-row">

                        <div class="form-group">

                            <label for="customerName">
                                Full Name
                            </label>

                            <input
                                id="customerName"
                                type="text"
                                placeholder="Enter your name"
                                autocomplete="name"
                            >

                        </div>


                        <div class="form-group">

                            <label for="customerPhone">
                                Phone Number
                            </label>

                            <input
                                id="customerPhone"
                                type="tel"
                                placeholder="Enter phone number"
                                autocomplete="tel"
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="deliveryAddress">
                            Delivery Address
                        </label>

                        <textarea
                            id="deliveryAddress"
                            placeholder="House name, street, area, town..."
                            autocomplete="street-address"
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label for="orderNotes">
                            Order Notes
                            <span style="font-weight:400;color:#999;">
                                (Optional)
                            </span>
                        </label>

                        <textarea
                            id="orderNotes"
                            placeholder="Any special instructions..."
                        ></textarea>

                    </div>

                </div>



                <!-- PAYMENT -->

                <div
                    class="card"
                    style="margin-top:20px;">

                    <h2 class="section-title">
                        Payment Method
                    </h2>

                    <div class="payment-options">


                        <label class="payment-option">

                            <input
                                type="radio"
                                name="paymentMethod"
                                value="cod"
                                checked
                            >

                            <div class="payment-info">

                                <strong>
                                    Cash on Delivery
                                </strong>

                                <span>
                                    Pay when your order is delivered.
                                </span>

                            </div>

                        </label>


                        <label class="payment-option">

                            <input
                                type="radio"
                                name="paymentMethod"
                                value="online"
                            >

                            <div class="payment-info">

                                <strong>
                                    Online Payment
                                </strong>

                                <span>
                                    Online payment option can be connected later.
                                </span>

                            </div>

                        </label>


                    </div>

                </div>



                <!-- ORDER ITEMS -->

                <div
                    class="card"
                    style="margin-top:20px;">

                    <h2 class="section-title">
                        Your Items
                    </h2>

                    <div class="order-items">

                        ${itemsHTML}

                    </div>

                </div>


            </div>



            <!-- SUMMARY -->

            <div class="card summary">

                <h2>
                    Order Summary
                </h2>


                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <strong>
                        ₹${subtotal.toFixed(2)}
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Delivery Fee
                    </span>

                    <strong>

                        ${
                            deliveryFee === 0
                            ? "FREE"
                            : "₹" +
                              deliveryFee.toFixed(2)
                        }

                    </strong>

                </div>


                <div class="summary-total">

                    <span>
                        Total
                    </span>

                    <span>
                        ₹${totalAmount.toFixed(2)}
                    </span>

                </div>


                <button
                    id="placeOrderBtn"
                    class="place-order"
                    onclick="placeOrder()">

                    Place Order

                </button>


                <div class="secure-note">

                    🔒 Your order details are securely
                    stored in Beatroot.

                </div>

            </div>


        </div>

    `;


    loadUserProfile();

}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadUserProfile(){

    if(!currentUser){
        return;
    }


    const result =
        await sb
        .from("profiles")
        .select(
            "full_name,phone"
        )
        .eq(
            "id",
            currentUser.id
        )
        .maybeSingle();


    if(result.error){

        console.log(
            "Profile load:",
            result.error
        );

        return;

    }


    if(!result.data){
        return;
    }


    const nameInput =
        document.getElementById(
            "customerName"
        );

    const phoneInput =
        document.getElementById(
            "customerPhone"
        );


    if(
        nameInput &&
        result.data.full_name
    ){

        nameInput.value =
            result.data.full_name;

    }


    if(
        phoneInput &&
        result.data.phone
    ){

        phoneInput.value =
            result.data.phone;

    }

}


/* =========================================
   PLACE ORDER
========================================= */

async function placeOrder(){

    hideMessage();


    if(!currentUser){

        showMessage(
            "Please login before placing an order."
        );

        return;

    }


    if(cart.length === 0){

        showMessage(
            "Your cart is empty."
        );

        return;

    }


    const name =
        document
        .getElementById(
            "customerName"
        )
        .value
        .trim();


    const phone =
        document
        .getElementById(
            "customerPhone"
        )
        .value
        .trim();


    const address =
        document
        .getElementById(
            "deliveryAddress"
        )
        .value
        .trim();


    const notes =
        document
        .getElementById(
            "orderNotes"
        )
        .value
        .trim();


    const paymentRadio =
        document.querySelector(
            'input[name="paymentMethod"]:checked'
        );


    const paymentMethod =
        paymentRadio
        ? paymentRadio.value
        : "cod";


    /* VALIDATION */

    if(!name){

        showMessage(
            "Please enter your name."
        );

        return;

    }


    if(!phone){

        showMessage(
            "Please enter your phone number."
        );

        return;

    }


    if(!/^[0-9+\-\s]{7,15}$/.test(phone)){

        showMessage(
            "Please enter a valid phone number."
        );

        return;

    }


    if(!address){

        showMessage(
            "Please enter your delivery address."
        );

        return;

    }


    /* BUTTON */

    const button =
        document.getElementById(
            "placeOrderBtn"
        );


    button.disabled = true;

    button.textContent =
        "Placing Order...";


    try{


        /* =================================
           FIND RESTAURANT
        ================================= */

        const firstFood =
            cart.find(
                item => item.menu_items
            )?.menu_items;


        if(!firstFood){

            throw new Error(
                "Cart items are invalid."
            );

        }


        const restaurantId =
            firstFood.restaurant_id;


        if(!restaurantId){

            throw new Error(
                "Restaurant information missing."
            );

        }


        /*
           Current version expects
           one restaurant per order.
        */

        const differentRestaurant =
            cart.some(item => {

                return (
                    item.menu_items &&
                    Number(
                        item.menu_items.restaurant_id
                    ) !==
                    Number(restaurantId)
                );

            });


        if(differentRestaurant){

            throw new Error(
                "Please order items from one restaurant at a time."
            );

        }


        /* =================================
           CREATE ORDER
        ================================= */

        const orderData = {

            customer_id:
                currentUser.id,

            restaurant_id:
                restaurantId,

            customer_name:
                name,

            phone:
                phone,

            delivery_address:
                address,

            notes:
                notes || null,

            payment_method:
                paymentMethod,

            subtotal:
                subtotal,

            delivery_fee:
                deliveryFee,

            total_amount:
                totalAmount,

            status:
                "confirmed"

        };


        const orderResult =
            await sb
            .from("orders")
            .insert(
                orderData
            )
            .select("id")
            .single();


        if(orderResult.error){

            console.error(
                "Order error:",
                orderResult.error
            );

            throw new Error(
                orderResult.error.message
            );

        }


        const orderId =
            orderResult.data.id;


        /* =================================
           CREATE ORDER ITEMS
        ================================= */

        const orderItems =
            cart
            .filter(
                item => item.menu_items
            )
            .map(item => {

                const food =
                    item.menu_items;

                return {

                    order_id:
                        orderId,

                    menu_item_id:
                        food.id,

                    item_name:
                        food.name,

                    quantity:
                        Number(
                            item.quantity || 1
                        ),

                    unit_price:
                        Number(
                            food.price || 0
                        )

                };

            });


        if(orderItems.length === 0){

            throw new Error(
                "No valid items found."
            );

        }


        const itemsResult =
            await sb
            .from("order_items")
            .insert(
                orderItems
            );


        if(itemsResult.error){

            console.error(
                "Order items error:",
                itemsResult.error
            );


            /*
               Remove incomplete order
               if order_items insert fails.
            */

            await sb
                .from("orders")
                .delete()
                .eq(
                    "id",
                    orderId
                )
                .eq(
                    "customer_id",
                    currentUser.id
                );


            throw new Error(
                itemsResult.error.message
            );

        }


        /* =================================
           CLEAR CART
        ================================= */

        const clearResult =
            await sb
            .from("cart_items")
            .delete()
            .eq(
                "customer_id",
                currentUser.id
            );


        if(clearResult.error){

            console.error(
                "Cart clear error:",
                clearResult.error
            );

        }


        /* =================================
           SUCCESS
        ================================= */

        cart = [];

        updateCartCount();


        showMessage(
            "Order placed successfully! Order #" +
            orderId,
            "success"
        );


        button.textContent =
            "Order Placed ✓";


        setTimeout(() => {

            window.location.href =
                "my-orders.html";

        },1500);


    }
    catch(error){

        console.error(error);


        showMessage(
            "Order place cheyyan kazhinjilla: " +
            error.message
        );


        button.disabled = false;

        button.textContent =
            "Place Order";

    }

}


/* =========================================
   NAVIGATION
========================================= */

function goCart(){

    window.location.href =
        "cart.html";

}


function goBack(){

    window.history.back();

}


/* =========================================
   START
========================================= */

loadCart();

</script>
