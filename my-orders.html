<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>My Orders - Beatroot</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Inter,Arial,Helvetica,sans-serif;
    background:#f7f8fc;
    color:#171717;
}

a,
a:link,
a:visited,
a:hover,
a:active,
a:focus{
    text-decoration:none !important;
}


/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;

    height:72px;

    background:rgba(255,255,255,.95);
    backdrop-filter:blur(14px);

    border-bottom:1px solid #eeeeee;
}

.header-inner{
    max-width:1200px;
    height:100%;
    margin:auto;
    padding:0 22px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:29px;
    font-weight:900;
    letter-spacing:-1.5px;
    color:#ef3e3e;
}

.logo span{
    color:#171717;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.header-btn{
    border:0;
    border-radius:10px;

    padding:10px 15px;

    font-size:14px;
    font-weight:700;

    cursor:pointer;
}

.back-btn{
    background:#f1f2f5;
    color:#222;
}

.cart-btn{
    background:#ef3e3e;
    color:#fff;
}


/* =========================
   PAGE
========================= */

.container{
    max-width:1200px;
    margin:auto;

    padding:40px 22px 70px;
}

.page-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;

    gap:20px;

    margin-bottom:28px;
}

.page-title{
    font-size:38px;
    font-weight:900;
    letter-spacing:-1px;

    margin-bottom:7px;
}

.page-subtitle{
    color:#777;
    font-size:14px;
}


/* =========================
   REFRESH
========================= */

.refresh-btn{
    border:1px solid #e3e3e3;

    background:#fff;

    color:#333;

    border-radius:10px;

    padding:10px 15px;

    font-size:13px;
    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.refresh-btn:hover{
    border-color:#ef3e3e;
    color:#ef3e3e;
}


/* =========================
   MESSAGE
========================= */

.message{
    display:none;

    padding:14px 16px;

    border-radius:11px;

    margin-bottom:20px;

    font-size:14px;

    line-height:1.5;
}

.message.error{
    display:block;

    background:#fff0f0;

    color:#c62828;

    border:1px solid #ffd0d0;
}


/* =========================
   ORDERS
========================= */

.orders-list{
    display:grid;
    gap:18px;
}

.order-card{

    background:#fff;

    border:1px solid #e7e7e7;

    border-radius:20px;

    overflow:hidden;

    box-shadow:
        0 8px 30px rgba(0,0,0,.05);
}


/* =========================
   ORDER TOP
========================= */

.order-top{

    padding:20px 22px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    border-bottom:1px solid #eeeeee;
}

.order-id{

    font-size:15px;

    font-weight:850;

    margin-bottom:5px;
}

.order-date{

    color:#888;

    font-size:12px;
}

.status{

    display:inline-flex;

    align-items:center;

    gap:6px;

    padding:7px 11px;

    border-radius:20px;

    font-size:11px;

    font-weight:850;

    text-transform:capitalize;
}


/* STATUS COLORS */

.status.confirmed,
.status.pending{
    background:#fff7df;
    color:#9a6700;
}

.status.preparing{
    background:#fff0e0;
    color:#c45b00;
}

.status.ready{
    background:#eaf4ff;
    color:#1265a5;
}

.status.out-for-delivery{
    background:#f0eaff;
    color:#7048b8;
}

.status.delivered{
    background:#eaf8ef;
    color:#16803c;
}

.status.cancelled{
    background:#fff0f0;
    color:#c62828;
}


/* =========================
   RESTAURANT
========================= */

.restaurant-row{

    padding:18px 22px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;
}

.restaurant-name{

    font-size:18px;

    font-weight:850;
}

.restaurant-label{

    color:#888;

    font-size:12px;

    margin-bottom:4px;
}

.payment-badge{

    color:#666;

    background:#f5f5f5;

    border-radius:8px;

    padding:7px 10px;

    font-size:11px;

    font-weight:700;
}


/* =========================
   ITEMS
========================= */

.items-section{

    padding:0 22px 10px;
}

.item{

    display:flex;

    align-items:center;

    gap:13px;

    padding:13px 0;

    border-top:1px solid #eeeeee;
}

.item-image{

    width:58px;
    height:58px;

    border-radius:10px;

    object-fit:cover;

    background:#f1f1f1;

    flex-shrink:0;
}

.item-info{

    flex:1;

    min-width:0;
}

.item-name{

    font-size:14px;

    font-weight:800;

    margin-bottom:4px;
}

.item-quantity{

    color:#777;

    font-size:12px;
}

.item-price{

    font-size:14px;

    font-weight:800;

    white-space:nowrap;
}


/* =========================
   ORDER BOTTOM
========================= */

.order-bottom{

    background:#fafafa;

    border-top:1px solid #eeeeee;

    padding:18px 22px;

    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:20px;
}

.delivery-address{

    max-width:600px;

    color:#777;

    font-size:12px;

    line-height:1.5;
}

.delivery-address strong{

    display:block;

    color:#333;

    font-size:12px;

    margin-bottom:4px;
}

.total-box{

    text-align:right;

    white-space:nowrap;
}

.total-label{

    color:#777;

    font-size:12px;

    margin-bottom:4px;
}

.total-amount{

    font-size:20px;

    font-weight:900;
}


/* =========================
   EMPTY
========================= */

.empty{

    background:#fff;

    border:1px solid #e7e7e7;

    border-radius:20px;

    text-align:center;

    padding:80px 20px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.04);
}

.empty-icon{

    font-size:58px;

    margin-bottom:15px;
}

.empty h2{

    font-size:25px;

    margin-bottom:8px;
}

.empty p{

    color:#777;

    font-size:14px;

    margin-bottom:24px;
}

.browse-btn{

    display:inline-block;

    background:#ef3e3e;

    color:#fff;

    padding:13px 22px;

    border-radius:10px;

    font-size:14px;

    font-weight:800;
}


/* =========================
   LOADING
========================= */

.loading{

    background:#fff;

    border:1px solid #e7e7e7;

    border-radius:20px;

    padding:70px 20px;

    text-align:center;

    color:#777;
}

.spinner{

    width:36px;
    height:36px;

    border:4px solid #eee;

    border-top-color:#ef3e3e;

    border-radius:50%;

    margin:0 auto 15px;

    animation:spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================
   FOOTER
========================= */

.footer{

    background:#111827;

    color:#fff;

    padding:35px 22px;
}

.footer-inner{

    max-width:1200px;

    margin:auto;

    text-align:center;
}

.footer-logo{

    font-size:25px;

    font-weight:900;

    margin-bottom:8px;
}

.footer-logo span{

    color:#ef3e3e;
}

.footer p{

    color:#9ca3af;

    font-size:13px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .header{
        height:64px;
    }

    .header-inner{
        padding:0 15px;
    }

    .logo{
        font-size:25px;
    }

    .back-btn{
        display:none;
    }

    .cart-btn{
        padding:9px 12px;
        font-size:12px;
    }

    .container{
        padding:28px 15px 50px;
    }

    .page-top{
        align-items:flex-start;
    }

    .page-title{
        font-size:30px;
    }

    .refresh-btn{
        padding:9px 11px;
        font-size:12px;
    }

    .order-top{
        padding:17px;
    }

    .restaurant-row{
        padding:16px 17px;
    }

    .items-section{
        padding:0 17px 8px;
    }

    .order-bottom{
        padding:16px 17px;
    }

}

@media(max-width:500px){

    .order-top{
        align-items:flex-start;
    }

    .restaurant-row{
        align-items:flex-start;
    }

    .order-bottom{
        display:block;
    }

    .total-box{
        text-align:left;
        margin-top:14px;
    }

    .delivery-address{
        max-width:none;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="header-inner">

        <a
            href="../index.html"
            class="logo">

            Beat<span>root</span>

        </a>


        <div class="header-right">

            <button
                class="header-btn back-btn"
                onclick="goBack()">

                ← Back

            </button>


            <button
                class="header-btn cart-btn"
                onclick="goCart()">

                🛒 Cart
                (<span id="cartCount">0</span>)

            </button>

        </div>

    </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="container">


    <div class="page-top">

        <div>

            <h1 class="page-title">
                My Orders
            </h1>

            <p class="page-subtitle">
                Track and view your previous orders.
            </p>

        </div>


        <button
            class="refresh-btn"
            onclick="loadOrders()">

            ↻ Refresh

        </button>

    </div>


    <div
        id="message"
        class="message">
    </div>


    <div
        id="ordersArea">

        <div class="loading">

            <div class="spinner"></div>

            Loading your orders...

        </div>

    </div>


</main>



<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

    <div class="footer-inner">

        <div class="footer-logo">

            Beat<span>root</span>

        </div>

        <p>
            Delicious food. Easy ordering.
        </p>

    </div>

</footer>



<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://jhihjnsxazmftdqlitgk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_r_zMn0-GhFNtuvs5-UOo9w_D8SW8J57";

const sb =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   GLOBAL
========================================= */

let currentUser = null;

let orders = [];


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================
   MESSAGE
========================================= */

function showError(text){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message error";

}

function hideMessage(){

    const box =
        document.getElementById("message");

    box.textContent = "";

    box.className =
        "message";

}


/* =========================================
   AUTH
========================================= */

async function checkUser(){

    const result =
        await sb.auth.getUser();


    if(
        result.error ||
        !result.data.user
    ){

        window.location.href =
            "login.html";

        return false;

    }


    currentUser =
        result.data.user;

    return true;

}


/* =========================================
   LOAD CART COUNT
========================================= */

async function loadCartCount(){

    if(!currentUser){
        return;
    }


    const result =
        await sb
        .from("cart_items")
        .select(
            "quantity"
        )
        .eq(
            "customer_id",
            currentUser.id
        );


    if(result.error){

        console.log(
            "Cart count error:",
            result.error
        );

        return;

    }


    const count =
        (result.data || [])
        .reduce(
            (sum,item)=>
                sum +
                Number(
                    item.quantity || 0
                ),
            0
        );


    document.getElementById(
        "cartCount"
    ).textContent = count;

}


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders(){

    hideMessage();


    const area =
        document.getElementById(
            "ordersArea"
        );


    area.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            Loading your orders...

        </div>

    `;


    const authenticated =
        await checkUser();


    if(!authenticated){
        return;
    }


    await loadCartCount();


    /*
       Load orders first.
    */

    const result =
        await sb
        .from("orders")
        .select(`
            *,
            restaurants (
                id,
                name
            )
        `)
        .eq(
            "customer_id",
            currentUser.id
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(result.error){

        console.error(
            "Orders error:",
            result.error
        );


        showError(
            "Orders load cheyyan kazhinjilla: " +
            result.error.message
        );


        area.innerHTML = "";

        return;

    }


    orders =
        result.data || [];


    if(orders.length === 0){

        renderEmpty();

        return;

    }


    /*
       Load order items separately.
       This avoids problems if the foreign
       key relation name is different.
    */

    const orderIds =
        orders.map(
            order => order.id
        );


    const itemsResult =
        await sb
        .from("order_items")
        .select("*")
        .in(
            "order_id",
            orderIds
        );


    if(itemsResult.error){

        console.error(
            "Order items error:",
            itemsResult.error
        );

        /*
           Still show orders even if
           item details cannot load.
        */

        orders.forEach(order => {

            order.order_items = [];

        });

    }
    else{

        const items =
            itemsResult.data || [];


        orders.forEach(order => {

            order.order_items =
                items.filter(
                    item =>
                        String(
                            item.order_id
                        ) ===
                        String(order.id)
                );

        });

    }


    renderOrders();

}


/* =========================================
   EMPTY
========================================= */

function renderEmpty(){

    document.getElementById(
        "ordersArea"
    ).innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                📦
            </div>

            <h2>
                No orders yet
            </h2>

            <p>
                You haven't placed any orders yet.
                Start exploring restaurants and order
                something delicious.
            </p>

            <a
                href="restaurants.html"
                class="browse-btn">

                Browse Restaurants

            </a>

        </div>

    `;

}


/* =========================================
   FORMAT DATE
========================================= */

function formatDate(value){

    if(!value){
        return "-";
    }


    const date =
        new Date(value);


    if(isNaN(date.getTime())){
        return String(value);
    }


    return date.toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================
   STATUS CLASS
========================================= */

function statusClass(status){

    const value =
        String(
            status || "pending"
        )
        .toLowerCase()
        .trim();


    return value
        .replace(/\s+/g,"-");

}


/* =========================================
   STATUS TEXT
========================================= */

function statusText(status){

    if(!status){
        return "Pending";
    }


    const value =
        String(status)
        .replace(/[-_]+/g," ");


    return value
        .replace(
            /\w\S*/g,
            word =>
                word.charAt(0).toUpperCase() +
                word.substring(1).toLowerCase()
        );

}


/* =========================================
   PAYMENT TEXT
========================================= */

function paymentText(value){

    if(!value){
        return "Not specified";
    }


    if(
        String(value).toLowerCase()
        === "cod"
    ){

        return "Cash on Delivery";

    }


    if(
        String(value).toLowerCase()
        === "online"
    ){

        return "Online Payment";

    }


    return String(value);

}


/* =========================================
   RENDER ORDERS
========================================= */

function renderOrders(){

    const area =
        document.getElementById(
            "ordersArea"
        );


    let html = "";


    orders.forEach(order => {


        const restaurantName =
            order.restaurants?.name ||
            "Restaurant";


        const status =
            statusText(
                order.status
            );


        const statusClassName =
            statusClass(
                order.status
            );


        const items =
            order.order_items || [];


        let itemsHTML = "";


        if(items.length === 0){

            itemsHTML = `

                <div
                    style="
                        padding:18px 0;
                        color:#888;
                        font-size:13px;
                    ">

                    Order item details unavailable.

                </div>

            `;

        }
        else{

            itemsHTML =
                items
                .map(item => {


                    const quantity =
                        Number(
                            item.quantity || 1
                        );


                    const unitPrice =
                        Number(
                            item.unit_price || 0
                        );


                    const total =
                        quantity *
                        unitPrice;


                    const image =
                        item.image_url ||
                        "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=300&q=80";


                    return `

                        <div class="item">

                            <img
                                class="item-image"
                                src="${escapeHTML(image)}"
                                alt="${escapeHTML(
                                    item.item_name ||
                                    "Food"
                                )}"
                            >


                            <div class="item-info">

                                <div class="item-name">

                                    ${escapeHTML(
                                        item.item_name ||
                                        "Food Item"
                                    )}

                                </div>


                                <div class="item-quantity">

                                    ${quantity}
                                    ×
                                    ₹${unitPrice.toFixed(2)}

                                </div>

                            </div>


                            <div class="item-price">

                                ₹${total.toFixed(2)}

                            </div>

                        </div>

                    `;

                })
                .join("");

        }


        const totalAmount =
            Number(
                order.total_amount || 0
            );


        const deliveryAddress =
            order.delivery_address ||
            "Delivery address not available";


        html += `

            <div class="order-card">


                <!-- ORDER HEADER -->

                <div class="order-top">

                    <div>

                        <div class="order-id">

                            Order #${escapeHTML(
                                order.id
                            )}

                        </div>

                        <div class="order-date">

                            ${formatDate(
                                order.created_at
                            )}

                        </div>

                    </div>


                    <span
                        class="status ${statusClassName}">

                        ●
                        ${escapeHTML(status)}

                    </span>

                </div>



                <!-- RESTAURANT -->

                <div class="restaurant-row">

                    <div>

                        <div class="restaurant-label">
                            Restaurant
                        </div>

                        <div class="restaurant-name">

                            🍽️
                            ${escapeHTML(
                                restaurantName
                            )}

                        </div>

                    </div>


                    <div class="payment-badge">

                        💳
                        ${escapeHTML(
                            paymentText(
                                order.payment_method
                            )
                        )}

                    </div>

                </div>



                <!-- ITEMS -->

                <div class="items-section">

                    ${itemsHTML}

                </div>



                <!-- BOTTOM -->

                <div class="order-bottom">

                    <div class="delivery-address">

                        <strong>
                            📍 Delivery Address
                        </strong>

                        ${escapeHTML(
                            deliveryAddress
                        )}

                    </div>


                    <div class="total-box">

                        <div class="total-label">
                            Total Amount
                        </div>

                        <div class="total-amount">

                            ₹${totalAmount.toFixed(2)}

                        </div>

                    </div>

                </div>


            </div>

        `;

    });


    area.innerHTML = `

        <div class="orders-list">

            ${html}

        </div>

    `;

}


/* =========================================
   NAVIGATION
========================================= */

function goCart(){

    window.location.href =
        "cart.html";

}


function goBack(){

    if(
        document.referrer &&
        document.referrer.includes(
            window.location.hostname
        )
    ){

        window.history.back();

    }
    else{

        window.location.href =
            "../index.html";

    }

}


/* =========================================
   START
========================================= */

loadOrders();

</script>

</body>

</html>
